name: Cezarion
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(MOBILE_SWIFT_CONDITIONS)
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG $(MOBILE_SWIFT_CONDITIONS)
configFiles:
  Debug: ProductIdentity.xcconfig
  Release: ProductIdentity.xcconfig
targets:
  Cezarion:
    type: application
    platform: iOS
    sources: [Cezarion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBILE_APP_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Cezarion/Info.plist
      properties:
        CFBundleDisplayName: $(MOBILE_DISPLAY_NAME)
        MobileMoveDisplayName: $(MOBILE_MOVE_DISPLAY_NAME)
        MobileFinalOldApp: $(MOBILE_FINAL_OLD_APP)
        MobileStoreURLBase64: $(MOBILE_STORE_URL_BASE64)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: $(MOBILE_DISPLAY_NAME) uses the camera only when you choose to take a photo or video to attach in the cockpit.
        NSMicrophoneUsageDescription: $(MOBILE_DISPLAY_NAME) uses the microphone only when you record a video to attach in the cockpit.
  CezarionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Cezarion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBILE_TEST_ID_PREFIX).CezarionTests
        GENERATE_INFOPLIST_FILE: YES
  CezarionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Cezarion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOBILE_TEST_ID_PREFIX).CezarionUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cezarion:
    build:
      targets:
        Cezarion: all
    test:
      targets: [CezarionTests, CezarionUITests]
      environmentVariables:
        MOBILE_TEST_DISPLAY_NAME: "$(MOBILE_DISPLAY_NAME)"
        MOBILE_TEST_ENDPOINT: "$(MOBILE_TEST_ENDPOINT)"
        MOBILE_TEST_AUTH_ORIGIN: "$(MOBILE_TEST_AUTH_ORIGIN)"
