<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: engines that honor it shrink the viewport under the virtual
         keyboard themselves; the visualViewport --kb watcher (lib/keyboard-inset.ts) is the
         required iOS fallback beneath it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- The dark mark by default (the app's default palette); the script below repoints it at
         the light mark before first paint when the resolved theme is light. ThemeProvider keeps
         it in sync after that (applyFaviconTheme) — the swap must not need a reload. -->
    <link rel="icon" href="/cezarion-mark-dark.svg" />
    <title>cezar</title>
    <!-- Theme before first paint — no flash. Mirrors resolveTheme()/applyResolvedTheme() +
         applyFaviconTheme() in src/lib/theme.ts; keep the two in sync. Shares the legacy
         cockpit's `cez-theme` key ('light' | 'dark' | 'system'); anything else falls back to
         dark, as legacy does. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('cez-theme')
          var light =
            pref === 'light' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.classList.toggle('light', light)
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'
          // The themed tab icon (#143) — same resolved value as the class above.
          var icon = document.querySelector('link[rel="icon"]')
          if (icon) icon.href = light ? '/cezarion-mark-light.svg' : '/cezarion-mark-dark.svg'
        } catch (e) {
          // Storage or matchMedia unavailable — the default dark tokens already apply.
        }
        // Density + reading width before first paint, from the localStorage MIRROR of
        // ui-state.json (src/lib/appearance.ts owns the contract; keep the two in sync).
        // The one-option Cezarion accent is implicit, while its value remains persisted.
        try {
          var density = localStorage.getItem('cez-density')
          if (density === 'compact' || density === 'ultra')
            document.documentElement.dataset.density = density
          if (localStorage.getItem('cez-width') === 'wide')
            document.documentElement.dataset.width = 'wide'
        } catch (e) {
          // Storage unavailable — comfortable/narrow defaults already apply.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
