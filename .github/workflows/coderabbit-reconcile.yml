name: Reconcile CodeRabbit admission

# Default-branch control plane only. Never execute PR code.
on:
  check_run:
    types: [created, completed]
  workflow_run:
    workflows: [CI, CodeRabbit review signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to re-check after resolving a thread by hand
        required: true
        type: number
permissions: {}
# Discovery validates the event and supplies reliable PR numbers before locking.
# Independent events select at most four associated PRs; empty provider
# associations use bounded inventory lookup for matching current heads only.
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      numbers: ${{ steps.discover.outputs.numbers }}
    steps:
      - name: Check out trusted discovery scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: discover
        with:
          retries: 0
          script: |
            const { discover } = require('./.github/scripts/coderabbit-reconcile.cjs');
            const result = await discover({ github, ...context.repo, eventName: context.eventName,
              payload: context.payload, log: message => core.info(message) });
            core.setOutput('numbers', JSON.stringify(result.numbers));
  reconcile:
    needs: discover
    if: needs.discover.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.numbers) }}
    # Different trigger kinds use the same lock after trusted PR discovery.
    # A coalesced job still reads this PR's live state when it gets the lock.
    concurrency:
      group: coderabbit-admission-pr-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write # Durable recovery claim only; never grants admission.
      actions: write # Targeted native rerun only.
    steps:
      - name: Check out trusted reconciliation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check whether a recovery sender is needed
        id: recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
          RECONCILE_PR: ${{ matrix.pr }}
        with:
          retries: 0
          script: |
            const { recoveryNeeded } = require('./.github/scripts/coderabbit-reconcile.cjs');
            const configured = /^Iv[a-zA-Z0-9]+$/.test(process.env.RELEASE_APP_CLIENT_ID || '')
              && /^[a-z0-9][a-z0-9-]*\[bot\]$/.test(process.env.RELEASE_APP_BOT_LOGIN || '')
              && process.env.HAS_PRIVATE_KEY === 'true';
            const needed = configured && await recoveryNeeded({ github, ...context.repo,
              pullNumber: Number(process.env.RECONCILE_PR), releaseAppBotLogin: process.env.RELEASE_APP_BOT_LOGIN });
            core.setOutput('needed', String(needed));
      - name: Create narrowly scoped recovery sender token
        id: recovery_app
        if: steps.recovery.outputs.needed == 'true'
        continue-on-error: true # Missing/unavailable existing App leaves manual recovery.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Reconcile admission and bounded recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          RECOVERY_APP_SLUG: ${{ steps.recovery_app.outputs.app-slug }}
          RECOVERY_APP_TOKEN: ${{ steps.recovery_app.outputs.token }}
          RECONCILE_PR: ${{ matrix.pr }}
        with:
          retries: 0
          script: |
            const { reconcile } = require('./.github/scripts/coderabbit-reconcile.cjs');
            const recoverySender = process.env.RECOVERY_APP_TOKEN ? {
              github: getOctokit(process.env.RECOVERY_APP_TOKEN), slug: process.env.RECOVERY_APP_SLUG,
            } : undefined;
            const result = await reconcile({ github, ...context.repo,
              pullNumber: Number(process.env.RECONCILE_PR), runId: Number(context.runId), recoverySender,
              releaseAppBotLogin: process.env.RELEASE_APP_BOT_LOGIN, log: message => core.info(message) });
            core.info(JSON.stringify(result));
