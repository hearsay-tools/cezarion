name: Reconcile CodeRabbit admission

# Default-branch control plane only. No PR checkout or model calls. One per-PR
# job reads the live head once, reruns the native review job when fresh
# admission differs from its result, and syncs the board (it absorbed PR
# Readiness, hearsay-tools/cezarion#3288). It never changes draft state.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches:
      - main
  check_run:
    types: [created, completed]
  workflow_run:
    workflows: [CI, CodeRabbit review signal]
    types: [completed]
  # Actions has no review-thread event: after a manual thread change, dispatch
  # this workflow with the PR number.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to re-check after resolving a thread by hand
        required: true
        type: number
permissions: {}
# Discovery validates the event and supplies reliable PR numbers before locking.
# Independent events select at most four associated PRs; empty provider
# associations use bounded inventory lookup for matching current heads only.
jobs:
  discover:
    # check_run fires for every check in the repository; only CodeRabbit's can
    # select a PR, so no other app's check starts a job. The script still
    # validates every event it receives.
    if: >-
      github.event_name != 'check_run'
      || (github.event.check_run.app.id == 347564 && github.event.check_run.app.slug == 'coderabbitai'
      && github.event.check_run.name == 'CodeRabbit')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      numbers: ${{ steps.discover.outputs.numbers }}
    steps:
      - name: Check out trusted discovery scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Optional: reads use the release App's own API budget. Without the App or
      # its read permissions this step fails quietly and reads use GITHUB_TOKEN.
      - name: Create read token
        id: read_app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-pull-requests: read
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: discover
        env:
          READ_TOKEN: ${{ steps.read_app.outputs.token }}
        with:
          retries: 0
          script: |
            const { discover, countTokens } = require('./.github/scripts/coderabbit-reconcile.cjs');
            core.info(process.env.READ_TOKEN ? 'Reads use the release App token.' : 'Reads use GITHUB_TOKEN.');
            const reads = process.env.READ_TOKEN ? getOctokit(process.env.READ_TOKEN) : github;
            // One line per token at the end, also when the job fails.
            const summaries = countTokens([['GITHUB_TOKEN', github], ['Release App token (reads)', reads]]);
            try {
              const result = await discover({ github: reads, ...context.repo, eventName: context.eventName,
                payload: context.payload, log: message => core.info(message) });
              core.setOutput('numbers', JSON.stringify(result.numbers));
            } finally {
              for (const line of summaries()) core.info(line);
            }
  reconcile:
    needs: discover
    if: needs.discover.outputs.numbers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.numbers) }}
    # Different trigger kinds use the same lock after trusted PR discovery.
    # A coalesced job still reads this PR's live state when it gets the lock.
    concurrency:
      group: coderabbit-admission-pr-${{ matrix.pr }}
      cancel-in-progress: false
    # GITHUB_TOKEN keeps every read permission for the fallback. Its only write
    # is the targeted rerun; the trusted script validates native provenance.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: write
    steps:
      - name: Check out trusted reconciliation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch may name any branch; the script always comes from main.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # Optional: reads use the release App's own API budget. Without the App or
      # its read permissions this step fails quietly and reads use GITHUB_TOKEN.
      # The App has no Actions write, so the rerun stays on GITHUB_TOKEN.
      - name: Create read token
        id: read_app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-pull-requests: read
          permission-statuses: read
      # Optional: board sync needs the release App's Organization projects
      # permission. Without it this step fails quietly and only the sync skips.
      - name: Create board token
        id: board_app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
      - name: Reconcile admission and follow the head with board status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          READ_TOKEN: ${{ steps.read_app.outputs.token }}
          BOARD_TOKEN: ${{ steps.board_app.outputs.token }}
          RECONCILE_PR: ${{ matrix.pr }}
        with:
          retries: 0
          script: |
            const { reconcile, countTokens } = require('./.github/scripts/coderabbit-reconcile.cjs');
            core.info(process.env.READ_TOKEN ? 'Reads use the release App token.' : 'Reads use GITHUB_TOKEN.');
            const readGithub = process.env.READ_TOKEN ? getOctokit(process.env.READ_TOKEN) : github;
            const projectGithub = process.env.BOARD_TOKEN ? getOctokit(process.env.BOARD_TOKEN) : null;
            // One line per token at the end, also when the job fails. Under the
            // read token's core floor only the board sync skips.
            const summaries = countTokens([['GITHUB_TOKEN', github], ['Release App token (reads)', readGithub],
              ['Release App token (board)', projectGithub]]);
            try {
              const result = await reconcile({ github, readGithub, projectGithub, ...context.repo,
                pullNumber: Number(process.env.RECONCILE_PR),
                releaseAppBotLogin: process.env.RELEASE_APP_BOT_LOGIN, log: message => core.info(message) });
              core.info(JSON.stringify(result));
            } finally {
              for (const line of summaries()) core.info(line);
            }
