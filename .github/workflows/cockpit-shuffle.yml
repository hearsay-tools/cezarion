name: Weekly cockpit shuffle

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: Replay seed (defaults to the workflow run ID)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cockpit-shuffle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cockpit-shuffle:
    name: Shuffled cockpit shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHUFFLE_SEED: ${{ inputs.seed || github.run_id }}
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'
      - name: Install Node.js from nodejs.org
        uses: ./.github/actions/node-dist
        with:
          node-version-file: .node-version
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          token: ''
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Run shuffled browser cases
        shell: bash
        run: |
          set -o pipefail
          [[ "$SHUFFLE_SEED" =~ ^[0-9]+$ ]] || { echo 'Seed must be an integer'; exit 1; }
          echo "Shuffle seed: $SHUFFLE_SEED; shard: $SHARD/4"
          echo "Replay: npm run test:e2e -- --sequence.shuffle --sequence.seed=$SHUFFLE_SEED --shard=$SHARD/4" >> "$GITHUB_STEP_SUMMARY"
          npm run test:e2e -- --sequence.shuffle --sequence.seed="$SHUFFLE_SEED" --shard="$SHARD/4" 2>&1 | tee e2e.log
          node .github/scripts/require-e2e-passed.cjs < e2e.log
      - name: Upload results and failure bundles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-shuffle-${{ matrix.shard }}
          path: |
            e2e.log
            .ai/qa/failures/
          if-no-files-found: ignore
          retention-days: 14
