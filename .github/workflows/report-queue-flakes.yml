# Files a `flake-report` issue when a merge-queue shard failed its first test run and passed
# its whole-shard rerun (docs/sdlc/ci.md § Flake reports from the merge queue;
# hearsay-tools/cezarion#3291). The shard runs queued code with a read-only token, so it only
# uploads the names of the files that failed. This job runs trusted default-branch code: it
# never checks out or runs the queued commit, and reads the names as untrusted text. A report
# starts no task; a maintainer who confirms it adds `flaky-test`.
name: Report Merge Queue Flakes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# The issue-write lock for the flake-report markers. Never scope it per run.
concurrency:
  group: queue-flake-reports
  queue: max
  cancel-in-progress: false

jobs:
  report:
    # The entry's verdict is already settled: this job reads the finished run and changes nothing in it.
    if: github.event.workflow_run.event == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # the run's jobs, steps and artifacts
      contents: read # the trusted checkout and the merge group's tree
      issues: write
    steps:
      # For workflow_run, github.sha is the default branch's head, never the queued commit.
      - name: Check out trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report flaky shards
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # A write may have succeeded before an HTTP error reached us. Rerunning the job
          # rechecks the durable markers before any next write.
          retries: 0
          script: |
            try {
              const { reportQueueFlakes } = require('./.github/scripts/report-queue-flakes.cjs');
              const result = await reportQueueFlakes({
                github,
                ...context.repo,
                event: context.payload,
                log: message => {
                  core.info(message);
                  core.summary.addRaw(message + '\n');
                },
              });
              core.summary.addRaw(`Flake reporting completed: ${result.flakes} flaked shard(s), ${result.reported} new write(s).\n`);
            } catch (error) {
              // Never print API error objects: they can include request headers or signed URLs.
              const message = error?.visible === true
                ? error.message
                : 'Flake reporting failed. Check Actions/Issues permissions and API availability, then rerun this job. Existing issue markers make reruns safe.';
              core.setFailed(message);
              core.summary.addRaw(message + '\n');
            } finally {
              await core.summary.write();
            }
