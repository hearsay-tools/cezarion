name: Windows test environment lease
on:
  pull_request:
    paths:
      - '.ai/scripts/test-env-*'
      - '.ai/scripts/e2e.sh'
      - '.github/scripts/test-env-windows*'
      - '.github/workflows/test-env-windows.yml'
      - 'packages/cezar/src/delegation/idle-test-app*'
      - 'packages/cezar/src/delegation/windows-test-app*'
      - 'packages/cezar/src/delegation/workspace.ts'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-lease:
    name: Native Windows lease verification
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Probe native process lifetime and Git Bash identity
        shell: pwsh
        run: ./.github/scripts/test-env-windows-probe.ps1
      - name: Prove the Windows regression against the pre-fix helper
        shell: pwsh
        env:
          TEST_ENV_PROOF_BASE: '07039865b6483d4b40ec8816818c0ec5497a87db'
        run: |
          git fetch --depth=1 origin $env:TEST_ENV_PROOF_BASE
          $output = node --test .github/scripts/test-env-windows.test.mjs 2>&1 | Out-String
          $failed = $LASTEXITCODE -ne 0
          Write-Output $output
          if (!$failed -or $output -notmatch 'cannot verify test environment lease identity') {
            throw 'Expected the pre-fix Windows identity failure'
          }
          # GitHub's pwsh wrapper otherwise propagates the expected red exit.
          $global:LASTEXITCODE = 0
      - name: Prove shell descendants escape the pre-broker job
        shell: pwsh
        env:
          TEST_ENV_PROOF_BASE: '3d352052def6d38bc9f6172b6f3c06089f960f35'
        run: |
          git fetch --depth=1 origin $env:TEST_ENV_PROOF_BASE
          $output = node --test .github/scripts/test-env-windows.test.mjs 2>&1 | Out-String
          $failed = $LASTEXITCODE -ne 0
          Write-Output $output
          if (!$failed -or $output -notmatch 'mutator must belong to the lifetime job') {
            throw 'Expected the pre-broker mutator containment failure'
          }
          $global:LASTEXITCODE = 0
      - name: Prove the nested broker regression
        shell: pwsh
        env:
          TEST_ENV_PROOF_BASE: 'a1c38255f5e1c32a6b0d71b9647a935ac1943320'
        run: |
          git fetch --depth=1 origin $env:TEST_ENV_PROOF_BASE
          $output = node --test .github/scripts/test-env-windows.test.mjs 2>&1 | Out-String
          $failed = $LASTEXITCODE -ne 0
          Write-Output $output
          if (!$failed -or $output -notmatch 'cached server must survive every enclosing job') {
            throw 'Expected the nested cached-server lifetime failure'
          }
          $global:LASTEXITCODE = 0
      - name: Prove the broker environment regression
        shell: pwsh
        env:
          TEST_ENV_PROOF_BASE: 'fce355d201ee86ebff914a42fe23c0bc4787f7dc'
        run: |
          git fetch --depth=1 origin $env:TEST_ENV_PROOF_BASE
          $output = node --test .github/scripts/test-env-windows.test.mjs 2>&1 | Out-String
          $failed = $LASTEXITCODE -ne 0
          Write-Output $output
          if (!$failed -or $output -notmatch 'cached app must inherit bootstrap environment') {
            throw 'Expected the lost bootstrap environment failure'
          }
          $global:LASTEXITCODE = 0
      - name: Verify production lease on native Windows
        shell: pwsh
        run: node --test .github/scripts/test-env-windows.test.mjs
      - name: Prove worker cleanup regression on native Windows
        shell: pwsh
        run: |
          git fetch --depth=1 origin 471fc954423631d021c94e870ef0bd3976e209a4
          git show 471fc954423631d021c94e870ef0bd3976e209a4:packages/cezar/src/delegation/idle-test-app.ts > packages/cezar/src/delegation/idle-test-app.ts
          try {
            $output = npm test -- packages/cezar/src/delegation/windows-test-app.test.ts -t 'stops the owned app' 2>&1 | Out-String
            $failed = $LASTEXITCODE -ne 0
            Write-Output $output
            if (!$failed -or $output -notmatch '"state": "complete"') {
              throw 'Expected the pre-fix worker cleanup to remain incomplete'
            }
          } finally {
            git checkout -- packages/cezar/src/delegation/idle-test-app.ts
          }
          $global:LASTEXITCODE = 0
      - name: Verify worker cleanup on native Windows
        run: npm test -- packages/cezar/src/delegation/windows-test-app.test.ts
