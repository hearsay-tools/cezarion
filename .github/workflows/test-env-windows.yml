name: Windows test environment lease
on:
  pull_request:
    paths:
      - '.ai/scripts/test-env-*'
      - '.ai/scripts/e2e.sh'
      - '.github/scripts/test-env-windows*'
      - '.github/workflows/test-env-windows.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-lease:
    name: Native Windows lease verification
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
      - name: Probe native process lifetime and Git Bash identity
        shell: pwsh
        run: ./.github/scripts/test-env-windows-probe.ps1
