name: Nightly

# The release rehearsal. Every night it takes the commit a release would take — the newest
# `main` commit whose ci.yml push run passed — runs the full suite on it, publishes it
# under the `nightly` dist-tag, and tests the published package as Release tests a
# release candidate. A failure files a `release-blocker` issue, and the Release workflow
# refuses a stable release until the last rehearsal passed
# (spec .ai/specs/2026-11-11-one-full-run-delivery-pipeline.md § Release,
# hearsay-tools/cezarion#3212; docs/publishing.md § Nightlies).
#
# `npx cezarion@nightly` gives "what is on the trunk right now" without hunting for a run
# number. Like every snapshot it publishes a PRERELEASE version under an explicit
# dist-tag, so it can never become the default install.
on:
  schedule:
    # 03:17 UTC — off the hour, where Actions' scheduled-run queue is least congested.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if main has not moved since the last nightly'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # Never cancel mid-publish: an interrupted run could leave the scoped package on
  # the registry without its alias.
  group: nightly
  cancel-in-progress: false

jobs:
  # Nothing merged since yesterday's run means tonight's build is byte-identical
  # to the one already tagged `nightly` — publishing it again would only add a
  # version nobody can tell apart. A manual dispatch skips this check by default:
  # if someone asked for a nightly from the Actions tab, they want one.
  decide:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A scheduled run always uses the default branch; this also pins the manual
    # dispatch to main, so a nightly can never be cut from a feature branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read # ci.yml push runs name the verified candidate
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      candidate: ${{ steps.candidate.outputs.sha }}
      previous: ${{ steps.candidate.outputs.previous }}
      alias: ${{ steps.candidate.outputs.alias }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the default shallow clone has no commit dates to compare,
          # so the "did main move?" check below would see an empty log every night.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js from nodejs.org
        uses: ./.github/actions/node-dist
        with:
          node-version-file: .node-version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          token: ''

      - name: Decide whether to publish
        id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced by manual dispatch — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMITS=$(git log --since="24 hours ago" --oneline HEAD | wc -l | tr -d ' ')
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits on main in the last 24h — skipping tonight's publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$COMMITS commit(s) on main in the last 24h — publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The commit a release dispatched now would take, and the `latest` version the
      # rehearsal upgrades from.
      - name: Find the verified candidate
        id: candidate
        if: steps.decide.outputs.publish == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { execFileSync } = require('node:child_process');
            const { verifiedMainCommit, npmView } = require('./.github/scripts/release-plan.cjs');
            const { releasePackages, installAlias } = require('./.github/scripts/release-packages.cjs');
            const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
            const sha = await verifiedMainCommit({ github, repo: context.repo, git, head: context.sha });
            // A package not on the registry yet has nothing to upgrade from.
            const previous = npmView(releasePackages().publication.cezar.name, { optional: true })?.distTags.latest ?? '';
            core.setOutput('sha', sha);
            core.setOutput('previous', previous);
            core.setOutput('alias', installAlias());
            await core.summary.addRaw(`Rehearsal candidate: ${sha}; upgrade from ${previous || 'nothing'}.\n`).write();

      - name: Write workflow summary
        if: steps.decide.outputs.publish != 'true'
        run: |
          {
            echo "## 🌙 Nightly skipped"
            echo ""
            echo "\`main\` has not moved in the last 24 hours — the current \`nightly\` tag is already this build."
          } >> "$GITHUB_STEP_SUMMARY"

  # The trunk can go red through the calendar alone (a dependency's new major, an
  # expired fixture), and a broken `@nightly` is worse than a missing one.
  suite:
    name: Full suite
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    uses: ./.github/workflows/full-suite.yml
    with:
      ref: ${{ needs.decide.outputs.candidate }}

  # Publishing stays on a GitHub-hosted runner: `--provenance` is refused from
  # any other kind.
  nightly:
    name: Publish nightly to npm
    needs: [decide, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && needs.suite.result == 'success'
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    outputs:
      attempted: ${{ steps.nightly.outputs.attempted }}
      dry_run: ${{ steps.nightly.outputs.dryRun }}
      result: ${{ steps.nightly.outputs.result }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.candidate }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node.js from nodejs.org
        uses: ./.github/actions/node-dist
        with:
          node-version-file: .node-version
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          token: ''
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: npm run build

      - name: Publish nightly
        id: nightly
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The channel is requested BY NAME, never inferred from the event — that is
          # what keeps any other workflow_dispatch from cutting a nightly by accident.
          CEZ_RELEASE_CHANNEL: nightly
          HSQ_RELEASE_CHANNEL: nightly
        run: node scripts/release-snapshot.mjs

      # `always()` so a failed publish still explains itself. A failed gate skips
      # this whole job; its own job and the failure reporter say why.
      - name: Write workflow summary
        if: always()
        env:
          ATTEMPTED: ${{ steps.nightly.outputs.attempted }}
          RESULT: ${{ steps.nightly.outputs.result }}
        run: |
          if [ "$ATTEMPTED" != "true" ]; then
            echo "## 🌙 Nightly did not publish (see the job log)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const r = JSON.parse(process.env.RESULT);
          console.log(`## 🌙 Nightly ${r.dryRun ? 'dry run (NPM_TOKEN not configured)' : 'published'}`);
          console.log('');
          console.log(`- Version: \`${r.version}\``);
          console.log(`- Dist-tag: \`${r.distTag}\``);
          console.log(`- Packages: ${r.publishedNames.split(',').map(name => `\`${name}\``).join(', ')}`);
          console.log('');
          console.log('```bash');
          console.log(`${r.tagCommand}          # always the latest nightly`);
          for (const line of r.installLines) console.log(line);
          console.log('```');
          EOF

  # The published-package tests a release candidate gets, on the nightly version.
  rehearsal:
    name: Rehearse the release tests
    needs: [decide, nightly]
    if: needs.nightly.result == 'success' && needs.nightly.outputs.attempted == 'true' && needs.nightly.outputs.dry_run != 'true'
    uses: ./.github/workflows/release-candidate-tests.yml
    with:
      package: ${{ fromJSON(needs.nightly.outputs.result).rootName }}
      alias: ${{ needs.decide.outputs.alias }}
      version: ${{ fromJSON(needs.nightly.outputs.result).version }}
      previous: ${{ needs.decide.outputs.previous }}
      ref: ${{ needs.decide.outputs.candidate }}

  blocker:
    name: File the rehearsal blocker
    needs: [decide, suite, nightly, rehearsal]
    # A decide job that failed before it set `publish` (no verified candidate) is a failed
    # rehearsal too.
    if: ${{ always() && (needs.decide.result == 'failure' || (needs.decide.outputs.publish == 'true' && contains(join(needs.*.result, ' '), 'failure'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: File the rehearsal blocker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ format('candidate lookup {0}, full suite {1}, publish {2}, published-package tests {3}', needs.decide.result, needs.suite.result, needs.nightly.result, needs.rehearsal.result) }}
        with:
          script: |
            const { fileReleaseBlocker } = require('./.github/scripts/release-blocker.cjs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue = await fileReleaseBlocker({ github, repo: context.repo, kind: 'rehearsal', stage: process.env.RESULTS, runUrl });
            await core.summary.addRaw(`Release blocker: ${issue.url}\n`).write();
