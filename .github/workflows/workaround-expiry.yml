name: Weekly workaround expiry

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: workaround-expiry
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted report code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js from nodejs.org
        uses: ./.github/actions/node-dist
        with:
          node-version-file: .node-version
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          token: ''
      - name: Report expired workaround markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/workaround-expiry.cjs --publish
