name: PR Readiness

# The board follows the head's required checks and review threads
# (hearsay-tools/cezarion#3288). Never changes draft state. Runs only the
# default branch's trusted script and never checks out pull-request code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches:
      - main
  workflow_run:
    workflows: [CI, CodeRabbit review signal]
    types: [completed]
  check_run:
    types: [created, completed]
  # Actions has no review-thread event: after a manual thread change, dispatch
  # reconciliation, then this workflow if the board needs refreshing.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-check
        required: true
        type: number

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      numbers: ${{ steps.discover.outputs.numbers }}
    steps:
      - name: Checkout trusted discovery script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: discover
        with:
          retries: 0
          script: |
            const { discoverReadiness } = require('./.github/scripts/pr-readiness.cjs');
            const result = await discoverReadiness({ github, ...context.repo,
              eventName: context.eventName, payload: context.payload, log: message => core.info(message) });
            core.setOutput('numbers', JSON.stringify(result.numbers));
  readiness:
    needs: discover
    if: needs.discover.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.numbers) }}
    concurrency:
      group: pr-readiness-pr-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout trusted readiness script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dispatch may name any branch; the script always comes from main.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Optional: board sync needs the release App's Organization projects
      # permission. Without it this step fails quietly and only the sync skips.
      - name: Create board token
        id: board_app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write

      - name: Follow the head's checks and threads with board status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          BOARD_TOKEN: ${{ steps.board_app.outputs.token }}
          READINESS_PR: ${{ matrix.pr }}
        with:
          retries: 0
          script: |
            const { refreshReadiness } = require('./.github/scripts/pr-readiness.cjs');
            const projectGithub = process.env.BOARD_TOKEN ? getOctokit(process.env.BOARD_TOKEN) : null;
            await refreshReadiness({
              github,
              projectGithub,
              ...context.repo,
              pullNumber: Number(process.env.READINESS_PR),
              log: (message) => core.info(message),
            });
