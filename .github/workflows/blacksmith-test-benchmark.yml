name: Blacksmith test scaling benchmark

on:
  push:
    branches: ['bench/blacksmith-test-scaling']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.suite }} on ${{ matrix.target.name }} (run ${{ matrix.repetition }})
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        suite: [vitest, e2e]
        repetition: [1, 2, 3]
        target:
          - name: x64-8
            runner: blacksmith-8vcpu-ubuntu-2404
            workers: 8
          - name: x64-16
            runner: blacksmith-16vcpu-ubuntu-2404
            workers: 16
          - name: arm64-8
            runner: blacksmith-8vcpu-ubuntu-2404-arm
            workers: 8
          - name: arm64-16
            runner: blacksmith-16vcpu-ubuntu-2404-arm
            workers: 16
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Vitest dependencies
        if: matrix.suite == 'vitest'
        run: npm ci

      - name: Build server dependencies
        if: matrix.suite == 'vitest'
        run: npm run build:server

      - name: Benchmark Vitest
        if: matrix.suite == 'vitest'
        env:
          BENCHMARK_NAME: ${{ matrix.target.name }}
          BENCHMARK_REPETITION: ${{ matrix.repetition }}
          BENCHMARK_WORKERS: ${{ matrix.target.workers }}
        run: |
          started=$(date +%s%N)
          set +e
          npm test -- --maxWorkers="$BENCHMARK_WORKERS"
          status=$?
          set -e
          ended=$(date +%s%N)
          DURATION_NS=$((ended - started)) STATUS=$status node - <<'EOF'
          const result = {
            suite: 'vitest',
            runner: process.env.BENCHMARK_NAME,
            repetition: Number(process.env.BENCHMARK_REPETITION),
            workers: Number(process.env.BENCHMARK_WORKERS),
            durationSeconds: Number(process.env.DURATION_NS) / 1e9,
            status: Number(process.env.STATUS),
          }
          console.log(`BENCHMARK_RESULT ${JSON.stringify(result)}`)
          EOF
          exit "$status"

      - name: Benchmark cockpit E2E
        if: matrix.suite == 'e2e'
        env:
          BENCHMARK_NAME: ${{ matrix.target.name }}
          BENCHMARK_REPETITION: ${{ matrix.repetition }}
        run: |
          started=$(date +%s%N)
          set +e
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
          status=$?
          set +o pipefail
          set -e
          ended=$(date +%s%N)
          DURATION_NS=$((ended - started)) STATUS=$status node - <<'EOF'
          const result = {
            suite: 'e2e',
            runner: process.env.BENCHMARK_NAME,
            repetition: Number(process.env.BENCHMARK_REPETITION),
            workers: 1,
            durationSeconds: Number(process.env.DURATION_NS) / 1e9,
            status: Number(process.env.STATUS),
          }
          console.log(`BENCHMARK_RESULT ${JSON.stringify(result)}`)
          EOF
          node .github/scripts/require-e2e-passed.cjs < e2e.log
          exit "$status"
