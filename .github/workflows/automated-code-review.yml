name: Automated Code Review

# ci.yml calls after cheap preflight; heavy verification waits for this verdict.
# workflow_call retains the trusted caller event. Dispatch judges replies on demand.
on:
  workflow_call:
    inputs:
      preflight_result:
        required: true
        type: string
      caller_run_id:
        required: true
        type: string
      caller_attempt:
        required: true
        type: string
      caller_head:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

# ci.yml's own group already cancels a superseded CI run, review included. The
# event name keeps a manual dispatch from cancelling the review inside a CI run,
# which would turn that PR's required check red.
concurrency:
  group: automated-code-review-${{ github.event_name }}-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  validate-provider:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      provider: ${{ steps.provider.outputs.provider }}
    steps:
      - name: Check out release-bump classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject untrusted bot actors
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verified manifest-only bot release/v* bumps and ledger-only App
          # upstream-scan PRs: review-round sets can_review=false. Allow the
          # actor through so the aggregate stays green.
          if [ -n "${PR_NUMBER:-}" ]; then
            if LIVE_HEAD_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" \
              && PR_FILES="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
              export LIVE_HEAD_SHA PR_FILES PR_FILES_OK=1
            fi
          fi
          if node -e 'const c = require("./.github/scripts/release-bump-pr.cjs"); process.exit(c.classifyFromEnv() || c.classifyUpstreamScanFromEnv?.() ? 0 : 1)'; then
            exit 0
          fi
          if [[ "$ACTOR" == *'[bot]' && "$ACTOR" != 'claude[bot]' ]]; then
            echo "Unsupported bot actor: $ACTOR. Only claude[bot] may trigger automated review." >&2
            exit 1
          fi

      - id: provider
        env:
          AUTOMATED_REVIEWER: ${{ vars.AUTOMATED_REVIEWER }}
        run: |
          case "$AUTOMATED_REVIEWER" in
            claude|codex) echo "provider=$AUTOMATED_REVIEWER" >> "$GITHUB_OUTPUT" ;;
            '') echo 'AUTOMATED_REVIEWER must be set to claude or codex.' >&2; exit 1 ;;
            *) echo "Unsupported AUTOMATED_REVIEWER: $AUTOMATED_REVIEWER. Expected claude or codex." >&2; exit 1 ;;
          esac

  review-round:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      can_review: ${{ steps.review-round.outputs.can_review }}
      pr_number: ${{ steps.review-round.outputs.pr_number }}
      head_sha: ${{ steps.review-round.outputs.head_sha }}
      base_sha: ${{ steps.review-round.outputs.base_sha }}
      patch_id: ${{ steps.review-round.outputs.patch_id }}
      change_surface: ${{ steps.review-round.outputs.change_surface }}
    steps:
      # Trusted base first — classifier must not come from the PR merge tree.
      - name: Checkout trusted classifier from base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .cez-trusted
          sparse-checkout: |
            .github/scripts/change-surface.cjs
            .github/scripts/release-bump-pr.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Classify pull request change surface
        id: change-surface
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -o pipefail
          change_surface=full-matrix
          if [ "$EVENT_NAME" = pull_request_target ]; then
            if ! expected_files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')" \
              || ! [[ "$expected_files" =~ ^[0-9]+$ ]]; then
              echo 'GitHub API change count failed; using full matrix' >&2
            elif ! file_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files")" \
              || ! listed_files="$(printf '%s' "$file_pages" | jq -er 'map(.[]) | length')" \
              || ! [[ "$listed_files" =~ ^[0-9]+$ ]] \
              || [ "$listed_files" -ne "$expected_files" ]; then
              echo 'GitHub API file list is incomplete; using full matrix' >&2
            elif ! files="$(printf '%s' "$file_pages" | jq -er 'map(.[]) | .[] | .filename, (.previous_filename? // empty) | @json')" \
              || ! change_surface="$(printf '%s\n' "$files" | node .cez-trusted/.github/scripts/change-surface.cjs)"; then
              echo 'Change-surface classifier failed; using full matrix' >&2
            fi
          fi
          case "$change_surface" in
            docs-only|infra-only|full-matrix) ;;
            *) change_surface=full-matrix ;;
          esac
          echo "change_surface=$change_surface" >> "$GITHUB_OUTPUT"
      - name: Checkout pull request merge for patch-id
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - id: review-round
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CHANGE_SURFACE: ${{ steps.change-surface.outputs.change_surface }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          AUTOMATED_REVIEW_ROUNDS: ${{ vars.AUTOMATED_REVIEW_ROUNDS }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo 'A pull request number is required.' >&2
            exit 1
          fi
          if [ -z "$AUTOMATED_REVIEW_ROUNDS" ]; then
            AUTOMATED_REVIEW_ROUNDS=3
          elif ! [[ "$AUTOMATED_REVIEW_ROUNDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "AUTOMATED_REVIEW_ROUNDS must be a positive integer, got: $AUTOMATED_REVIEW_ROUNDS" >&2
            exit 1
          fi
          patch_id=""
          change_surface="${CHANGE_SURFACE:-full-matrix}"
          case "$change_surface" in
            docs-only|infra-only|full-matrix) ;;
            *) change_surface=full-matrix ;;
          esac
          # Empty on workflow_dispatch (no pull_request payload); keep -u safe.
          head_ref="${HEAD_REF:-}"
          pr_author="${PR_AUTHOR:-}"
          classifier=".cez-trusted/.github/scripts/release-bump-pr.cjs"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            head_sha="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
            base_sha="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)"
            can_review=true
          else
            head_sha="$EVENT_HEAD_SHA"
            base_sha="$EVENT_BASE_SHA"
            # Manifest-only bot chore(release) PRs: no code to review. Author +
            # release/v* is not enough — trusted release-bump-pr.cjs also checks
            # the live PR file allowlist (same paths release-finalization stages).
            export HEAD_REF="$head_ref" PR_AUTHOR="$pr_author" CLASSIFIER="$classifier"
            export EXPECTED_HEAD_SHA="$head_sha" BASE_SHA="$base_sha"
            if LIVE_HEAD_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" \
              && PR_FILES="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
              export LIVE_HEAD_SHA PR_FILES PR_FILES_OK=1
            else
              unset PR_FILES PR_FILES_OK LIVE_HEAD_SHA || true
            fi
            if [ -f "$classifier" ] && node --input-type=commonjs -e "const c = require(require('node:path').resolve(process.cwd(), process.env.CLASSIFIER)); process.exit(c.classifyFromEnv() || c.classifyUpstreamScanFromEnv?.() ? 0 : 1)"; then
              can_review=false
            else
              # Rounds only, as isAutomatedReviewRound counts them: a non-empty string body; verdict replies are empty-body reviews.
              review_count="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --jq '.[] | select(.user.login == "github-actions[bot]") | select(.submitted_at != null) | select(.body | type == "string" and . != "") | .id' | wc -l)"
              if [ "$review_count" -lt "$AUTOMATED_REVIEW_ROUNDS" ]; then
                can_review=true
              else
                can_review=false
              fi
            fi
          fi
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ "$can_review" = true ]; then
            if patch_id="$(git diff --full-index "$base_sha...$head_sha" | git patch-id --stable | awk '{print $1}')" \
              && [[ "$patch_id" =~ ^[0-9a-f]{40}$ ]]; then
              last_patch_id=""
              patch_id_marker_re='<!-- cez-review-patch-id: ([0-9a-f]{40}) -->'
              review_bodies="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --jq '.[] | select(.user.login == "github-actions[bot]") | select(.submitted_at != null) | .body // empty' || true)"
              while IFS= read -r review_body; do
                if [[ "$review_body" =~ $patch_id_marker_re ]]; then
                  last_patch_id="${BASH_REMATCH[1]}"
                fi
              done <<< "$review_bodies"
              if [ -n "$last_patch_id" ] && [ "$patch_id" = "$last_patch_id" ]; then
                can_review=false
              fi
            else
              patch_id=""
            fi
          fi
          # Docs-only and infra-only PRs have nothing to review (#356, #468):
          # skip the round entirely so review-complete can finish green.
          if [ "$EVENT_NAME" = pull_request_target ] && { [ "$change_surface" = docs-only ] || [ "$change_surface" = infra-only ]; }; then
            can_review=false
            patch_id=""
          fi
          echo "can_review=$can_review" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "patch_id=$patch_id" >> "$GITHUB_OUTPUT"
          echo "change_surface=$change_surface" >> "$GITHUB_OUTPUT"

  claude-review:
    needs: [validate-provider, review-round]
    if: needs.validate-provider.outputs.provider == 'claude' && needs.review-round.outputs.can_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout pull request merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.review-round.outputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Remove pull-request content at the trusted checkout path
        run: rm -rf -- trusted-review

      - name: Checkout trusted CI context script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-review
          persist-credentials: false

      - name: Verify Claude can read pull request data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
        run: gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,state >/dev/null

      - name: Fetch prior automated review context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
        run: |
          rm -rf -- .review-context
          mkdir -- .review-context
          gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --jq '.[]' > .review-context/prior-review-bodies.jsonl
          gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --jq '.[]' > .review-context/prior-inline-comments.jsonl

      - name: Read current review CI context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.review-round.outputs.head_sha }}
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
          REVIEW_PREFLIGHT_RESULT: ${{ inputs.preflight_result }}
          REVIEW_CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          REVIEW_CALLER_ATTEMPT: ${{ inputs.caller_attempt }}
          REVIEW_CALLER_HEAD: ${{ inputs.caller_head }}
        run: node trusted-review/.github/scripts/review-ci-context.cjs .review-context/ci-results.md

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Anthropic's OIDC app-token exchange rejects tokens minted under
          # pull_request_target, so authenticate read-only GitHub calls with
          # the workflow token. A separate trusted job posts review findings.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'claude[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ needs.review-round.outputs.pr_number }}

            Read preflight and pending verification context from .review-context/ci-results.md.
            Review before heavy tests; do not wait for them or treat pending tests as passing.

            Override for this repository: in step 1, do NOT treat "the pull
            request is a draft" as a reason to stop. Draft is the normal
            state for a PR here, and review feedback is expected while the
            PR is still a draft. Evaluate the closed and does-not-need-review
            step-1 conditions unchanged. For already-commented, stop only
            when the prior automated review is on the same current head; when
            it is on an older head, do not stop because this is a later review
            round. Do not post a comment or invoke any comment tool. On later
            rounds, read prior automated review bodies
            from .review-context/prior-review-bodies.jsonl and inline review
            comments from .review-context/prior-inline-comments.jsonl. Group
            those inline comments by thread using id and in_reply_to_id. For
            each earlier actionable finding, meaning every thread whose root
            comment (the one with no in_reply_to_id) was written by
            github-actions[bot], read the whole thread, not only the original
            body, and return one prior_findings entry: comment_id is that root
            comment's id, verdict says whether it was addressed or remains
            unresolved, and reason names its location and reason in one or
            two sentences. Treat implementer replies as evidence: valid pushback
            (a sound disagreement, or a won't-fix whose reason holds)
            counts as addressed even with no code change. Invalid pushback
            stays unresolved and names why the reply fails, not only that
            the code did not change. Never re-file a finding that already has
            a thread; its prior_findings verdict carries it. Do not resolve
            review threads yourself: CI posts each reason as a thread reply
            and resolves the addressed ones. On a first round, or for a
            skipped or failed outcome, return an empty prior_findings. Set head_sha
            to the exact event head SHA
            ${{ needs.review-round.outputs.head_sha }}, never the checked-out
            merge SHA. Return only JSON matching the supplied schema. Set
            outcome to "reviewed" only after completing the review. Set outcome
            to "skipped" only for one of the remaining step-1 stop conditions,
            with the reason in summary. Set outcome to "failed" if required
            data or tools are unavailable or the review cannot otherwise be
            completed, with the reason in summary and no findings. For a
            completed review with no findings, set summary to "No issues found";
            otherwise set summary to null unless it adds useful context.
          claude_args: |
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'sonnet' }}
            --max-turns 40
            ${{ vars.CLAUDE_REVIEW_EFFORT && format('--effort {0}', vars.CLAUDE_REVIEW_EFFORT) || '' }}
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git log:*),Bash(git rev-parse:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["head_sha","outcome","findings","prior_findings","summary"],"properties":{"head_sha":{"type":["string","null"],"pattern":"^[0-9a-fA-F]{40}$"},"outcome":{"type":"string","enum":["reviewed","skipped","failed"]},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["path","line","body","severity"],"properties":{"path":{"type":"string","minLength":1,"maxLength":1000},"line":{"type":"integer","minimum":1},"body":{"type":"string","minLength":1,"pattern":"\\S","maxLength":10000},"severity":{"type":["string","null"],"enum":["critical","high","medium","low","error","warning","notice","info",null]}}}},"prior_findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["comment_id","verdict","reason"],"properties":{"comment_id":{"type":"integer","minimum":1},"verdict":{"type":"string","enum":["addressed","unresolved"]},"reason":{"type":"string","minLength":1,"pattern":"\\S","maxLength":2000}}}},"summary":{"type":["string","null"],"minLength":1,"maxLength":20000}}}'

      - name: Write Claude review artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('review-output', { recursive: true });
            fs.writeFileSync('review-output/review-findings.json', process.env.REVIEW_OUTPUT, 'utf8');

      - name: Upload Claude review output
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-output
          path: review-output/review-findings.json
          if-no-files-found: error

  codex-review:
    needs: [validate-provider, review-round]
    if: needs.validate-provider.outputs.provider == 'codex' && needs.review-round.outputs.can_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      output_present: ${{ steps.require-review.outputs.output_present }}
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout trusted review instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-review
          persist-credentials: false

      - name: Checkout pull request merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.review-round.outputs.pr_number }}/merge
          path: pull-request
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Fetch prior automated review context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
          HEAD_SHA: ${{ needs.review-round.outputs.head_sha }}
          BASE_SHA: ${{ needs.review-round.outputs.base_sha }}
        run: |
          rm -rf -- pull-request/.review-context
          mkdir -- pull-request/.review-context
          jq -n --argjson pr_number "$PR_NUMBER" --arg head_sha "$HEAD_SHA" --arg base_sha "$BASE_SHA" \
            '{pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha}' \
            > pull-request/.review-context/pull-request.json
          gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --jq '.[]' > pull-request/.review-context/prior-review-bodies.jsonl
          gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --jq '.[]' > pull-request/.review-context/prior-inline-comments.jsonl

      - name: Read current review CI context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.review-round.outputs.head_sha }}
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
          REVIEW_PREFLIGHT_RESULT: ${{ inputs.preflight_result }}
          REVIEW_CALLER_RUN_ID: ${{ inputs.caller_run_id }}
          REVIEW_CALLER_ATTEMPT: ${{ inputs.caller_attempt }}
          REVIEW_CALLER_HEAD: ${{ inputs.caller_head }}
        run: node trusted-review/.github/scripts/review-ci-context.cjs pull-request/.review-context/ci-results.md

      # Policy code belongs to this trusted workflow revision. In a manual
      # branch dispatch it must not silently use the old policy from PR base.
      - name: Checkout trusted review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .review-policy
          sparse-checkout: .github/scripts/codex-review-budget.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select Codex review budget
        id: review-budget
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
        with:
          script: |
            const { selectBudget } = require('./.review-policy/.github/scripts/codex-review-budget.cjs');
            const minutes = await selectBudget({ github, ...context.repo,
              pullNumber: Number(process.env.PR_NUMBER), warn: core.warning });
            core.info(`Codex review budget: ${minutes} minutes (30-minute job limit).`);
            core.setOutput('minutes', minutes);

      - name: Run Codex review
        id: codex-review
        # The action can write a complete review and then never return,
        # idling until the job timeout kills it — which skips every later
        # step, including the upload that hands the result to post-review
        # (openai/codex-action#150). A step timeout below the job's plus
        # continue-on-error hands control to the next step instead, which
        # publishes the review Codex already wrote. Cancelling the job
        # would skip that step too, so the guard has to sit on the step.
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.review-budget.outputs.minutes) }}
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56  # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: trusted-review/.github/codex/prompts/review.md
          output-file: pull-request/review-findings.json
          working-directory: pull-request
          model: ${{ vars.CODEX_REVIEW_MODEL || 'gpt-5.6-luna' }}
          effort: ${{ vars.CODEX_REVIEW_EFFORT || 'max' }}
          sandbox: read-only
          allow-bot-users: 'claude[bot]'
          allow-users: '*'
          output-schema-file: trusted-review/.github/schemas/review-findings.schema.json

      - name: Require a complete Codex review
        id: require-review
        env:
          REVIEW_OUTCOME: ${{ steps.codex-review.outcome }}
          FINDINGS: pull-request/review-findings.json
        run: |
          if [ ! -s "$FINDINGS" ]; then
            echo "::error::Codex review step ended '$REVIEW_OUTCOME' and wrote no $FINDINGS, so there is no review to publish." >&2
            exit 1
          fi
          if ! jq -e 'type == "object"' "$FINDINGS" >/dev/null 2>&1; then
            echo "::error::Codex review step ended '$REVIEW_OUTCOME' and $FINDINGS does not hold a JSON object." >&2
            exit 1
          fi
          echo 'output_present=true' >> "$GITHUB_OUTPUT"
          if [ "$REVIEW_OUTCOME" != 'success' ]; then
            echo "::warning::Codex review step ended '$REVIEW_OUTCOME', but it had already written a complete $FINDINGS, so this run publishes that review. See openai/codex-action#150."
          fi

      - name: Upload Codex review output
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-output
          path: pull-request/review-findings.json
          if-no-files-found: error

  post-review:
    needs: [validate-provider, review-round, claude-review, codex-review]
    if: ${{ !cancelled() && (needs.review-round.outputs.can_review == 'false' || (needs.review-round.outputs.can_review == 'true' && ((needs.validate-provider.outputs.provider == 'claude' && needs.claude-review.result == 'success') || (needs.validate-provider.outputs.provider == 'codex' && needs.codex-review.result == 'success')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GraphQL thread resolution refuses the workflow token without it. This job
      # checks out only the trusted base and never persists credentials.
      contents: write
      pull-requests: write
    outputs:
      new_threads: ${{ steps.post.outputs.new_threads }}
      open_threads: ${{ steps.post.outputs.open_threads }}

    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.review-round.outputs.base_sha }}
          persist-credentials: false

      # Inside ci.yml this run also holds jobs that execute PR code, and any of
      # them can upload an artifact named review-output. Download only the exact
      # artifact the provider job uploaded: an artifact ID is immutable. An empty
      # ID would make download-artifact fetch every artifact in the run, so it
      # fails here instead.
      - name: Require the provider's review artifact ID
        if: needs.review-round.outputs.can_review == 'true'
        env:
          ARTIFACT_ID: ${{ needs.validate-provider.outputs.provider == 'claude' && needs.claude-review.outputs.artifact_id || needs.codex-review.outputs.artifact_id }}
        run: |
          if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The review job reported no artifact ID ('$ARTIFACT_ID'), so there is no trusted review to post." >&2
            exit 1
          fi

      - name: Download review output
        if: needs.review-round.outputs.can_review == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.validate-provider.outputs.provider == 'claude' && needs.claude-review.outputs.artifact_id || needs.codex-review.outputs.artifact_id }}
          merge-multiple: true
          path: review-output

      - name: Validate and post review findings
        id: post
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CAN_REVIEW: ${{ needs.review-round.outputs.can_review }}
          REVIEW_OUTPUT: review-output/review-findings.json
          PROVIDER: ${{ needs.validate-provider.outputs.provider }}
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
          HEAD_SHA: ${{ needs.review-round.outputs.head_sha }}
          AUTOMATED_REVIEW_ROUNDS: ${{ vars.AUTOMATED_REVIEW_ROUNDS }}
          IGNORE_CAP: ${{ github.event_name == 'workflow_dispatch' }}
          PATCH_ID: ${{ needs.review-round.outputs.patch_id }}
        with:
          script: |
            const fs = require('node:fs');
            const {
              validateReview,
              loadReview,
              changedLinesFromFiles,
              postReview,
              assertLiveHead,
              listReviewThreads,
              countOpenAutomatedThreads,
              applyVerdicts,
            } = require('./.github/scripts/automated-review.cjs');
            const { owner, repo } = context.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const eventHeadSha = process.env.HEAD_SHA;
            // Even a reused/skipped round must belong to the live PR head.
            await assertLiveHead({ github, owner, repo, pullNumber, eventHeadSha, reviewedHeadSha: eventHeadSha });
            // A skipped round posts nothing; it only reports what is still open.
            if (process.env.CAN_REVIEW !== 'true') {
              const threads = await listReviewThreads({ github, owner, repo, pullNumber });
              core.setOutput('new_threads', '0');
              core.setOutput('open_threads', String(countOpenAutomatedThreads(threads)));
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });
            const review = loadReview(fs.readFileSync(process.env.REVIEW_OUTPUT, 'utf8'));
            const roundsRaw = process.env.AUTOMATED_REVIEW_ROUNDS;
            const maxRounds = roundsRaw ? Number(roundsRaw) : 3;
            const result = validateReview({
              review,
              headSha: eventHeadSha,
              changedLines: changedLinesFromFiles(files),
              noFindingsSummary: 'No issues found',
            });
            // Findings are posted before any verdict, so a red check still shows them.
            const newThreads = await postReview({
              github,
              owner,
              repo,
              pullNumber,
              eventHeadSha,
              reviewedHeadSha: review.head_sha,
              ...result,
              maxRounds,
              ignoreCap: process.env.IGNORE_CAP === 'true',
              patchId: process.env.PATCH_ID,
            });
            if (result.verdicts.length > 0) {
              await assertLiveHead({ github, owner, repo, pullNumber, eventHeadSha, reviewedHeadSha: review.head_sha });
              const threads = await listReviewThreads({ github, owner, repo, pullNumber });
              const applied = await applyVerdicts({ github, owner, repo, pullNumber, threads, verdicts: result.verdicts });
              core.info(`Resolved ${applied.resolved} addressed thread(s); ${applied.unresolved} stay unresolved.`);
            }
            const threads = await listReviewThreads({ github, owner, repo, pullNumber });
            core.setOutput('new_threads', String(newThreads));
            core.setOutput('open_threads', String(countOpenAutomatedThreads(threads)));

  review-complete:
    needs: [validate-provider, review-round, claude-review, codex-review, post-review]
    if: ${{ always() }}
    # ci.yml's own "Automated Code Review" job is the required check; this one
    # shows there as "Review / Review verdict" and names the reason it failed.
    name: Review verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Checkout trusted review diagnostics
        if: needs.validate-provider.outputs.provider == 'codex' && needs.codex-review.result == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .review-policy
          sparse-checkout: .github/scripts/codex-review-budget.cjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Diagnose failed Codex review
        id: codex-failure
        if: ${{ !cancelled() && needs.validate-provider.outputs.provider == 'codex' && needs.codex-review.result == 'failure' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT_PRESENT: ${{ needs.codex-review.outputs.output_present }}
        with:
          script: |
            const { failureMessage } = require('./.review-policy/.github/scripts/codex-review-budget.cjs');
            const message = await failureMessage({ github, ...context.repo,
              runId: context.runId, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              outputPresent: process.env.OUTPUT_PRESENT === 'true' });
            core.setOutput('message', message);

      - name: Require the selected review path to succeed
        # A diagnostic checkout/API failure must not skip the failed verdict.
        if: ${{ always() }}
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          VALIDATE_RESULT: ${{ needs.validate-provider.result }}
          REVIEW_ROUND_RESULT: ${{ needs.review-round.result }}
          CAN_REVIEW: ${{ needs.review-round.outputs.can_review }}
          PROVIDER: ${{ needs.validate-provider.outputs.provider }}
          CLAUDE_RESULT: ${{ needs.claude-review.result }}
          CODEX_RESULT: ${{ needs.codex-review.result }}
          CODEX_FAILURE_MESSAGE: ${{ steps.codex-failure.outputs.message }}
          POST_RESULT: ${{ needs.post-review.result }}
          NEW_THREADS: ${{ needs.post-review.outputs.new_threads }}
          OPEN_THREADS: ${{ needs.post-review.outputs.open_threads }}
          PR_NUMBER: ${{ needs.review-round.outputs.pr_number }}
        run: |
          [ "$CANCELLED" = 'false' ] || exit 1
          [ "$VALIDATE_RESULT" = 'success' ] || exit 1
          [ "$REVIEW_ROUND_RESULT" = 'success' ] || exit 1
          if [ "$CAN_REVIEW" != 'false' ]; then
            case "$PROVIDER" in
              claude) [ "$CLAUDE_RESULT" = 'success' ] || exit 1 ;;
              codex)
                if [ "$CODEX_RESULT" != 'success' ]; then
                  message="${CODEX_FAILURE_MESSAGE:-Codex review did not succeed; diagnostic evidence is unavailable. See the codex-review job.}"
                  printf '%s\n' "::error::$message"
                  printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                ;;
              *) exit 1 ;;
            esac
          fi
          [ "$POST_RESULT" = 'success' ] || exit 1
          if ! [[ "$NEW_THREADS" =~ ^[0-9]+$ && "$OPEN_THREADS" =~ ^[0-9]+$ ]]; then
            echo '::error::post-review reported no thread counts.' >&2
            exit 1
          fi
          # Findings are already posted; red here means "address them", not a broken
          # review. Notices, not errors, so the CI failure sweep never groups review
          # findings on unrelated PRs into a recurring-failure issue. The step summary
          # repeats each notice so `gh run view` shows it without the log.
          verdict() {
            echo "::notice::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          # Re-running a CI round never judges a pushback reply: the patch-ID guard skips
          # the model on an unchanged patch. A manual dispatch skips that guard.
          rejudge="To have pushback replies judged, run this workflow manually with pr_number, then re-run Review / review-round in the CI run to recount. Dispatch command: gh workflow run automated-code-review.yml -f pr_number=$PR_NUMBER"
          if [ "$NEW_THREADS" -gt 0 ]; then
            verdict "This review opened $NEW_THREADS new finding thread(s). Address them and push. $rejudge"
            exit 1
          fi
          if [ "$OPEN_THREADS" -gt 0 ]; then
            verdict "$OPEN_THREADS automated review thread(s) are still unresolved. Re-running the failed jobs alone reuses the old count. If you resolved them by hand, re-run Review / review-round in the CI run to recount. $rejudge"
            exit 1
          fi
      - name: Reject a cancelled run
        if: cancelled()
        run: exit 1
