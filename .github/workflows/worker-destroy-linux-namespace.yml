name: Linux worker destroy namespace diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/worker-destroy-linux-namespace.yml'
      - '.github/scripts/linux-mount-alias-probe.py'
      - '.github/scripts/linux-mount-alias-lifecycle.py'
      - '.github/scripts/linux-mount-alias-observer.mjs'
      - '.github/scripts/linux_reaper_fixture.py'
      - '.github/scripts/linux_detach.py'
      - '.github/scripts/linux-detach-test.py'
      - '.github/scripts/linux-reaper-fixture-test.py'
      - '.github/scripts/linux-reaper-regression.mjs'
      - '.github/scripts/linux-reaper-protocol*.mjs'
      - '.github/scripts/linux-reaper-native-guard.mjs'
      - 'packages/cezar/src/delegation/linux-alias-*'
      - 'packages/cezar/src/delegation/linux-mapped-holders*'
      - 'packages/cezar/src/delegation/linux-proc-evidence*'
      - 'packages/cezar/src/delegation/destroy-holders*'
      - 'packages/cezar/src/delegation/authoritative-reaper.ts'
      - 'packages/cezar/src/delegation/authoritative-capacity-ci.test.ts'
      - 'packages/cezar/src/runs/worker-execution.ts'
      - 'packages/cezar/src/runs/store.ts'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  namespace-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Check fixture protocol guards
        run: |
          python3 .github/scripts/linux-reaper-fixture-test.py
          python3 .github/scripts/linux-detach-test.py
          node .github/scripts/linux-reaper-protocol-check.mjs
      - name: Observe private mount namespace aliases
        run: sudo -n -- python3 .github/scripts/linux-mount-alias-probe.py --observer "$(command -v node)"
      - name: Verify gated probe teardown
        run: sudo -n -- python3 .github/scripts/linux-mount-alias-lifecycle.py "$(command -v node)"
      - name: Exercise production reaper in private namespaces
        run: |
          set -o pipefail
          sudo -n -- python3 .github/scripts/linux-mount-alias-probe.py --production "$(command -v node)" 2>&1 | tee "$RUNNER_TEMP/candidate-native.log"
      - name: Attribute failed capacity scan in a disposable copy
        if: failure()
        run: |
          set -eu
          if ! test -f "$RUNNER_TEMP/candidate-native.log" || ! grep -q 'capacity result:.*alias scan work exceeds bounds' "$RUNNER_TEMP/candidate-native.log"; then
            exit 0
          fi
          copy="$RUNNER_TEMP/capacity-attribution-copy"
          staged="$RUNNER_TEMP/capacity-attribution-staged.json"
          pnpm exec tsx packages/cezar/test/e2e/capacity-attribution-stage-cli.ts "$GITHUB_WORKSPACE" "$staged"
          mkdir "$copy"
          git archive HEAD -- package.json pnpm-lock.yaml pnpm-workspace.yaml vitest.config.ts packages .github/scripts .github/test-durations.json | tar -x -C "$copy"
          pnpm exec tsx packages/cezar/test/e2e/capacity-attribution-apply-cli.ts "$copy" "$staged"
          cd "$copy"
          pnpm install --frozen-lockfile
          set +e
          sudo -n -- python3 .github/scripts/linux-mount-alias-probe.py --production "$(command -v node)" > "$RUNNER_TEMP/capacity-attribution-raw.log" 2>&1
          diagnostic_status=$?
          set -e
          python3 .github/scripts/capacity-attribution-extract.py "$RUNNER_TEMP/capacity-attribution-raw.log" "$RUNNER_TEMP/capacity-attribution.json"
          exit "$diagnostic_status"
      - name: Save native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-destroy-linux-native-evidence
          path: |
            ${{ runner.temp }}/candidate-native.log
          if-no-files-found: warn
      - name: Save capacity attribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-destroy-linux-capacity-attribution
          path: ${{ runner.temp }}/capacity-attribution.json
          if-no-files-found: warn
  regression-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Check out regression proof base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 52e4b4533b689cf41b288ac0c63205bea7f26a1a
          path: proof-base
          persist-credentials: false
      - name: Install proof dependencies and transplant fixture
        run: |
          cp .github/scripts/linux-mount-alias-probe.py .github/scripts/linux_reaper_fixture.py .github/scripts/linux_detach.py .github/scripts/linux-reaper-regression.mjs .github/scripts/linux-reaper-protocol.mjs .github/scripts/linux-reaper-native-guard.mjs proof-base/.github/scripts/
          sha256sum .github/scripts/linux-mount-alias-probe.py .github/scripts/linux_reaper_fixture.py .github/scripts/linux_detach.py .github/scripts/linux-reaper-regression.mjs .github/scripts/linux-reaper-protocol.mjs .github/scripts/linux-reaper-native-guard.mjs > "$RUNNER_TEMP/native-fixtures.sha256"
          cd proof-base
          git rev-parse HEAD > "$RUNNER_TEMP/proof-base.txt"
          test "$(cat "$RUNNER_TEMP/proof-base.txt")" = 52e4b4533b689cf41b288ac0c63205bea7f26a1a
          sha256sum -c "$RUNNER_TEMP/native-fixtures.sha256"
          pnpm install --frozen-lockfile
      - name: Prove the old reaper misses the mapped alias
        working-directory: proof-base
        run: |
          set -o pipefail
          sudo -n -- python3 .github/scripts/linux-mount-alias-probe.py --production-proof "$(command -v node)" 2>&1 | tee "$RUNNER_TEMP/proof-native.log"
      - name: Save regression proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-destroy-linux-proof-evidence
          path: |
            ${{ runner.temp }}/proof-native.log
            ${{ runner.temp }}/proof-base.txt
            ${{ runner.temp }}/native-fixtures.sha256
          if-no-files-found: warn
