name: Native macOS worker destroy
on:
  pull_request:
    paths:
      - '.github/workflows/worker-destroy-macos.yml'
      - '.github/scripts/macos-event-descriptor-probe.c'
      - '.github/scripts/macos-parent-chmod-probe.c'
      - 'packages/cezar/src/delegation/workspace*'
      - 'packages/cezar/src/delegation/destroy-holders*'
      - 'packages/cezar/src/delegation/darwin-open-flags.test.ts'
      - 'packages/cezar/src/delegation/service*'
      - 'packages/cezar/src/delegation/process-liveness*'
      - 'packages/cezar/src/detached-process*'
      - 'packages/cezar/src/workflows/run.ts'
      - 'packages/cezar/src/workflows/worker-destroy.test.ts'
      - 'packages/cezar/src/git-worktree-release.ts'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-destroy:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Diagnose native directory descriptors
        run: npm test -- packages/cezar/src/delegation/darwin-open-flags.test.ts
      - name: Verify event-only descriptor inode binding
        if: always()
        run: |
          cc -Wall -Wextra .github/scripts/macos-event-descriptor-probe.c -o "$RUNNER_TEMP/event-probe"
          "$RUNNER_TEMP/event-probe"
      - name: Probe event-only process policy
        if: always()
        run: |
          probe=$(mktemp -d)
          chmod 000 "$probe"
          trap 'chmod 700 "$probe"; rmdir "$probe"' EXIT
          osascript -l JavaScript - "$probe" <<'JXA'
          ObjC.bindFunction('setiopolicy_np', ['int', ['int', 'int', 'int']]);
          ObjC.bindFunction('open', ['int', ['char *', 'int', 'int']]);
          ObjC.bindFunction('fchmod', ['int', ['int', 'int']]);
          ObjC.bindFunction('close', ['int', ['int']]);
          function run(args) {
            const policy = $.setiopolicy_np(10, 0, 1);
            const fd = $.open($(args[0]).UTF8String, 0x8000 | 0x20000000, 0);
            const changed = fd < 0 ? -1 : $.fchmod(fd, 448);
            if (fd >= 0) $.close(fd);
            console.log(`policy=${policy} fd=${fd} fchmod=${changed}`);
          }
          JXA
      - name: Probe pinned-parent no-follow chmod
        if: always()
        run: |
          cc -Wall -Wextra .github/scripts/macos-parent-chmod-probe.c -o "$RUNNER_TEMP/parent-probe"
          "$RUNNER_TEMP/parent-probe"
      - name: Verify mode-000 owned worktree recovery
        run: npm test -- packages/cezar/src/delegation/workspace.test.ts -t 'recovers a leftover with an inaccessible'
      - name: Verify scoped holder termination
        if: always()
        run: npm test -- packages/cezar/src/delegation/destroy-holders.test.ts
      - name: Verify authoritative service destroy
        if: always()
        run: npm test -- packages/cezar/src/delegation/service.test.ts -t 'authoritative destroy removes a prepared leftover'
