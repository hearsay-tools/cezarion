name: Native macOS worker destroy
on:
  pull_request:
    paths:
      - '.github/workflows/worker-destroy-macos.yml'
      - '.github/scripts/macos-jxa-parent-probe.js'
      - '.github/scripts/macos-jxa-fixture-driver.mjs'
      - 'packages/cezar/src/delegation/workspace*'
      - 'packages/cezar/src/delegation/destroy-holders*'
      - 'packages/cezar/src/delegation/mount-boundary*'
      - 'packages/cezar/src/delegation/service*'
      - 'packages/cezar/src/delegation/process-liveness*'
      - 'packages/cezar/src/detached-process*'
      - 'packages/cezar/src/workflows/run.ts'
      - 'packages/cezar/src/workflows/worker-destroy.test.ts'
      - 'packages/cezar/src/git-worktree-release.ts'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-destroy:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Probe JXA parent-pinned chmod on private fixtures
        run: node .github/scripts/macos-jxa-fixture-driver.mjs
      - name: Verify mount boundary enumeration
        if: ${{ !cancelled() }}
        run: npm test -- packages/cezar/src/delegation/mount-boundary.test.ts
      - name: Verify mode-000 owned worktree recovery
        if: ${{ !cancelled() }}
        run: npm test -- packages/cezar/src/delegation/workspace.test.ts -t 'recovers a leftover with an inaccessible'
      - name: Verify scoped holder termination
        if: always()
        run: npm test -- packages/cezar/src/delegation/destroy-holders.test.ts
      - name: Verify authoritative service destroy
        if: always()
        run: npm test -- packages/cezar/src/delegation/service.test.ts -t 'authoritative destroy removes a prepared leftover'
