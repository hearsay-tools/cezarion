name: Full suite

# The full verification ci.yml runs on a merge group, as one reusable workflow, for a
# commit no merge queue verified: a release from a release/** branch, and the Nightly
# rehearsal (spec .ai/specs/2026-11-11-one-full-run-delivery-pipeline.md § Release).
# full-suite.workflow.test.cjs keeps each job's commands, shards, runners and bounds
# equal to the ci.yml job it copies; change both in the same commit.
on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Workflow lint pins. actionlint 1.7.10 is the first release that reads YAML
      # anchors such as `*resolve-dispatch`. shellcheck is pinned too, so a
      # runner-image update cannot change which findings fail the gate; warning
      # level keeps info and style findings out.
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
      SHELLCHECK_VERSION: '0.11.0'
      SHELLCHECK_SHA256: 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'
      SHELLCHECK_OPTS: '--severity=warning'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The pinned tarballs come from the Actions cache, keyed on their hashes, so a
      # release-download outage does not fail the gate (hearsay-tools/squawk#3017).
      - name: Restore workflow lint tools
        id: workflow-lint-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/workflow-lint
          key: workflow-lint-${{ env.ACTIONLINT_SHA256 }}-${{ env.SHELLCHECK_SHA256 }}

      - name: Lint workflows
        run: |
          tools="$RUNNER_TEMP/workflow-lint"
          mkdir -p "$tools"
          # A tarball is downloaded only when the cache lacks it or its hash does not match.
          fetch() {
            if ! printf '%s  %s\n' "$2" "$tools/$1" | sha256sum -c --status - 2>/dev/null; then
              curl -fsSL --retry 3 -o "$tools/$1" "$3"
              printf '%s  %s\n' "$2" "$tools/$1" | sha256sum -c -
            fi
          }
          fetch actionlint.tar.gz "$ACTIONLINT_SHA256" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          fetch shellcheck.tar.gz "$SHELLCHECK_SHA256" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xzf "$tools/shellcheck.tar.gz" -C "$tools" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$tools/actionlint" -shellcheck="$tools/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -pyflakes=

      # Save before any step runs checked-out code; every run re-verifies the hashes.
      - name: Save workflow lint tools
        if: steps.workflow-lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/workflow-lint
          key: workflow-lint-${{ env.ACTIONLINT_SHA256 }}-${{ env.SHELLCHECK_SHA256 }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Install Node.js from nodejs.org
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: ./.github/actions/node-dist
        with:
          node-version: '24.21.0'

      - name: Set up Node.js
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          token: ''
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node.js without node-dist
        # The checked-out ref predates the node-dist action: the previous setup.
        if: hashFiles('.github/actions/node-dist/action.yml') == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit tests (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [package, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Install Node.js from nodejs.org
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: ./.github/actions/node-dist
        with:
          node-version: '24.21.0'

      # The engines.node minimum, as in ci.yml: the build and packaged CLI tests prove the floor.
      - name: Set up Node.js
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          token: ''
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node.js without node-dist
        # The checked-out ref predates the node-dist action: the previous setup.
        if: hashFiles('.github/actions/node-dist/action.yml') == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: npm run test:unit:${{ matrix.suite }}

  build-and-package:
    name: Build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Install Node.js from nodejs.org
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: ./.github/actions/node-dist
        with:
          node-version: '24.21.0'

      # The engines.node minimum, as in ci.yml: the build and packaged CLI tests prove the floor.
      - name: Set up Node.js
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          token: ''
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node.js without node-dist
        # The checked-out ref predates the node-dist action: the previous setup.
        if: hashFiles('.github/actions/node-dist/action.yml') == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: npm run build

      - name: Typecheck packaged CLI E2E tests
        run: npm run typecheck:package

      - name: Run packaged CLI E2E tests
        run: npm run test:package

      - name: Verify release packages
        run: |
          node .github/scripts/release-packages.cjs pack-check

  vitest:
    name: Vitest shard ${{ matrix.shard }}/8
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7, 8 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Install Node.js from nodejs.org
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: ./.github/actions/node-dist
        with:
          node-version-file: .node-version

      - name: Set up Node.js
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          token: ''
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node.js without node-dist
        # The checked-out ref predates the node-dist action: the previous setup.
        if: hashFiles('.github/actions/node-dist/action.yml') == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server and cockpit unit suites
        env:
          VITEST_FILE_DURATION_CAP: '1'
        run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers=4

  cockpit-browser:
    name: Cockpit browser E2E shard ${{ matrix.shard }}/8
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7, 8 ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Install Node.js from nodejs.org
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: ./.github/actions/node-dist
        with:
          node-version-file: .node-version

      - name: Set up Node.js
        if: hashFiles('.github/actions/node-dist/action.yml') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          token: ''
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Node.js without node-dist
        # The checked-out ref predates the node-dist action: the previous setup.
        if: hashFiles('.github/actions/node-dist/action.yml') == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Run cockpit browser E2E
        run: |
          set -o pipefail
          npm run test:e2e -- --allow-skip --shard=${{ matrix.shard }}/8 2>&1 | tee e2e.log
          node .github/scripts/require-e2e-passed.cjs < e2e.log

      - name: Upload failure bundles
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-suite-cockpit-failures-shard-${{ matrix.shard }}
          path: .ai/qa/failures/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Full suite result
    needs: [typecheck, unit-tests, build-and-package, vitest, cockpit-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success; done
