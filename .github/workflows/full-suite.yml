name: Full suite

# The full verification ci.yml runs on a merge group, as one reusable workflow, for a
# commit no merge queue verified: a release from a release/** branch, and the Nightly
# rehearsal (spec .ai/specs/2026-11-11-one-full-run-delivery-pipeline.md § Release).
# full-suite.workflow.test.cjs keeps each job's commands, shards, runners and bounds
# equal to the ci.yml job it copies; change both in the same commit.
on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'
          SHELLCHECK_OPTS: '--severity=warning'
        run: |
          tools="$RUNNER_TEMP/workflow-lint"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tools/shellcheck.tar.gz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          printf '%s  %s\n' \
            "$ACTIONLINT_SHA256" "$tools/actionlint.tar.gz" \
            "$SHELLCHECK_SHA256" "$tools/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xzf "$tools/shellcheck.tar.gz" -C "$tools" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$tools/actionlint" -shellcheck="$tools/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -pyflakes=

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  build-and-package:
    name: Unit, build, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      # The engines.node minimum, as in ci.yml: the build and packaged CLI tests prove the floor.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Typecheck packaged CLI E2E tests
        run: npm run typecheck:package

      - name: Run packaged CLI E2E tests
        run: npm run test:package

      - name: Verify release packages
        run: |
          node .github/scripts/release-packages.cjs pack-check

  vitest:
    name: Vitest shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server and cockpit unit suites
        env:
          VITEST_FILE_DURATION_CAP: '1'
        run: npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=4

  cockpit-browser:
    name: Cockpit browser E2E shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Run cockpit browser E2E
        run: |
          set -o pipefail
          npm run test:e2e -- --allow-skip --shard=${{ matrix.shard }}/4 2>&1 | tee e2e.log
          node .github/scripts/require-e2e-passed.cjs < e2e.log

      - name: Upload failure bundles
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-suite-cockpit-failures-shard-${{ matrix.shard }}
          path: .ai/qa/failures/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Full suite result
    needs: [typecheck, build-and-package, vitest, cockpit-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success; done
