name: Mobile apps

on:
  pull_request:
    paths: ['packages/mobile/**', 'docs/mobile.md', '.github/workflows/mobile-check.yml']
  push:
    branches: [main]
    paths: ['packages/mobile/**', '.github/workflows/mobile-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests, lint and installable APK
        working-directory: packages/mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native device tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: packages/mobile/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Personal-install APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cezarion-android-personal
          path: packages/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: packages/mobile/android/app/build/reports/
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose an installed iPhone simulator
        timeout-minutes: 5
        run: |
          device=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device" && test "$device" != null
          echo "SIMULATOR_ID=$device" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device" -b
      - name: Build and test iOS
        timeout-minutes: 10
        run: |
          xcodebuild -project packages/mobile/ios/Cezarion.xcodeproj -scheme Cezarion \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath packages/mobile/build/ios CODE_SIGNING_ALLOWED=NO test
      - name: Compile unsigned device archive
        run: |
          xcodebuild -project packages/mobile/ios/Cezarion.xcodeproj -scheme Cezarion \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath packages/mobile/build/Cezarion.xcarchive CODE_SIGNING_ALLOWED=NO archive
          ditto -c -k --keepParent packages/mobile/build/Cezarion.xcarchive packages/mobile/build/Cezarion-unsigned.xcarchive.zip
      - name: Unsigned archive (requires personal signing, not directly installable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cezarion-ios-unsigned-archive
          path: packages/mobile/build/Cezarion-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 14
      - name: iOS test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: packages/mobile/build/ios/Logs/Test/*.xcresult
          retention-days: 14
