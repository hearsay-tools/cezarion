name: CI

on:
  # The target trigger is installed on main. One PR event owns verification;
  # PR publishing is isolated in publish-pr-snapshot.yml after this run completes.
  pull_request_target:
    branches:
      - main
      - release/**
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches:
      - main
  # Release finalization explicitly dispatches bot-created PRs at their head branch.
  # Resolve the optional PR through the API before allowing the release-bump skip.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Release PR number (omit for full verification of the dispatched SHA)
        required: false
        type: string
      # The Squeal quality gate trial (§ Squeal quality gate trial in docs/sdlc/ci.md):
      # only a dispatch without pr_number takes it; it never gates anything.
      squeal_gate_trial:
        description: Record Squeal coverage in the Vitest shards and run the Squeal quality gate trial (no pr_number)
        required: false
        type: boolean
        default: false
      # The Squeal coverage proof (§ Squeal coverage proof in docs/sdlc/ci.md): only a dispatch
      # without pr_number takes it; it never gates anything.
      squeal_coverage_proof:
        description: Run Vitest shard 1/8 with V8 coverage under squeal ci record and twice alone, and compare the three (no pr_number)
        required: false
        type: boolean
        default: false
      # The Squeal packaged test trial (§ Squeal packaged test trial in docs/sdlc/ci.md): only a
      # dispatch without pr_number takes it; it never gates anything.
      squeal_package_trial:
        description: Run the Squeal quality gate with a node:test entry for the packaged tests and child coverage (no pr_number)
        required: false
        type: boolean
        default: false
      squeal_package_trial_commit:
        description: Packaged test trial only; a full commit SHA to measure against its first parent (empty measures the dispatched commit against main)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  queue-proof:
    name: Verify exact queue CI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
      source: ${{ steps.proof.outputs.source }}
    steps:
      # Depth 2 holds the parent, whose classifier judges a skipped-suite queue run.
      - name: Check out immutable main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - id: proof
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 0
          script: |
            core.setOutput('verified', 'false');
            if (context.eventName !== 'push' || context.ref !== 'refs/heads/main') return;
            const { queueCiProof, mainCommitSurface } = require('./.github/scripts/queue-ci-proof.cjs');
            const proof = await queueCiProof({ github, ...context.repo,
              eventName: context.eventName, ref: context.ref, sha: context.sha,
              surfaceOf: base => mainCommitSurface({ sha: context.sha, base, tmpDir: process.env.RUNNER_TEMP }) });
            core.setOutput('verified', String(proof.verified));
            if (proof.verified) core.setOutput('source', proof.url);
            await core.summary.addHeading('Queue CI evidence').addRaw(JSON.stringify(proof)).write();

  change-surface:
    name: Classify pull request change surface
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      surface: ${{ steps.classify.outputs.surface }}

    steps:
      # Runs before checkout: metadata cannot come from release-branch code.
      - &resolve-dispatch
        name: Resolve dispatched release PR
        id: resolve-dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            exit 0
          fi
          if ! pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")" \
            || ! printf '%s' "$pr" | jq -e --arg sha "$EXPECTED_HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" --arg app "$RELEASE_APP_BOT_LOGIN" '
              .state == "open" and
              .head.sha == $sha and (.head.sha | test("^[a-f0-9]{40}$")) and
              (.head.ref | test("^release/v[0-9A-Za-z._/+\\-]+$")) and
              .head.repo.full_name == $repo and .base.repo.full_name == $repo and
              (.base.ref == "main" or .base.ref == "develop") and
              (.base.sha | test("^[a-f0-9]{40}$")) and
              (.user.login == "github-actions[bot]" or
                (($app | test("^[a-z0-9][a-z0-9-]*\\[bot\\]$")) and .user.login == $app)) and
              (.changed_files | type == "number" and . > 0 and . == floor)
            ' >/dev/null; then
            echo "Dispatch PR validation failed; using full matrix" >&2
            exit 0
          fi
          printf '%s' "$pr" | jq -r '
            "base_sha=\(.base.sha)", "head_ref=\(.head.ref)",
            "changed_files=\(.changed_files)", "pr_author=\(.user.login)", "valid=true"
          ' >> "$GITHUB_OUTPUT"
      # A merge group classifies with the classifier from its base, like a PR.
      - name: Check out trusted pull request base
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group' || steps['resolve-dispatch'].outputs.valid == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || steps['resolve-dispatch'].outputs.base_sha }}
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -o pipefail
          if [ "$EVENT_NAME" = merge_group ]; then
            # The group's own diff, read as Git data: the head is fetched, never checked out.
            # --no-renames lists both sides of a rename, as previous_filename does for a PR.
            if ! [[ "$GROUP_BASE_SHA" =~ ^[0-9a-f]{40}$ && "$GROUP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
              || [ "$(git rev-parse HEAD)" != "$GROUP_BASE_SHA" ] \
              || ! git fetch --no-tags --depth=1 origin "$GROUP_HEAD_SHA" \
              || [ "$(git rev-parse FETCH_HEAD)" != "$GROUP_HEAD_SHA" ] \
              || ! files="$(git diff --name-only --no-renames -z "$GROUP_BASE_SHA" "$GROUP_HEAD_SHA" \
                | jq -Rrs 'split("\u0000") | map(select(length > 0)) | .[] | @json')"; then
              echo "Merge group diff unavailable; using full matrix" >&2
              echo "surface=full-matrix" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          # Push and dispatch are never docs-only; classify-pr owns the dispatch version-stamp skip.
          elif [ "$EVENT_NAME" != "pull_request_target" ]; then
            echo "surface=full-matrix" >> "$GITHUB_OUTPUT"
            exit 0
          else
            if ! expected_files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')" \
              || ! [[ "$expected_files" =~ ^[0-9]+$ ]]; then
              echo "GitHub API change count failed; using full matrix" >&2
              echo "surface=full-matrix" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! file_pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files")" \
              || ! listed_files="$(printf '%s' "$file_pages" | jq -er 'map(.[]) | length')" \
              || ! [[ "$listed_files" =~ ^[0-9]+$ ]] \
              || [ "$listed_files" -ne "$expected_files" ]; then
              echo "GitHub API file list is incomplete; using full matrix" >&2
              echo "surface=full-matrix" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! files="$(printf '%s' "$file_pages" | jq -er 'map(.[]) | .[] | .filename, (.previous_filename? // empty) | @json')"; then
              echo "GitHub API file list is malformed; using full matrix" >&2
              echo "surface=full-matrix" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! surface="$(printf '%s\n' "$files" | node "$GITHUB_WORKSPACE/.github/scripts/change-surface.cjs")"; then
            echo "Change-surface classifier failed; using full matrix" >&2
            echo "surface=full-matrix" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$surface" in
            docs-only|infra-only|full-matrix) ;;
            *) surface=full-matrix ;;
          esac
          echo "surface=$surface" >> "$GITHUB_OUTPUT"

  # Shared with CodeRabbit admission via release-bump-pr.cjs:
  # bot author + release/v* head is not enough — the live PR file list must match
  # the release-finalization allowlist or Vitest/E2E still run.
  classify-pr:
    name: Classify PR shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bump_pr: ${{ steps.classify.outputs.bump_pr }}
    steps:
      - *resolve-dispatch
      # Base (or push SHA) only — never the PR merge tip, so a PR cannot rewrite
      # the classifier to force bump_pr=true and skip Vitest/E2E.
      - name: Check out trusted classifier
        if: github.event_name != 'workflow_dispatch' || steps['resolve-dispatch'].outputs.valid == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || steps['resolve-dispatch'].outputs.base_sha || github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
          # One commit. A depth of 0 fetches every branch and tag, about six times
          # main's own history, and took up to 3.5 minutes on a busy host.
          fetch-depth: 1
      # The baseline check measures from the merge base of the workflow commit and
      # the PR head, so it needs their history; other events read none.
      - name: Fetch the history the baseline check compares
        if: github.event_name == 'pull_request_target' || steps['resolve-dispatch'].outputs.valid == 'true'
        run: git fetch --no-tags --unshallow origin "$GITHUB_SHA"
      # Required through classify-pr -> verify, including docs/infra-only PRs.
      # Only trusted base code runs here; the head is read from Git as data.
      - name: Reject baseline growth
        if: github.event_name == 'pull_request_target' || steps['resolve-dispatch'].outputs.valid == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # pull_request_target runs this workflow from the base branch tip (context.sha), but the
          # checkout above is the event's base.sha, which GitHub does not move when the branch
          # advances: load the gate from the workflow's own commit. A dispatch runs at the
          # dispatched PR head, so it loads the gate from the checked-out trusted base instead.
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const gate = path.join(process.env.RUNNER_TEMP, 'baseline-growth.cjs');
            const trusted = context.eventName === 'pull_request_target' ? context.sha : 'HEAD';
            fs.writeFileSync(gate, execFileSync('git', ['show', `${trusted}:.github/scripts/baseline-growth.cjs`]));
            const { checkPullRequest } = require(gate);
            await checkPullRequest({ github, context, core });
      - name: Require GitHub patches for changed text files
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 0
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const gate = path.join(process.env.RUNNER_TEMP, 'missing-patches.cjs');
            fs.writeFileSync(gate, execFileSync('git', ['show', `${context.sha}:.github/scripts/missing-patches.cjs`]));
            const { checkPullRequest } = require(gate);
            await checkPullRequest({ github, context, core });
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VALID: ${{ steps['resolve-dispatch'].outputs.valid }}
          DISPATCH_HEAD_REF: ${{ steps['resolve-dispatch'].outputs.head_ref }}
          DISPATCH_PR_AUTHOR: ${{ steps['resolve-dispatch'].outputs.pr_author }}
          DISPATCH_CHANGED_FILES: ${{ steps['resolve-dispatch'].outputs.changed_files }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps['resolve-dispatch'].outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = merge_group ]; then
            echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$DISPATCH_VALID" != true ]; then
              echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Feed the existing classifier the API-validated PR context.
            export EVENT_NAME=pull_request_target HEAD_REF="$DISPATCH_HEAD_REF" PR_AUTHOR="$DISPATCH_PR_AUTHOR"
            if ! pages="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files")" \
              || ! count="$(printf '%s' "$pages" | jq -er 'map(.[]) | length')" \
              || [ "$count" != "$DISPATCH_CHANGED_FILES" ]; then
              echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ ! -f .github/scripts/release-bump-pr.cjs ]; then
            echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT_NAME}" = pull_request_target ] && [ -n "${PR_NUMBER:-}" ]; then
            if ! LIVE_HEAD_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"; then
              echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export LIVE_HEAD_SHA
            if [ "${DISPATCH_VALID:-}" = true ]; then
              if ! PR_FILES="$(printf '%s' "$pages" | jq -er 'map(.[]) | .[].filename')"; then
                echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif ! PR_FILES="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
              echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export PR_FILES PR_FILES_OK=1
          fi
          node .github/scripts/release-bump-pr.cjs

  # Function complexity ratchet (hearsay-tools/cezarion#1800). Like the baseline-growth
  # step in classify-pr, it runs trusted code and reads the pull request head as Git
  # data: the head is fetched, never checked out, so no head code runs here.
  # `github.sha` is the workflow's own commit, the current tip of the base branch on
  # pull_request_target. The event's `base.sha` is the tip from when the PR opened, and
  # a checkout of it can lack scripts that this workflow calls. @babel/parser installs
  # from that commit's lockfile with lifecycle scripts off. A merge group runs the same
  # gate on the combined commit against the base tip it will land on, since two pull
  # requests that each pass alone can add up to growth; its code comes from the group's
  # base SHA, because `github.sha` there is the combined commit. A bare dispatch gates
  # the dispatched branch against main, which proves this job before merge.
  complexity-gate:
    name: Check function complexity
    if: ${{ github.event_name == 'pull_request_target' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
          # One commit. A depth of 0 fetches every branch and tag; see classify-pr.
          fetch-depth: 1
      # A merge group head's parent is the group base, so fetching the head in the
      # gate step is enough. Pull requests and dispatches compare with a merge base
      # further back, so they fetch the full history of this commit and main only.
      - name: Fetch the history the gate compares
        if: github.event_name != 'merge_group'
        run: git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject function complexity growth
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          growth=()
          pr=
          if [ "$EVENT_NAME" = pull_request_target ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            if ! jq -e --arg head "$EXPECTED_HEAD_SHA" '.head.sha == $head' <<<"$pr" >/dev/null; then
              echo "::error::The pull request changed after this run started. Re-run CI for the current head." >&2
              exit 1
            fi
            git fetch --no-tags origin "$EXPECTED_HEAD_SHA"
            head="$(git rev-parse FETCH_HEAD)"
            current_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            if [ "$head" != "$EXPECTED_HEAD_SHA" ] || ! jq -e --arg head "$EXPECTED_HEAD_SHA" '.head.sha == $head' <<<"$current_pr" >/dev/null; then
              echo "::error::The pull request changed during the fetch. Re-run CI for the current head." >&2
              exit 1
            fi
            base="$GITHUB_SHA"
          elif [ "$EVENT_NAME" = merge_group ]; then
            head="$GROUP_HEAD_SHA"
            base="$GROUP_BASE_SHA"
            git fetch --no-tags origin "$head"
            if [ "$(git rev-parse FETCH_HEAD)" != "$head" ]; then
              echo "::error::The merge group head could not be fetched." >&2
              exit 1
            fi
            # The merge count is 1 (docs/sdlc/ci.md), so the group's ref names its one pull request.
            # A ref of another shape reads no label, and growth then fails.
            if [[ "$GROUP_HEAD_REF" =~ ^refs/heads/gh-readonly-queue/main/pr-([0-9]+)-[0-9a-f]{40}$ ]]; then
              pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/${BASH_REMATCH[1]}")"
            fi
          else
            head="$GITHUB_SHA"
            base=origin/main
          fi
          # Live labels, so a re-run of this job sees a label added after the event.
          if [ -n "$pr" ] && jq -e 'any(.labels[]; .name == "baseline-growth")' <<<"$pr" >/dev/null; then
            growth=(--allow-growth)
          fi
          node .ai/skills/check-code-quality/scripts/complexity-gate.mjs --base "$base" --head "$head" "${growth[@]}"

  clone-gate:
    name: Check new code clones
    if: ${{ github.event_name == 'pull_request_target' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.pr_number == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
          # One commit. A depth of 0 fetches every branch and tag; see classify-pr.
          fetch-depth: 1
      # A merge group head's parent is the group base, so fetching the head in the
      # gate step is enough. Pull requests and dispatches compare with a merge base
      # further back, so they fetch the full history of this commit and main only.
      - name: Fetch the history the gate compares
        if: github.event_name != 'merge_group'
        run: git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reject new code clones
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request_target ]; then
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            if ! jq -e --arg head "$EXPECTED_HEAD_SHA" '.head.sha == $head' <<<"$pr" >/dev/null; then
              echo "::error::The pull request changed after this run started. Re-run CI for the current head." >&2
              exit 1
            fi
            git fetch --no-tags origin "$EXPECTED_HEAD_SHA"
            head="$(git rev-parse FETCH_HEAD)"
            current_pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            if [ "$head" != "$EXPECTED_HEAD_SHA" ] || ! jq -e --arg head "$EXPECTED_HEAD_SHA" '.head.sha == $head' <<<"$current_pr" >/dev/null; then
              echo "::error::The pull request changed during the fetch. Re-run CI for the current head." >&2
              exit 1
            fi
            base="$GITHUB_SHA"
          elif [ "$EVENT_NAME" = merge_group ]; then
            head="$GROUP_HEAD_SHA"
            base="$GROUP_BASE_SHA"
            git fetch --no-tags origin "$head"
            if [ "$(git rev-parse FETCH_HEAD)" != "$head" ]; then
              echo "::error::The merge group head could not be fetched." >&2
              exit 1
            fi
          else
            head="$GITHUB_SHA"
            base=origin/main
          fi
          node .github/scripts/check-clones.cjs --base "$base" --head "$head"

  # Keep typechecking mandatory while using Blacksmith's smallest x64 tier
  # for PRs and diagnostic dispatches. Main and queue verification stay free.
  typecheck:
    name: Typecheck
    needs: queue-proof
    if: ${{ !cancelled() && (needs.queue-proof.result != 'success' || needs.queue-proof.outputs.verified != 'true') }}
    runs-on: ${{ (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - *resolve-dispatch
      # PR-aware dispatch verifies the same merge result as the PR event.
      # Bare dispatch keeps the immutable SHA receiving the check.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event.pull_request.number || steps['resolve-dispatch'].outputs.valid == 'true') && format('refs/pull/{0}/merge', github.event.pull_request.number || inputs.pr_number) || github.sha }}
          # CI intentionally executes the PR merge result under pull_request_target;
          # opt out of checkout's fork protection for this reviewed, read-only gate.
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          fetch-depth: 2

      # Lint the merge result's workflows, so an unknown input or secret on a
      # `uses: ./.github/workflows/…` caller, or a bad expression, fails here in
      # seconds instead of in a live PR run (hearsay-tools/cezarion#1130).
      # actionlint 1.7.10 is the first release that reads YAML anchors such as
      # `*resolve-dispatch`. shellcheck is pinned too, so a runner-image update
      # cannot change which findings fail the gate; warning level keeps info and
      # style findings out.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'
          SHELLCHECK_OPTS: '--severity=warning'
        run: |
          tools="$RUNNER_TEMP/workflow-lint"
          mkdir -p "$tools"
          curl -fsSL --retry 3 -o "$tools/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tools/shellcheck.tar.gz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          printf '%s  %s\n' \
            "$ACTIONLINT_SHA256" "$tools/actionlint.tar.gz" \
            "$SHELLCHECK_SHA256" "$tools/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xzf "$tools/shellcheck.tar.gz" -C "$tools" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$tools/actionlint" -shellcheck="$tools/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" -pyflakes=

      - name: Set up pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          node-version: '24.21.0'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      # Keep the bounded download retry from the former floor job
      # (hearsay-tools/cezarion#1214). A second failure fails this job.
      - name: Retry Node.js setup
        if: steps['setup-node'].outcome != 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        with:
          node-version: '24.21.0'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') == ''
        run: npm ci

      - name: Install pnpm dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      # Fail a change that adds a bare `#N` issue or PR citation
      # (hearsay-tools/cezarion#1310). HEAD^1 is the base the PR or merge group
      # merged into, or the previous commit on a bare dispatch. A push reaches
      # main only through a PR this step already checked, and HEAD^1 there is
      # only its last commit, so a push run would re-check part of it after the
      # merge, where a failure cannot be fixed first.
      - name: Check issue citations
        if: github.event_name != 'push'
        run: node .github/scripts/check-citations.cjs --base HEAD^1

      # The repository's own lint rules and the ast-grep baselines (hearsay-tools/cezarion#2416).
      # This job runs on every change surface, so no test selection can skip them.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Cheap deterministic checks precede review admission and heavy verification.
  # For PRs into main, review admission and heavy verification then run side by
  # side; verify requires both.
  preflight:
    name: Review preflight
    needs: [queue-proof, change-surface, classify-pr, complexity-gate, clone-gate, typecheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require preflight checks
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CLASSIFY_RESULT: ${{ needs.classify-pr.result }}
          SURFACE_RESULT: ${{ needs.change-surface.result }}
          COMPLEXITY_RESULT: ${{ needs.complexity-gate.result }}
          CLONE_RESULT: ${{ needs.clone-gate.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          PROOF_RESULT: ${{ needs.queue-proof.result }}
          PROOF_VERIFIED: ${{ needs.queue-proof.outputs.verified }}
        run: |
          test "$CANCELLED" = false
          test "$CLASSIFY_RESULT" = success
          test "$SURFACE_RESULT" = success
          if [ "$EVENT_NAME" = pull_request_target ] || [ "$EVENT_NAME" = merge_group ] || { [ "$EVENT_NAME" = workflow_dispatch ] && [ -z "$PR_NUMBER" ]; }; then
            test "$COMPLEXITY_RESULT" = success
            test "$CLONE_RESULT" = success
          else
            test "$COMPLEXITY_RESULT" = success -o "$COMPLEXITY_RESULT" = skipped
            test "$CLONE_RESULT" = success -o "$CLONE_RESULT" = skipped
          fi
          if [ "$EVENT_NAME" = push ] && [ "$PROOF_RESULT" = success ] && [ "$PROOF_VERIFIED" = true ]; then
            test "$TYPECHECK_RESULT" = skipped
          else
            test "$TYPECHECK_RESULT" = success
          fi
      - name: Reject a cancelled run
        if: cancelled()
        run: exit 1

  # Heavy verification waits only for its skip decisions and immutable PR inputs.
  # Typecheck and cheap-gate failures still fail verify after this work runs.
  unit-tests:
    name: Unit tests (${{ matrix.suite }})
    needs: [queue-proof, pr-test-input]
    if: ${{ !cancelled() && (needs.queue-proof.result != 'success' || needs.queue-proof.outputs.verified != 'true') && (github.event_name != 'pull_request_target' || needs.pr-test-input.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        suite: [package, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - *resolve-dispatch
      # PR-aware dispatch verifies the same merge result as the PR event.
      # Bare dispatch keeps the immutable SHA receiving the check.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event.pull_request.number || steps['resolve-dispatch'].outputs.valid == 'true') && format('refs/pull/{0}/merge', github.event.pull_request.number || inputs.pr_number) || github.sha }}
          # CI intentionally executes the PR merge result under pull_request_target;
          # opt out of checkout's fork protection for this reviewed, read-only gate.
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # Select the installer from the checked-out merge result: this trusted-base
      # workflow must support a PR that replaces the npm lockfile with pnpm.
      # The build and packaged CLI tests verify the exact engines.node minimum.
      # Vitest and browser shards follow current LTS without repeating the suites.
      - name: Set up pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          node-version: '24.21.0'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      # Keep the bounded download retry from the former floor job
      # (hearsay-tools/cezarion#1214). A second failure fails this job.
      - name: Retry Node.js setup
        if: steps['setup-node'].outcome != 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        with:
          node-version: '24.21.0'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') == ''
        run: npm ci

      - name: Install pnpm dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: npm run test:unit:${{ matrix.suite }}

  build-and-package:
    name: Build and package
    needs: [queue-proof, pr-test-input]
    if: ${{ !cancelled() && (needs.queue-proof.result != 'success' || needs.queue-proof.outputs.verified != 'true') && (github.event_name != 'pull_request_target' || needs.pr-test-input.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: read

    steps:
      - *resolve-dispatch
      # PR-aware dispatch verifies the same merge result as the PR event.
      # Bare dispatch keeps the immutable SHA receiving the check.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event.pull_request.number || steps['resolve-dispatch'].outputs.valid == 'true') && format('refs/pull/{0}/merge', github.event.pull_request.number || inputs.pr_number) || github.sha }}
          # CI intentionally executes the PR merge result under pull_request_target;
          # opt out of checkout's fork protection for this reviewed, read-only gate.
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # Select the installer from the checked-out merge result: this trusted-base
      # workflow must support a PR that replaces the npm lockfile with pnpm.
      # The build and packaged CLI tests verify the exact engines.node minimum.
      # Vitest and browser shards follow current LTS without repeating the suites.
      - name: Set up pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          node-version: '24.21.0'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      # Keep the bounded download retry from the former floor job
      # (hearsay-tools/cezarion#1214). A second failure fails this job.
      - name: Retry Node.js setup
        if: steps['setup-node'].outcome != 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 3
        with:
          node-version: '24.21.0'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') == ''
        run: npm ci

      - name: Install pnpm dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: npm run build

      - name: Typecheck packaged CLI E2E tests
        run: npm run typecheck:package

      - name: Run packaged CLI E2E tests
        run: npm run test:package

      # Every package the release publishes must be packable — the workspace root is `private`
      # and publishes nothing, so packing THERE just errors ("must have name and version").
      # Named explicitly rather than with `--workspaces`, which would also pack the packages
      # marked private (the cockpit SPA and, for now, the api-client) and vouch for tarballs
      # nobody publishes. The active alias is not a workspace, so it packs from its own directory.
      - name: Verify release packages
        run: |
          node .github/scripts/release-packages.cjs pack-check

  vitest:
    name: Vitest shard ${{ matrix.shard }}/8
    # Docs-only and infra-only changes, and verified manifest-only bot release
    # bumps, do not need to repeat the suites already covered by the relevant
    # release or docs gate; infra-only diffs cannot reach the package sources
    # Vitest covers, and their script tests run under unit-tests.
    needs: [ queue-proof, change-surface, classify-pr, pr-test-input ]
    if: >-
      !cancelled() && (needs.queue-proof.result != 'success' || needs.queue-proof.outputs.verified != 'true') && needs.change-surface.outputs.surface == 'full-matrix' && needs.classify-pr.outputs.bump_pr != 'true' && (github.event_name != 'pull_request_target' || needs.pr-test-input.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7, 8 ]
    runs-on: ubuntu-24.04
    # Coverage now shares the required test run on PRs and dispatches. Keep the
    # previous coverage job bound there; main gets 20 minutes. A merge group gets 40,
    # room for the shard to run twice (docs/sdlc/ci.md § Rerun of a failed queue shard).
    timeout-minutes: ${{ (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && 25 || github.event_name == 'merge_group' && 40 || 20 }}

    permissions:
      contents: read
      pull-requests: read

    steps:
      - *resolve-dispatch
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-test-input.outputs.sha || (steps['resolve-dispatch'].outputs.valid == 'true' && format('refs/pull/{0}/merge', inputs.pr_number)) || github.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          fetch-depth: 100

      - name: Fetch PR selection base
        if: github.event_name == 'pull_request_target'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=100 origin "$PR_BASE" || echo "Selection base unavailable; selectors fall back to full suites."

      - name: Set up pnpm
        if: (hashFiles('pnpm-lock.yaml') != '')
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      # One exact Node version in .node-version, shared with developers, so Squeal's
      # shared results (merge groups) carry the environment developers key on.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies
        if: (hashFiles('pnpm-lock.yaml') == '')
        run: npm ci

      - name: Install pnpm dependencies
        if: (hashFiles('pnpm-lock.yaml') != '')
        run: pnpm install --frozen-lockfile

      - name: Run selected PR unit suites
        id: collect_pr
        if: github.event_name == 'pull_request_target'
        env:
          VITEST_FILE_DURATION_CAP: '1'
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-changed.mjs --ci --base="$PR_BASE" -- --shard=${{ matrix.shard }}/8 --maxWorkers=4 --coverage.enabled

      - name: Run server and cockpit unit suites
        id: collect
        env:
          VITEST_FILE_DURATION_CAP: '1'
        run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers=4 ${{ (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && '--coverage.enabled' || '' }}
        if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group' && !(github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == '')

      # Merge groups (the run whose SHA becomes main) run the same command under
      # `squeal ci record`, which returns the command's exit code and output and writes
      # part files for the squeal-export job. See docs/sdlc/ci.md § Squeal shared results.
      # A squeal_gate_trial dispatch records too, without its own V8 coverage, so Squeal's
      # provider writes coverage records into the parts for squeal-gate-trial.
      # Squeal's action puts `squeal` on the PATH and runs it with the Node set up above. It is
      # pinned to a release commit, its version in the comment (Dependabot moves both), and
      # never fails the job: when Squeal cannot run, `squeal ci record` runs the command alone
      # with its exit code (hearsay-tools/squeal spec 018 D20).
      - name: Set up Squeal
        if: (github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == ''))
        uses: hearsay-tools/squeal/ci@ebd52be86287031f36c0f4fae8d4afbc90f2568a # v0.1.443

      - name: Run server and cockpit unit suites with Squeal recording
        id: record
        # In a merge group a failed first run does not fail the job: the rerun below decides.
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        env:
          VITEST_FILE_DURATION_CAP: '1'
          PARTS_DIR: squeal-parts
        run: &record-shard |
          set -- npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers=4
          exec squeal ci record --out "$RUNNER_TEMP/$PARTS_DIR" -- "$@"
        if: (github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == ''))

      # A merge-group shard whose first run fails runs the whole shard once more, in the same
      # order, recorded into new parts; the shard passes only when the rerun passes. The reset
      # lists the first run's failed files and deletes Vitest's results cache, which would
      # otherwise reorder the rerun. See docs/sdlc/ci.md § Rerun of a failed queue shard.
      - name: Reset Vitest's results cache for the rerun
        id: reset
        if: github.event_name == 'merge_group' && steps.record.outcome == 'failure'
        run: node .github/scripts/vitest-rerun-reset.cjs . "$RUNNER_TEMP/failed-test-files.txt"

      # Before the rerun, so a rerun that reaches the job's time limit cannot cancel it.
      - name: Upload the first run's failed test files
        if: "!cancelled() && github.event_name == 'merge_group' && steps.record.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-test-files-vitest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/failed-test-files.txt
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Rerun server and cockpit unit suites with Squeal recording
        id: rerun
        if: github.event_name == 'merge_group' && steps.record.outcome == 'failure'
        env:
          VITEST_FILE_DURATION_CAP: '1'
          PARTS_DIR: squeal-parts-rerun
        run: *record-shard

      - name: Upload Squeal parts
        # A status function: without one GitHub adds success(), and a shard whose tests failed
        # would lose its parts and recording cost, which the gate trial reads. After a rerun only
        # its parts upload: `squeal ci export` refuses two parts for one shard. When Squeal could
        # not run there are no parts: the upload fails and continues on error.
        if: "!cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == ''))"
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: squeal-parts-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/${{ steps.rerun.outcome == 'skipped' && 'squeal-parts' || 'squeal-parts-rerun' }}/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload shard coverage
        id: upload
        if: (!cancelled() && (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch')) && !(github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == '')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-coverage-shard-${{ matrix.shard }}
          path: .ai/qa/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Report a missing shard coverage report
        if: always() && (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && ((steps.collect.outcome != 'success' && steps.collect_pr.outcome != 'success') || steps.upload.outcome != 'success') && !(github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == '')
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
          COLLECT: ${{ github.event_name == 'pull_request_target' && steps.collect_pr.outcome || steps.collect.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          if [ "$COLLECT" != success ]; then
            reason="the test run ended as $COLLECT (failed tests, a timeout, or a setup or coverage error)"
          else
            reason="the upload ended as $UPLOAD"
          fi
          echo "::warning title=Vitest coverage shard $SHARD/8 missing::No coverage report from shard $SHARD: $reason. The test verdict comes from the Vitest shard job."
          echo "Vitest coverage shard $SHARD/8: no report, $reason." >> "$GITHUB_STEP_SUMMARY"

  # Squeal shared results, after passing merge-group shards: squeal-export keys the shard
  # parts in a read-only checkout, squeal-publish pushes them as refs/squeal/<sha> for
  # squeal.config.json `shared.ref`. Both stay outside verify.needs and every required
  # check: a failure never blocks a merge. See docs/sdlc/ci.md § Squeal shared results.
  squeal-export:
    name: Export Squeal shared results
    needs: [vitest]
    if: >-
      !cancelled() && github.event_name == 'merge_group' && needs.vitest.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Runs the queued code (install, `ci export`), so it only reads.
    permissions:
      contents: read

    steps:
      - name: Check out the merge group commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      # Squeal's action, as in the shards; a refusal or crash of the Squeal command is a
      # warning (hearsay-tools/squeal spec 018 D20).
      - name: Set up Squeal
        uses: hearsay-tools/squeal/ci@ebd52be86287031f36c0f4fae8d4afbc90f2568a # v0.1.443

      - name: Download Squeal parts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: squeal-parts-shard-*
          path: ${{ runner.temp }}/squeal-parts

      - name: Export Squeal results
        run: squeal ci export --parts "$RUNNER_TEMP"/squeal-parts/squeal-parts-shard-* --out "$RUNNER_TEMP/squeal-results.json.gz"

      - name: Upload Squeal results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: squeal-results
          path: ${{ runner.temp }}/squeal-results.json.gz
          if-no-files-found: error
          retention-days: 3

  # The only job with contents: write. It runs no repository code: no install, build or
  # package script; `squeal ci publish` runs git and reads squeal.config.json.
  squeal-publish:
    name: Publish Squeal shared results
    needs: [squeal-export]
    # A status function in the condition: without one GitHub adds success(), which is
    # false in a merge group because a job further up (pr-test-input) is skipped there.
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.squeal-export.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      # Full history: the publish prunes refs beyond the newest 100 main commits by their
      # place on the first-parent line. No credentials on disk; only the publish step
      # receives the token.
      - name: Check out the merge group commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Squeal's action, as in the shards; a refusal or crash of the Squeal command is a
      # warning (hearsay-tools/squeal spec 018 D20).
      - name: Set up Squeal
        uses: hearsay-tools/squeal/ci@ebd52be86287031f36c0f4fae8d4afbc90f2568a # v0.1.443

      - name: Download Squeal results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: squeal-results
          path: ${{ runner.temp }}/squeal-results

      # The token reaches git as configuration in this step's environment only.
      - name: Publish Squeal results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            squeal ci publish "$RUNNER_TEMP/squeal-results/squeal-results.json.gz" --keep 100

  # A merged commit with no refs/squeal/<sha> gets a warning in the main push run summary.
  # The job reads the ref with a read-only token, never fails, and stays outside verify.needs
  # and every required check. See docs/sdlc/ci.md § Squeal shared results.
  squeal-ref-check:
    name: Check the Squeal shared results ref
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Warn when the Squeal ref is missing
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        with:
          script: |
            const { squealRefWarning } = require('./.github/scripts/squeal-ref-warning.cjs');
            const { state, warning } = await squealRefWarning({ github, ...context.repo, sha: context.sha });
            if (warning) {
              core.warning(warning);
              core.summary.addRaw(`> [!WARNING]\n> ${warning}\n`);
            } else {
              core.summary.addRaw(`Squeal shared results ref \`refs/squeal/${context.sha}\` is present.\n`);
            }
            await core.summary.write();

      # A step that failed before it could report leaves the ref unchecked: say so.
      - name: Warn when the check could not run
        if: always() && (steps.checkout.outcome != 'success' || steps.check.outcome != 'success')
        run: |
          msg="The Squeal shared results ref check did not complete, so the presence of refs/squeal/${GITHUB_SHA} is unknown."
          echo "::warning::$msg"
          printf '> [!WARNING]\n> %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"

  # Squeal quality gate trial (hearsay-tools/squeal spec 020 D13, row 020-08c). Only a manual
  # dispatch with squeal_gate_trial and no pr_number runs it. Its Vitest shards record under
  # `squeal ci record` without their own V8 coverage, so Squeal's provider writes coverage
  # records into the parts; this job runs `squeal code --base origin/main --parts` on them and
  # reports in its job summary and the squeal-gate-trial artifact. It never fails the run:
  # every step continues on error, and it is outside verify.needs and the queue roster.
  # See docs/sdlc/ci.md § Squeal quality gate trial.
  squeal-gate-trial:
    name: Squeal quality gate trial
    needs: [vitest]
    # A status function in the condition: without one GitHub adds success(), which is false
    # here because jobs further up (pr-test-input) are skipped in a dispatch.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == '' && (needs.vitest.result == 'success' || needs.vitest.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true

    # Runs the dispatched code (install, the gate's own test runs), so it only reads.
    permissions:
      contents: read

    steps:
      - name: Check out the dispatched commit
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      # The gate compares with the merge base of origin/main, so it fetches this commit's
      # history and main only, as complexity-gate does for a bare dispatch.
      - name: Fetch the history the gate compares
        continue-on-error: true
        run: git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm
        continue-on-error: true
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      # The shards' Node: a part's evidence counts only where the environment matches.
      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # Squeal's action, as in the shards; it never fails the job (hearsay-tools/squeal spec 018 D20).
      - name: Set up Squeal
        continue-on-error: true
        uses: hearsay-tools/squeal/ci@ebd52be86287031f36c0f4fae8d4afbc90f2568a # v0.1.443

      - name: Download Squeal parts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: squeal-parts-shard-*
          path: ${{ runner.temp }}/squeal-parts

      # The gate's exit code is its verdict: 0 pass, 1 violations, 3 incomplete, 2 a setup or
      # usage error. The step keeps it, with the gate's time and stderr, and exits 0.
      - name: Run the Squeal quality gate on the shard parts
        id: gate
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/squeal-gate-trial"
          mkdir -p "$out"
          started="$(date +%s)"
          code=0
          squeal code --base origin/main --json \
            --parts "$RUNNER_TEMP"/squeal-parts/squeal-parts-shard-* > "$out/report.json" 2> "$out/stderr.txt" || code=$?
          echo "$code" > "$out/exit-code"
          echo "$(( $(date +%s) - started ))" > "$out/seconds"
          cat "$out/stderr.txt" >&2

      - name: Report the trial
        if: always()
        continue-on-error: true
        env:
          SHARDS_RESULT: ${{ needs.vitest.result }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          report_filter='
            ([.runs[] | (.from // {}) as $from | .selected[] | ($from[.] // "run")]) as $sources
            | "Verdict: **\(.verdict)** (exit \($code)) in \($seconds) s. Base `\(.base.ref)`, merge base \(.base.commit[0:12]); head \(.head.commit[0:12]).",
              "",
              "Changed functions: \(.functions | length) (\(.counts | to_entries | map("\(.key) \(.value)") | join(", "))). Paths not counted: \(.uncounted | length). Budget \(.budget.seconds) s, timed out: \(.budget.timedOut).",
              "",
              "| Selected test files | From the parts | From the stores | Run by the gate |",
              "|---:|---:|---:|---:|",
              "| \($sources | length) | \([$sources[] | select(. == "parts")] | length) | \([$sources[] | select(. == "store")] | length) | \([$sources[] | select(. == "run")] | length) |",
              "",
              (.runs[] | "- \(.runner): \(.selected | length) selected, \(.completed | length) completed, \(.notFinished | length) not finished, \(.failed | length) with a failed test; run time \(if .durationMs == null then "none" else "\(.durationMs / 1000 | round) s" end).")'
          shard_filter='
            def secs: (if . < 10000 then (. / 10 | round) / 100 else (. / 100 | round) / 10 end) | tostring + " s";
            (map(.testFiles | length) | add) as $files
            | (map([.testFiles[] | select(.record != null)] | length) | add) as $records
            | (map(.header.coverage | if . == null then "none (format 3)" elif has("off") then "off: \(.off)" else "\(.provider), provider \(.providerVersion), record \(.recordVersion)" end) | unique | join("; ")) as $provider
            | (map(.header.cost // empty) | unique_by(.command)) as $costs
            | (map(select(.header.cost != null) | .testFiles[] | .durationMs // 0) | add // 0) as $testMs
            | ($costs | map(.hooksMs) | add // 0) as $hooks
            | "| \($shard) | \(length) | \($files) | \($records) | \($provider) | "
              + (if ($costs | length) == 0 then "not in the parts | | |"
                 else "\($hooks | secs) in \($costs | map(.threads) | add) processes and threads | "
                   + (if $testMs > 0 then "\((1000 * $hooks / $testMs | round) / 10)% of \($testMs | secs)" else "no test time" end)
                   + " | \($costs | map(.afterMs) | add | secs) |" end)'
          out="$RUNNER_TEMP/squeal-gate-trial"
          code="$(cat "$out/exit-code" 2> /dev/null || echo none)"
          seconds="$(cat "$out/seconds" 2> /dev/null || echo unknown)"
          {
            echo "## Squeal quality gate trial"
            echo
            echo "A trial: this job gates nothing and never fails the run. Vitest shards: $SHARDS_RESULT."
            echo
            if jq -e '.format == "squeal-code-gate/1"' "$out/report.json" > /dev/null 2>&1; then
              jq -r --arg code "$code" --arg seconds "$seconds" "$report_filter" "$out/report.json"
            elif [ "$code" = none ]; then
              echo "No report: the gate did not run (gate step: ${GATE:-skipped})."
            else
              echo "No report: exit $code$([ "$code" = 2 ] && echo ', a setup or usage error') after $seconds s. The gate's last stderr lines:"
              echo
              echo '```'
              tail -n 20 "$out/stderr.txt" 2> /dev/null || true
              echo '```'
            fi
            echo
            echo "### Squeal's recording cost, from each shard's parts"
            echo
            found=0
            for dir in "$RUNNER_TEMP"/squeal-parts/squeal-parts-shard-*; do
              [ -d "$dir" ] || continue
              if [ "$found" = 0 ]; then
                echo "| Shard | Parts | Test files | With a record | Coverage provider | Squeal's own time | Share of the test time | After the command |"
                echo "|---|---:|---:|---:|---|---|---|---:|"
                found=1
              fi
              jq -s -r --arg shard "${dir##*-}" "$shard_filter" "$dir"/squeal-part-*.json 2> /dev/null \
                || echo "| ${dir##*-} | the parts do not read | | | | | | |"
            done
            [ "$found" = 1 ] || echo "No shard parts were downloaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the trial report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: squeal-gate-trial
          path: ${{ runner.temp }}/squeal-gate-trial/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # Squeal coverage proof (hearsay-tools/squeal spec 020 D19, row 020-26c; hearsay-tools/squeal#189).
  # Only a manual dispatch with squeal_coverage_proof and no pr_number runs it. Vitest shard 1/8,
  # one of the eight, runs three times on the dispatched commit, each with the project's V8
  # coverage: `squeal` under `squeal ci record`, which reads the V8 provider's payloads into its
  # parts, and `v8` and `v8-control` alone, the second as the run-to-run control.
  # squeal-coverage-proof-compare compares the three. Neither job gates anything: every step
  # continues on error, both jobs set continue-on-error, and both are outside verify.needs and
  # the queue roster.
  # See docs/sdlc/ci.md § Squeal coverage proof.
  squeal-coverage-proof:
    name: Squeal coverage proof ${{ matrix.run }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.squeal_coverage_proof == true && inputs.pr_number == '' }}
    strategy:
      fail-fast: false
      matrix:
        run: [ squeal, v8, v8-control ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true

    # Runs the dispatched code (install, tests), so it only reads.
    permissions:
      contents: read

    steps:
      - name: Check out the dispatched commit
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        continue-on-error: true
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      # The shards' Node, so the three runs and a Vitest shard see the same V8.
      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # Squeal's pinned action, as in the shards; it never fails the job (hearsay-tools/squeal
      # spec 018 D20). Only the `squeal` run records.
      - name: Set up Squeal
        if: matrix.run == 'squeal'
        continue-on-error: true
        uses: hearsay-tools/squeal/ci@ebd52be86287031f36c0f4fae8d4afbc90f2568a # v0.1.443

      # The shard command of a dispatch, with its V8 coverage. Bash's `time` gives the wall and
      # CPU (user + sys) time of the command and every process it waited for. The step keeps
      # the exit code, the times and the coverage report, and exits 0.
      - name: Run Vitest shard 1/8 with V8 coverage
        id: shard
        continue-on-error: true
        env:
          VITEST_FILE_DURATION_CAP: '1'
          PROOF_RUN: ${{ matrix.run }}
        run: |
          out="$RUNNER_TEMP/squeal-coverage-proof"
          mkdir -p "$out"
          set -- npm test -- --shard=1/8 --maxWorkers=4 --coverage.enabled
          if [ "$PROOF_RUN" = squeal ]; then
            set -- squeal ci record --out "$out/parts" -- "$@"
          fi
          load_before="$(cut -d ' ' -f 1 /proc/loadavg 2> /dev/null || true)"
          code=0
          TIMEFORMAT='%3R %3U %3S'
          { time "$@" 2>&3 || code=$?; } 3>&2 2> "$out/time.txt"
          load_after="$(cut -d ' ' -f 1 /proc/loadavg 2> /dev/null || true)"
          read -r wall user sys < "$out/time.txt" || true
          if ! cp .ai/qa/coverage/coverage-final.json "$out/coverage-final.json"; then
            echo "::warning title=Squeal coverage proof $PROOF_RUN::No V8 coverage report (exit $code)."
          fi
          jq -n --arg run "$PROOF_RUN" --argjson code "$code" --arg wall "$wall" --arg user "$user" --arg sys "$sys" \
            --arg root "$GITHUB_WORKSPACE" --arg cpus "$(getconf _NPROCESSORS_ONLN)" --arg model "$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo 2> /dev/null | head -n 1)" \
            --arg loadBefore "$load_before" --arg loadAfter "$load_after" --argjson command "$(printf '%s\0' "$@" | jq -cRs 'split("\u0000")[:-1]')" \
            '{format: "squeal-coverage-proof-run/1", run: $run, command: $command, exitCode: $code,
              wallSeconds: ($wall | tonumber? // null), userSeconds: ($user | tonumber? // null), sysSeconds: ($sys | tonumber? // null),
              root: $root, cpus: ($cpus | tonumber? // null), cpuModel: $model,
              loadBefore: ($loadBefore | tonumber? // null), loadAfter: ($loadAfter | tonumber? // null)}' > "$out/run.json"
          echo "Squeal coverage proof $PROOF_RUN: exit $code, wall ${wall:-unknown} s, CPU ${user:-unknown} s user and ${sys:-unknown} s sys."

      - name: Upload the proof run
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: squeal-coverage-proof-${{ matrix.run }}
          path: ${{ runner.temp }}/squeal-coverage-proof/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  squeal-coverage-proof-compare:
    name: Compare the Squeal coverage proof
    needs: [squeal-coverage-proof]
    # A status function in the condition: without one GitHub adds success(), and a proof run
    # that failed or timed out would skip the comparison of the other two.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.squeal_coverage_proof == true && inputs.pr_number == '' && needs.squeal-coverage-proof.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    permissions:
      contents: read

    steps:
      - name: Check out the comparison script
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Download the proof runs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: squeal-coverage-proof-*
          path: ${{ runner.temp }}/squeal-coverage-proof

      # The script writes the job summary and comparison.json, and exits 0 whatever it finds.
      - name: Compare the proof runs
        if: always()
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/squeal-coverage-comparison"
          mkdir -p "$out"
          node .github/scripts/squeal-coverage-proof.cjs --input "$RUNNER_TEMP/squeal-coverage-proof" --json "$out/comparison.json" \
            >> "$GITHUB_STEP_SUMMARY" || echo "The comparison did not finish (exit $?); see the step log." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the comparison
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: squeal-coverage-comparison
          path: ${{ runner.temp }}/squeal-coverage-comparison/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # Squeal packaged test trial (hearsay-tools/squeal spec 020 D12 and D15, row 020-32;
  # hearsay-tools/squeal#194). Only a manual dispatch with squeal_package_trial and no pr_number
  # runs it. It runs `squeal code`, the one-shot gate an agent runs before a PR, with two keys
  # added: a node:test entry for packages/cezar/test/e2e whose `prepare` builds the packages, and
  # child-process coverage. The gate reads both at the merge base, so the job adds them to
  # squeal.config.json in two local commits, the merge base's and the head's; the repository's
  # own configuration does not change. With squeal_package_trial_commit it measures that commit
  # against its first parent. It never fails the run: every step continues on error, and it is
  # outside verify.needs and the queue roster. See docs/sdlc/ci.md § Squeal packaged test trial.
  squeal-package-trial:
    name: Squeal packaged test trial
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.squeal_package_trial == true && inputs.pr_number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true

    # Runs the measured code (install, build, the gate's own test runs), so it only reads.
    permissions:
      contents: read

    steps:
      - name: Check out the dispatched commit
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      # The gate compares with a merge base, so it fetches this commit's history and main only,
      # as complexity-gate does for a bare dispatch.
      - name: Fetch the history the gate compares
        continue-on-error: true
        run: git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main

      # Base: the merge base of the measured commit and origin/main (or of the given commit and
      # its first parent), with the trial keys. Head: the measured commit's tree with the same
      # keys, on that base. Then the gate's merge base holds the keys, and the head's change is
      # the measured commit's change. The branch squeal-package-trial-base names the base.
      - name: Build the trial commits
        id: commits
        continue-on-error: true
        env:
          TRIAL_COMMIT: ${{ inputs.squeal_package_trial_commit }}
          # `npm run test:package` without its wrapper (scripts/test-package.mjs): its cwd and
          # argv, the root build as `prepare`, and the files the wrapper accepts.
          TRIAL_ENTRY: >-
            {"name": "test:package", "cwd": "packages/cezar",
            "argv": ["--import", "../../scripts/test-home-env.mjs", "--import", "tsx"],
            "include": ["test/e2e/*.test.ts"],
            "prepare": {"command": ["npm", "--prefix", "../..", "run", "build"], "timeoutSeconds": 600}}
          GIT_AUTHOR_NAME: Squeal packaged test trial
          GIT_AUTHOR_EMAIL: noreply@github.com
          GIT_COMMITTER_NAME: Squeal packaged test trial
          GIT_COMMITTER_EMAIL: noreply@github.com
        run: |
          out="$RUNNER_TEMP/squeal-package-trial"
          mkdir -p "$out"
          if [ -n "$TRIAL_COMMIT" ]; then
            # A full SHA only: git fetch must never read the input as an option.
            if ! [[ "$TRIAL_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Squeal packaged test trial::squeal_package_trial_commit must be a full 40-character commit SHA."
              exit 1
            fi
            git cat-file -e "$TRIAL_COMMIT^{commit}" 2> /dev/null || git fetch --no-tags origin "$TRIAL_COMMIT"
            head="$TRIAL_COMMIT"
            ref="$TRIAL_COMMIT^1"
          else
            head="$(git rev-parse HEAD)"
            ref=origin/main
          fi
          merge="$(git merge-base "$ref" "$head")"
          # Sets `tree` to the commit's tree with the trial keys in its squeal.config.json.
          with_trial_keys() {
            { git show "$1:squeal.config.json" 2> /dev/null || echo '{}'; } \
              | jq --argjson entry "$TRIAL_ENTRY" '.coverage = ((.coverage // {}) + {children: true})
                  | .nodeTest = ([(.nodeTest // [])[] | select(.name != $entry.name)] + [$entry])' > "$out/squeal.config.$2.json"
            blob="$(git hash-object -w "$out/squeal.config.$2.json")"
            index="$RUNNER_TEMP/squeal-package-trial-index"
            rm -f "$index"
            GIT_INDEX_FILE="$index" git read-tree "$1"
            GIT_INDEX_FILE="$index" git update-index --add --cacheinfo "100644,$blob,squeal.config.json"
            tree="$(GIT_INDEX_FILE="$index" git write-tree)"
            rm -f "$index"
          }
          with_trial_keys "$merge" base
          base="$(git commit-tree "$tree" -p "$merge" -m 'Squeal packaged test trial: the merge base with the trial keys')"
          with_trial_keys "$head" head
          trial="$(git commit-tree "$tree" -p "$base" -m 'Squeal packaged test trial: the measured commit with the trial keys')"
          git branch --force squeal-package-trial-base "$base"
          git checkout --quiet --detach "$trial"
          jq -n --arg ref "$ref" --arg head "$head" --arg merge "$merge" --arg base "$base" --arg trial "$trial" \
            '{format: "squeal-package-trial-commits/1", ref: $ref, head: $head, mergeBase: $merge, base: $base, trial: $trial}' > "$out/commits.json"
          echo "Squeal packaged test trial: $head against $ref (merge base $merge); local base $base, head $trial."

      - name: Set up pnpm
        id: pnpm
        continue-on-error: true
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      # After the trial commits: the measured tree's Node and lockfile.
      - name: Set up Node.js
        id: node
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # Squeal's action, as in the shards; it never fails the job (hearsay-tools/squeal spec 018 D20).
      - name: Set up Squeal
        id: squeal_setup
        continue-on-error: true
        uses: hearsay-tools/squeal/ci@ebd52be86287031f36c0f4fae8d4afbc90f2568a # v0.1.443

      # The gate's exit code is its verdict: 0 pass, 1 violations, 3 incomplete, 2 a setup or
      # usage error. Its budget is twice the default 600 s, so a slow build still gives a report;
      # the report has each run's time. The step keeps the exit code, time and stderr, and exits 0.
      - name: Run the Squeal quality gate with the packaged tests
        id: gate
        # Never on the unchanged checkout, nor on an unprepared environment: a failed setup step
        # keeps its outcome under continue-on-error, so each one is checked.
        if: steps.commits.outcome == 'success' && steps.pnpm.outcome == 'success' && steps.node.outcome == 'success' && steps.install.outcome == 'success' && steps.squeal_setup.outcome == 'success'
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/squeal-package-trial"
          mkdir -p "$out"
          started="$(date +%s)"
          code=0
          squeal code --base squeal-package-trial-base --json --timeout 1200 > "$out/report.json" 2> "$out/stderr.txt" || code=$?
          echo "$code" > "$out/exit-code"
          echo "$(( $(date +%s) - started ))" > "$out/seconds"
          cat "$out/stderr.txt" >&2

      - name: Report the trial
        if: always()
        continue-on-error: true
        env:
          GATE: ${{ steps.gate.outcome }}
          SETUP: "pnpm ${{ steps.pnpm.outcome }}, Node.js ${{ steps.node.outcome }}, install ${{ steps.install.outcome }}, Squeal ${{ steps.squeal_setup.outcome }}"
          PACKAGED_TESTS: packages/cezar/test/e2e/
        run: |
          report_filter='
            def secs: if . == null then "none" else "\(. / 1000 | round) s" end;
            def packaged: [(.loaders.expected + .loaders.measured)[] | select(startswith($packaged))] | unique;
            "Verdict: **\(.verdict)** (exit \($code)) in \($seconds) s. Budget \(.budget.seconds) s, timed out: \(.budget.timedOut). Child coverage read at the base: \(.base.policy.coverageChildren // false).",
            "",
            "Changed functions: \(.functions | length) (\(.counts | to_entries | map("\(.key) \(.value)") | join(", "))). Paths not counted: \(.uncounted | length).",
            "",
            (.runs[] | "- \(.runner): \(.selected | length) selected, \(.completed | length) completed, \(.notFinished | length) not finished, \(.failed | length) with a failed test; run time \(.durationMs | secs)"
              + (if .children then "; child coverage files read \(.children.read), dropped \(.children.dropped)" else "" end) + ".",
              ((.prepare // [])[] | "  - `prepare` of `\(.project)`: `\(.command | join(" "))`, \(.outcome), exit \(.exit // "none"), \(.durationMs | secs); \(.notRun | length) selected files did not run because of it.")),
            "",
            "### Changed functions that the packaged tests load, and every function that is not pass",
            "",
            ([.functions[] | select((packaged | length) > 0 or .state != "pass")] as $rows
              | if ($rows | length) == 0 then "None."
                else "| Function | State | Gap | Lines covered | CRAP | Packaged loaders |", "|---|---|---|---:|---:|---|",
                  ($rows[:60][] | "| `\(.path)` `\(.qualifiedName)` | \(.state) | \(.gap // "") | \(if .coverage then "\(.coverage.covered)/\(.coverage.lines)" else "" end) | \(.crap // "") | \(packaged | map("`\(ltrimstr($packaged))`") | join(", ")) |"),
                  (if ($rows | length) > 60 then "", "\($rows | length - 60) more in report.json." else empty end)
                end)'
          out="$RUNNER_TEMP/squeal-package-trial"
          code="$(cat "$out/exit-code" 2> /dev/null || echo none)"
          seconds="$(cat "$out/seconds" 2> /dev/null || echo unknown)"
          {
            echo "## Squeal packaged test trial"
            echo
            echo "A trial: this job gates nothing and never fails the run. The gate read a node:test entry \`test:package\` with \`prepare\`, and \`coverage.children: true\`, added to \`squeal.config.json\` in two local commits; the configuration in the repository is unchanged."
            echo
            if jq -e '.format == "squeal-package-trial-commits/1"' "$out/commits.json" > /dev/null 2>&1; then
              jq -r '"Measured: \(.head[0:12]) against `\(.ref)`, merge base \(.mergeBase[0:12]). Local commits with the trial keys: base \(.base[0:12]), head \(.trial[0:12])."' "$out/commits.json"
            else
              echo "No trial commits: the step that builds them failed (see its log)."
            fi
            echo
            if jq -e '.format == "squeal-code-gate/1"' "$out/report.json" > /dev/null 2>&1; then
              jq -r --arg code "$code" --arg seconds "$seconds" --arg packaged "$PACKAGED_TESTS" "$report_filter" "$out/report.json"
            elif [ "$code" = none ]; then
              echo "No report: the gate did not run (gate step: ${GATE:-skipped}; setup: $SETUP)."
            else
              echo "No report: exit $code$([ "$code" = 2 ] && echo ', a setup or usage error') after $seconds s. The gate's last stderr lines:"
              echo
              echo '```'
              tail -n 20 "$out/stderr.txt" 2> /dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the trial report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: squeal-package-trial
          path: ${{ runner.temp }}/squeal-package-trial/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # Merges the eight shard reports into one repo-relative Istanbul `coverage-final.json` and
  # uploads it as `vitest-coverage-<head SHA>`. See docs/sdlc/ci.md § Vitest coverage artifact.
  vitest-coverage-merge:
    name: Merge Vitest coverage
    needs: [vitest]
    if: ${{ !cancelled() && (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && needs.vitest.result != 'skipped' && !(github.event_name == 'workflow_dispatch' && inputs.squeal_gate_trial == true && inputs.pr_number == '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out the scripts
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .ai/skills/check-code-quality/scripts

      - name: Set up Node.js
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Download shard coverage
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vitest-coverage-shard-*
          path: shards

      - name: Merge shard coverage
        id: merge
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node .github/scripts/merge-vitest-coverage.mjs --input shards --output merged --shards 8 --root "$GITHUB_WORKSPACE" \
            --meta "headSha=$HEAD_SHA" --meta "testedRef=$TESTED_REF" --meta "baseSha=$BASE_SHA" \
            --meta "runId=$RUN_ID" --meta "runAttempt=$RUN_ATTEMPT" 2> merge.err || { cat merge.err >&2; exit 1; }

      - name: Upload merged coverage
        id: upload
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: merged/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Report the coverage artifact
        if: always()
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SHARDS_RESULT: ${{ needs.vitest.result }}
          DOWNLOAD: ${{ steps.download.outcome }}
          MERGE: ${{ steps.merge.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          if [ "$UPLOAD" = success ]; then
            echo "Vitest coverage uploaded as artifact vitest-coverage-$HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$MERGE" = failure ] && [ -s merge.err ]; then
            reason="$(tr '\r\n' '  ' < merge.err | sed 's/ *$//')"
          elif [ "$MERGE" = failure ]; then
            reason="the merge step failed"
          elif [ "$DOWNLOAD" != success ]; then
            reason="the shard download ended as $DOWNLOAD"
          else
            reason="the upload ended as ${UPLOAD:-skipped} (merge ${MERGE:-skipped})"
          fi
          echo "::warning title=Vitest coverage artifact not uploaded::No vitest-coverage-$HEAD_SHA artifact: $reason (shard jobs: $SHARDS_RESULT). Test verdicts are not affected."
          echo "Vitest coverage not uploaded: $reason (shard jobs: $SHARDS_RESULT)." >> "$GITHUB_STEP_SUMMARY"

  # Own GitHub check, separate from the packaged CLI E2E step in build-and-package.
  # Skip is a failure here: a machine that cannot drive the cockpit must not
  # green the required aggregate. This job opts into skip-exit-0 with
  # --allow-skip, then checks the marker through require-e2e-passed.cjs.
  cockpit-browser:
    name: Cockpit browser E2E shard ${{ matrix.shard }}/8
    # Same docs-only, infra-only, and verified bump-PR skips as Vitest.
    needs: [ queue-proof, change-surface, classify-pr, pr-test-input ]
    if: >-
      !cancelled() && (needs.queue-proof.result != 'success' || needs.queue-proof.outputs.verified != 'true') && needs.change-surface.outputs.surface == 'full-matrix' && needs.classify-pr.outputs.bump_pr != 'true' && (github.event_name != 'pull_request_target' || needs.pr-test-input.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7, 8 ]
    runs-on: ubuntu-latest
    # A merge group gets room for the shard to run twice (§ Rerun of a failed queue shard).
    timeout-minutes: ${{ github.event_name == 'merge_group' && 40 || 30 }}

    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - *resolve-dispatch
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-test-input.outputs.sha || (steps['resolve-dispatch'].outputs.valid == 'true' && format('refs/pull/{0}/merge', inputs.pr_number)) || github.sha }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          fetch-depth: 100

      - name: Set up pnpm
        if: (hashFiles('pnpm-lock.yaml') != '')
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # Runner images can cache different LTS patch versions.
          check-latest: true
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Run selected PR browser specs
        id: e2e-pr
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/e2e-affected.mjs --ci --allow-skip --shard=${{ matrix.shard }}/8 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          node .github/scripts/require-e2e-passed.cjs < "$RUNNER_TEMP/e2e.log"

      - name: Run cockpit browser E2E
        id: e2e
        if: github.event_name != 'pull_request_target'
        # In a merge group a failed first run does not fail the job: the rerun below decides.
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        run: &browser-shard |
          set -o pipefail
          npm run test:e2e -- --allow-skip --shard=${{ matrix.shard }}/8 2>&1 | tee e2e.log
          node .github/scripts/require-e2e-passed.cjs < e2e.log

      # The rerun clears each spec's old failure bundles, so the first run's ship first.
      - name: Upload the first run's failure bundles
        if: github.event_name == 'merge_group' && steps.e2e.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-failures-first-run-shard-${{ matrix.shard }}
          path: .ai/qa/failures/
          if-no-files-found: ignore
          retention-days: 14

      # The same rerun as a Vitest shard's, for the browser config's own results cache.
      - name: Reset Vitest's results cache for the rerun
        id: reset
        if: github.event_name == 'merge_group' && steps.e2e.outcome == 'failure'
        run: node .github/scripts/vitest-rerun-reset.cjs packages/web/e2e "$RUNNER_TEMP/failed-test-files.txt"

      - name: Upload the first run's failed test files
        if: "!cancelled() && github.event_name == 'merge_group' && steps.e2e.outcome == 'failure'"
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-test-files-cockpit-browser-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/failed-test-files.txt
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

      - name: Rerun cockpit browser E2E
        id: e2e-rerun
        if: github.event_name == 'merge_group' && steps.e2e.outcome == 'failure'
        run: *browser-shard

      # A red spec writes `.ai/qa/failures/<spec>/<test>-<n>/` (screenshot, snapshot, probe)
      # through the e2e seam (#408). Ship it so the flake can be read instead of guessed at;
      # a green shard has no directory and uploads nothing.
      - name: Upload failure bundles
        if: (failure())
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-failures-shard-${{ matrix.shard }}
          path: .ai/qa/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize failure bundles
        if: (failure())
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -d .ai/qa/failures ]; then
            {
              echo "### Cockpit failure bundles (shard $SHARD/8)"
              echo
              echo "Artifact \`cockpit-failures-shard-$SHARD\` holds each bundle's screenshot.png, snapshot.txt and probe.json."
              echo
              find .ai/qa/failures -mindepth 2 -maxdepth 2 -type d | sort | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Cockpit failure bundles (shard $SHARD/8): none written" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Keep this aggregate job's name stable: branch protection uses it as the
  # required-check identity while the work runs in the build, Vitest, and
  # cockpit browser jobs.
  verify:
    name: Unit, build, E2E, and package
    needs: [queue-proof, change-surface, classify-pr, complexity-gate, clone-gate, typecheck, preflight, review-result, unit-tests, build-and-package, vitest, cockpit-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require every verification job
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          REVIEW_RESULT: ${{ needs.review-result.result }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PROOF_RESULT: ${{ needs.queue-proof.result }}
          PROOF_VERIFIED: ${{ needs.queue-proof.outputs.verified }}
          PROOF_SOURCE: ${{ needs.queue-proof.outputs.source }}
          VERIFIED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify-pr.result }}
          SURFACE_RESULT: ${{ needs.change-surface.result }}
          CLONE_GATE_RESULT: ${{ needs['clone-gate'].result }}
          COMPLEXITY_GATE_RESULT: ${{ needs['complexity-gate'].result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_TESTS_RESULT: ${{ needs['unit-tests'].result }}
          BUILD_AND_PACKAGE_RESULT: ${{ needs['build-and-package'].result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
          COCKPIT_BROWSER_RESULT: ${{ needs['cockpit-browser'].result }}
          CHANGE_SURFACE: ${{ needs.change-surface.outputs.surface }}
          # Same output as classify-pr / release-bump-pr.cjs: only a verified
          # manifest-only bot release/v* PR, or a docs-only / infra-only
          # classification, may leave Vitest and cockpit browser skipped.
          BUMP_PR: ${{ needs.classify-pr.outputs.bump_pr }}
        run: |
          test "$CANCELLED" = false
          test "$PREFLIGHT_RESULT" = success
          if [ "$EVENT_NAME" = pull_request_target ] && [ "$BASE_REF" = main ]; then
            test "$REVIEW_RESULT" = success
          fi
          test "$CLASSIFY_RESULT" = success
          test "$SURFACE_RESULT" = success
          # The complexity ratchet runs on pull requests, merge groups and bare dispatches.
          # Other events skip it, and a pull request or a merge group may never skip it.
          if [ "$EVENT_NAME" = pull_request_target ] || [ "$EVENT_NAME" = merge_group ]; then
            test "$COMPLEXITY_GATE_RESULT" = success
            test "$CLONE_GATE_RESULT" = success
          else
            test "$COMPLEXITY_GATE_RESULT" = success -o "$COMPLEXITY_GATE_RESULT" = skipped
            test "$CLONE_GATE_RESULT" = success -o "$CLONE_GATE_RESULT" = skipped
          fi
          if [ "$EVENT_NAME" = push ] && [ "$PROOF_RESULT" = success ] && [ "$PROOF_VERIFIED" = true ]; then
            test "$TYPECHECK_RESULT" = skipped
            test "$UNIT_TESTS_RESULT" = skipped
            test "$BUILD_AND_PACKAGE_RESULT" = skipped
            test "$VITEST_RESULT" = skipped
            test "$COCKPIT_BROWSER_RESULT" = skipped
            printf 'Reused queue verification for %s: %s\n' "$VERIFIED_SHA" "$PROOF_SOURCE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$TYPECHECK_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          test "$BUILD_AND_PACKAGE_RESULT" = success
          # A merge group classifies its own diff, so it takes the docs/infra-only skip;
          # the bump-PR skip stays PR and dispatch only.
          if [ "$CHANGE_SURFACE" = docs-only ] || [ "$CHANGE_SURFACE" = infra-only ] || { [ "$EVENT_NAME" != merge_group ] && [ "$BUMP_PR" = true ]; }; then
            test "$VITEST_RESULT" = success -o "$VITEST_RESULT" = skipped
            test "$COCKPIT_BROWSER_RESULT" = success -o "$COCKPIT_BROWSER_RESULT" = skipped
          else
            test "$VITEST_RESULT" = success
            test "$COCKPIT_BROWSER_RESULT" = success
          fi
      - name: Reject a cancelled run
        if: cancelled()
        run: exit 1

  # Queue admission reads trusted base code and existing native PR-head review.
  queue-admission:
    name: Validate reviewed queue entry
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out trusted queue base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        with:
          retries: 0
          script: |
            const { mergeQueueAdmission, admissionFailure } = require('./.github/scripts/merge-queue-admission.cjs');
            const { sanitize } = require('./.github/scripts/failure-diagnostics.cjs');
            const diagnostics = {};
            try {
              const admission = await mergeQueueAdmission({ github, ...context.repo, group: context.payload.merge_group, releaseAppBotLogin: process.env.RELEASE_APP_BOT_LOGIN, diagnostics });
              await core.summary.addHeading('Existing PR-head review admission').addRaw(JSON.stringify(admission)).write();
            } catch (error) {
              // A speculative group's trusted base can predate this diagnostic helper.
              const diagnostic = admissionFailure ? admissionFailure(error, diagnostics) : sanitize(`${error.name}: ${error.message}`);
              core.error(diagnostic);
              core.setFailed('Queue admission could not verify current native PR CI/review, membership and rules. Inspect the queue and retry; do not bypass.');
              await core.summary.addHeading('Queue admission refused').addRaw(diagnostic.split('\n').map(line => `    ${line}`).join('\n') + '\n').write();
            }

  # Distinct inactive names prevent a skipped job supplying a protected check.
  review-result:
    name: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main') && 'Automated Code Review' || 'PR review (not applicable)' }}
    needs: preflight
    if: always() && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Require a completed review
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: |
          test "$CANCELLED" = false
          if [ "$PREFLIGHT_RESULT" != success ]; then
            echo "::notice::Preflight ended '$PREFLIGHT_RESULT'. Fix it, then use Re-run failed jobs." >&2
            exit 1
          fi
      - name: Check out trusted review admission scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require fresh CodeRabbit admission and resolved threads
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_APP_BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        with:
          retries: 0
          script: |
            const { waitForCodeRabbitAdmission } = require('./.github/scripts/coderabbit-wait.cjs');
            const admission = await waitForCodeRabbitAdmission({ github, ...context.repo, log: message => core.info(message),
              pullNumber: context.payload.pull_request.number, head: context.payload.pull_request.head.sha,
              releaseAppBotLogin: process.env.RELEASE_APP_BOT_LOGIN });
            await core.summary.addHeading('CodeRabbit admission').addRaw(JSON.stringify(admission)).write();
            if (!admission.admitted) {
              core.notice(`CodeRabbit admission blocked: ${admission.reason}. ${admission.action} The reconciler refreshes this job after provider/CI/review events. For eventless thread resolution, dispatch Reconcile CodeRabbit admission with pr_number.`);
              process.exitCode = 1;
            }
      - name: Reject a cancelled run
        if: cancelled()
        run: exit 1

  queue-review-result:
    name: ${{ github.event_name == 'merge_group' && 'Automated Code Review' || 'Queue review (not applicable)' }}
    needs: [verify, queue-admission]
    if: always() && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require verified queue admission
        env:
          CANCELLED: ${{ job.status == 'cancelled' }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          QUEUE_RESULT: ${{ needs.queue-admission.result }}
        run: |
          test "$CANCELLED" = false
          test "$VERIFY_RESULT" = success
          test "$QUEUE_RESULT" = success
      - name: Reject a cancelled run
        if: cancelled()
        run: exit 1

  # npm preview publishing (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482).
  # Publishes `dev` snapshots from `main` after a fully green verify run.
  # PR archives below are published separately by publish-pr-snapshot.yml.
  # Stable `latest` releases are owner-driven and manual via release.yml, so CI
  # never moves `latest`. Without the NPM_TOKEN secret the
  # script degrades to a loud dry run, so this job stays green on unconfigured forks.
  publish-snapshot:
    name: Publish npm snapshot
    needs: verify
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    # Never cancel mid-publish: an interrupted run could leave the scoped
    # package on the registry without its alias.
    concurrency:
      group: npm-snapshot-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
          cache-dependency-path: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm-lock.yaml' || 'package-lock.json' }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') == ''
        run: npm ci

      - name: Install pnpm dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: npm run build

      - name: Publish snapshot
        id: snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/release-snapshot.mjs

      - name: Write workflow summary
        if: steps.snapshot.outputs.attempted == 'true'
        env:
          RESULT: ${{ steps.snapshot.outputs.result }}
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const r = JSON.parse(process.env.RESULT);
          console.log(`## 📦 npm preview ${r.dryRun ? 'dry run (NPM_TOKEN not configured)' : 'published'}`);
          console.log('');
          console.log(`- Version: \`${r.version}\``);
          console.log(`- Dist-tag: \`${r.distTag}\``);
          console.log(`- Packages: ${r.publishedNames.split(',').map(name => `\`${name}\``).join(', ')}`);
          console.log('');
          console.log('```bash');
          for (const line of r.installLines) console.log(line);
          console.log('```');
          EOF


  prepare-pr-snapshot:
    name: Prepare PR snapshot archives
    needs: verify
    if: >-
      !cancelled() && needs.verify.result == 'success' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          persist-credentials: false
      - name: Set up pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') == ''
        run: npm ci
      - name: Install pnpm dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - run: npm run build
      # This job may execute PR code, but has no publishing credentials or OIDC.
      - run: node scripts/release-snapshot.mjs --pack-only
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-snapshot-${{ github.run_attempt }}
          path: snapshot-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 3

  pr-test-input:
    name: Resolve immutable PR test inputs
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.input.outputs.sha }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: input
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |-
            const { resolvePrTestInput } = require('./.github/scripts/pr-test-input.cjs');
            const input = await resolvePrTestInput({ github, ...context.repo,
              pullNumber: context.payload.pull_request.number, head: context.payload.pull_request.head.sha,
              workflowSha: process.env.WORKFLOW_SHA, headRepository: context.payload.pull_request.head.repo.full_name });
            core.setOutput('sha', input.sha);
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
