name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Shared with automated-code-review / recover-review via release-bump-pr.cjs:
  # bot author + release/v* head is not enough — the live PR file list must match
  # the release-finalization allowlist or Vitest/E2E still run.
  classify-pr:
    name: Classify PR shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bump_pr: ${{ steps.classify.outputs.bump_pr }}
    steps:
      # Base (or push SHA) only — never the PR merge tip, so a PR cannot rewrite
      # the classifier to force bump_pr=true and skip Vitest/E2E.
      - name: Check out trusted classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .github/scripts/release-bump-pr.cjs ]; then
            echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT_NAME}" = pull_request ] && [ -n "${PR_NUMBER:-}" ]; then
            if ! LIVE_HEAD_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"; then
              echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export LIVE_HEAD_SHA
            if ! PR_FILES="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"; then
              echo 'bump_pr=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export PR_FILES PR_FILES_OK=1
          fi
          node .github/scripts/release-bump-pr.cjs

  build-and-package:
    name: Typecheck, unit, build, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `lts/*` — the current Node LTS, whatever it is on the day the job runs, so
      # the gate follows the release line users actually install on instead of
      # freezing on a version that quietly ages out of support. The floor stays the
      # root manifest's `engines.node`; this is the ceiling we verify against.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Run packaged CLI E2E tests
        run: npm run test:package

      # Every package the release publishes must be packable — the workspace root is `private`
      # and publishes nothing, so packing THERE just errors ("must have name and version").
      # Named explicitly rather than with `--workspaces`, which would also pack the packages
      # marked private (the cockpit SPA and, for now, the api-client) and vouch for tarballs
      # nobody publishes. `alias-cezarion` is not a workspace, so it packs from its own directory.
      - name: Verify release packages
        run: |
          npm pack --dry-run --ignore-scripts -w @wjarka/cezarion
          (cd alias-cezarion && npm pack --dry-run --ignore-scripts)

  vitest:
    name: Vitest shard ${{ matrix.shard }}/2
    needs: classify-pr
    # Manifest-only bot release/v* bumps skip Vitest (release.yml already verified).
    if: needs.classify-pr.outputs.bump_pr != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript test imports resolve through the server build, as in pretypecheck.
      - name: Build server dependencies
        run: npm run build:server

      - name: Run server and cockpit unit suites
        run: npm test -- --shard=${{ matrix.shard }}/2 --maxWorkers=4

  # Own GitHub check, separate from the packaged CLI E2E step in build-and-package.
  # Skip is a failure here: a machine that cannot drive the cockpit must not
  # green the required aggregate. Local `npm run test:e2e` keeps its skip-exit-0
  # contract; this job pipes the log through require-e2e-passed.cjs.
  cockpit-browser:
    name: Cockpit browser E2E shard ${{ matrix.shard }}/4
    needs: classify-pr
    # Same bump-PR skip as vitest — browser E2E is redundant on manifest-only commits.
    if: needs.classify-pr.outputs.bump_pr != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # Runner images can cache different LTS patch versions.
          check-latest: true
          cache: npm

      - name: Run cockpit browser E2E
        run: |
          set -o pipefail
          npm run test:e2e -- --shard=${{ matrix.shard }}/4 2>&1 | tee e2e.log
          node .github/scripts/require-e2e-passed.cjs < e2e.log

  # Keep this aggregate job's name stable: branch protection uses it as the
  # required-check identity while the work runs in the build, Vitest, and
  # cockpit browser jobs.
  verify:
    name: Unit, build, E2E, and package
    needs: [classify-pr, build-and-package, vitest, cockpit-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Require every verification job
        env:
          BUILD_AND_PACKAGE_RESULT: ${{ needs['build-and-package'].result }}
          VITEST_RESULT: ${{ needs.vitest.result }}
          COCKPIT_BROWSER_RESULT: ${{ needs['cockpit-browser'].result }}
          # Same output as classify-pr / release-bump-pr.cjs: only a verified
          # manifest-only bot release/v* PR may leave Vitest and cockpit skipped.
          BUMP_PR: ${{ needs.classify-pr.outputs.bump_pr }}
        run: |
          test "$BUILD_AND_PACKAGE_RESULT" = success
          if [ "$BUMP_PR" = true ]; then
            test "$VITEST_RESULT" = success -o "$VITEST_RESULT" = skipped
            test "$COCKPIT_BROWSER_RESULT" = success -o "$COCKPIT_BROWSER_RESULT" = skipped
          else
            test "$VITEST_RESULT" = success
            test "$COCKPIT_BROWSER_RESULT" = success
          fi

  # npm preview publishing (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482).
  # Publishes a snapshot of both packages after a fully green verify run:
  # same-repo PRs → dist-tag pr-<N>, develop pushes → @develop. `main` pushes do
  # NOT publish — stable `latest` releases are owner-driven and manual via
  # release.yml, so CI never moves `latest`. Without the NPM_TOKEN secret the
  # script degrades to a loud dry run, so this job stays green on unconfigured forks.
  publish-snapshot:
    name: Publish npm snapshot
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # sticky preview comment on PRs
      id-token: write # npm provenance attestation
    # Never cancel mid-publish: an interrupted run could leave the scoped
    # package on the registry without its alias.
    concurrency:
      group: npm-snapshot-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Publish snapshot
        id: snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/release-snapshot.mjs

      - name: Write workflow summary
        if: steps.snapshot.outputs.attempted == 'true'
        env:
          RESULT: ${{ steps.snapshot.outputs.result }}
        run: |
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const r = JSON.parse(process.env.RESULT);
          console.log(`## 📦 npm preview ${r.dryRun ? 'dry run (NPM_TOKEN not configured)' : 'published'}`);
          console.log('');
          console.log(`- Version: \`${r.version}\``);
          console.log(`- Dist-tag: \`${r.distTag}\``);
          console.log(`- Packages: \`${r.aliasName}\` → \`${r.rootName}\` → \`${r.apiClientName}\``);
          console.log('');
          console.log('```bash');
          for (const line of r.installLines) console.log(line);
          console.log('```');
          EOF

      - name: Comment preview on PR
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.attempted == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ steps.snapshot.outputs.result }}
        with:
          script: |
            const marker = '<!-- cezar-npm-preview -->';
            const r = JSON.parse(process.env.RESULT);
            const lines = r.installLines.map((l) => `    ${l}`).join('\n');
            const banner = r.dryRun
              ? '\n> ⚠️ **Dry run** — the `NPM_TOKEN` secret is not configured, so nothing was actually published. See `docs/publishing.md` for the one-time admin setup.\n'
              : '';
            const body = [
              marker,
              `### 📦 npm preview ${r.dryRun ? 'dry run' : 'published'} — \`${r.version}\``,
              banner,
              'Try this PR build (exact pinned version — copy-paste as-is):',
              '',
              lines,
              '',
              `Also tagged: \`npm install -g ${r.aliasName}@${r.distTag}\` (moving tag for this PR).`,
              `Packages: \`${r.aliasName}@${r.version}\` → \`${r.rootName}@${r.version}\` → \`${r.apiClientName}@${r.version}\`${r.dryRun ? '' : ' (provenance attested)'}.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
