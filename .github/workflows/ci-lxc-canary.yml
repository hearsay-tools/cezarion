name: LXC admission canary

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open cezarion PR number
        required: true
        type: string
      expected_head:
        description: Full PR head commit SHA
        required: true
        type: string
      suite:
        description: Probe scheduling or run one four-shard workload
        required: true
        default: smoke
        type: choice
        options: [smoke, browser, vitest]

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      head: ${{ steps.gate.outputs.head }}
    steps:
      - id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0, as pinned in origin CI
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        with:
          retries: 0
          script: |
            const repoId = 1352758052;
            const authorId = 1118683;
            const n = process.env.PR_NUMBER;
            const sha = process.env.EXPECTED_HEAD;
            const fail = () => core.setFailed('LXC admission denied');
            if (context.eventName !== 'workflow_dispatch' ||
                context.ref !== 'refs/heads/main' ||
                context.payload.repository?.id !== repoId ||
                context.payload.sender?.id !== authorId ||
                context.repo.owner !== 'hearsay-tools' ||
                context.repo.repo !== 'squawk' ||
                !/^[1-9][0-9]*$/.test(n) || !Number.isSafeInteger(Number(n)) ||
                !/^[a-f0-9]{40}$/.test(sha)) return fail();

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(n),
            });
            if (pr.number !== Number(n) || pr.state !== 'open' ||
                pr.user?.id !== authorId || pr.base?.repo?.id !== repoId ||
                pr.base?.ref !== 'main' || pr.head?.repo?.id !== repoId ||
                pr.head?.sha !== sha) return fail();
            core.setOutput('head', sha);

  prove-runner:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.head != '' && inputs.suite == 'smoke'
    runs-on:
      group: cezarion-lxc-canary
      labels: cezarion-lxc-canary
    timeout-minutes: 2
    steps:
      - name: Prove scheduling without running repository code
        run: uname -sm

  trial:
    name: LXC ${{ inputs.suite }} shard ${{ matrix.shard }}/4
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.head != '' && (inputs.suite == 'browser' || inputs.suite == 'vitest')
    runs-on:
      group: cezarion-lxc-canary
      labels: cezarion-lxc-canary
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The admitted PR head can predate the node-dist action, so install Node with the action and
      # .node-version from this workflow's commit. The checkout below replaces the workspace.
      - name: Check out the Node install action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: node-dist-tooling
          persist-credentials: false
          sparse-checkout: |
            .github/actions/node-dist
            .node-version
          sparse-checkout-cone-mode: false
      - name: Install Node.js from nodejs.org
        id: node
        uses: ./node-dist-tooling/.github/actions/node-dist
        with:
          node-version-file: node-dist-tooling/.node-version
      - name: Check out the admitted PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.head }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          EXPECTED_HEAD: ${{ needs.admit.outputs.head }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.node-version }}
          token: ''
      - name: Locate the pnpm store
        id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the trial dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: cezarion-lxc-trial-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Cockpit browser E2E
        if: inputs.suite == 'browser'
        run: |
          set -o pipefail
          npm run test:e2e -- --allow-skip --shard=${{ matrix.shard }}/4 2>&1 | tee e2e.log
          node .github/scripts/require-e2e-passed.cjs < e2e.log
      - name: Upload the browser shard log
        if: inputs.suite == 'browser' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lxc-browser-shard-${{ matrix.shard }}
          path: e2e.log
          if-no-files-found: warn
          retention-days: 3
      - name: Build server dependencies
        if: inputs.suite == 'vitest'
        run: npm run build:server
      - name: Run Vitest with coverage
        if: inputs.suite == 'vitest'
        env:
          VITEST_FILE_DURATION_CAP: '1'
        run: npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=4 --coverage.enabled
      - name: Upload the Vitest shard coverage
        if: inputs.suite == 'vitest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lxc-vitest-coverage-shard-${{ matrix.shard }}
          path: .ai/qa/coverage/coverage-final.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
