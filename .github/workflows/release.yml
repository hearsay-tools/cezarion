name: Release

# Stable `latest` releases are owner-driven and MANUAL — never a push
# (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482). Pushes to `develop`
# and same-repo PRs publish previews via ci.yml's `publish-snapshot`; only this
# workflow moves the `latest` dist-tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (`existing` publishes the version already in packages/cezar/package.json)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - existing

# Default-read at the workflow level; the publish job elevates what it needs.
# Verify stays read-only so a suite run never holds the release OIDC token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Vitest's github-actions reporter appends `## Vitest Test Report` to
  # $GITHUB_STEP_SUMMARY. Keeping Verify in the same job as Publish meant a
  # registry blip after a green suite failed the whole job and, on re-run,
  # left a second / false-failing report next to the passing one (#62).
  # Split like ci.yml: the suite owns one green job; publish is a dependent.
  verify:
    name: Verify before release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Releases from `main` (the stable trunk) or a `release/*` maintenance branch —
    # the latter is how a patch line (e.g. `release/0.9.x`) ships fixes without the
    # newer features already merged to `main`. Dispatch from the BRANCH, never a tag:
    # workflow_dispatch reads this file from the ref it runs on, and a tag's copy is
    # frozen, so a tag would still evaluate the old gate.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run server and cockpit unit suites
        run: npm test

      - name: Build application
        run: npm run build

  release:
    name: Release ${{ inputs.bump }} to npm (latest)
    needs: verify
    # npm trusted publishing and provenance require a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    # Gate the publish behind a required-reviewer approval. If the environment
    # isn't configured yet, GitHub creates it on first use without reviewers
    # (non-blocking); add reviewers at Settings → Environments → production.
    environment: production
    permissions:
      contents: write # create the release tag + GitHub Release via the API
      id-token: write # npm trusted publishing (OIDC) + provenance
      pull-requests: write # open the version-bump PR for patch/minor/major releases

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Publish release
        id: release
        # No npm credential in this job. npm authenticates via OIDC trusted
        # publishing (package settings → Trusted Publisher → release.yml /
        # production). Snapshots and nightlies keep the token — one publisher
        # per package, and dist-tag cleanup is not an OIDC command. See
        # docs/publishing.md.
        run: node scripts/release.mjs "${{ inputs.bump }}"

      # `main` is a protected branch (PR-only, signed commits required), so a
      # release never pushes a commit to it directly — that push is rejected with
      # GH013 "Cannot update this protected ref". Instead:
      #   - `existing` (the version is already on main via its own PR) records
      #     nothing new here; the tag + Release below capture the release point.
      #   - patch/minor/major bump the manifests to a version that is NOT yet on
      #     main, so they open a follow-up PR with the bump instead of pushing.
      # The release tag itself is created from the released commit by the
      # `Create GitHub Release` step via the API, which branch protection allows.
      - name: Open version-bump PR (patch/minor/major only)
        if: steps.release.outputs.published == 'true' && inputs.bump != 'existing'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          npm install --package-lock-only --ignore-scripts
          git add packages/*/package.json alias-cezarion/package.json package-lock.json
          git commit -m "chore(release): v${VERSION}"
          git push origin "$BRANCH"
          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "chore(release): v${VERSION}" \
            --body "Record the \`v${VERSION}\` version bump that the Release workflow published to npm \`latest\`. Merge to keep \`${{ github.ref_name }}\`'s manifests in sync with the published version."

      - name: Create GitHub Release
        if: steps.release.outputs.published == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ steps.release.outputs.version }}
          PUBLISHED_NAMES: ${{ steps.release.outputs.publishedNames }}
          ALIAS_NAME: ${{ steps.release.outputs.aliasName }}
        with:
          script: |
            const version = process.env.RESULT;
            const alias = process.env.ALIAS_NAME;
            const published = (process.env.PUBLISHED_NAMES ?? '').split(',').filter(Boolean);
            const rows = published.map((name) => `| \`${name}\` | \`${version}\` |`);
            const body = [
              '## Published packages',
              '',
              '| Package | Version |',
              '|---|---|',
              ...rows,
              '',
              '### Install',
              '',
              '```bash',
              `npx ${alias}@${version}`,
              '```',
            ].join('\n');
            // Creates the tag at the released commit if it doesn't exist yet —
            // this is the release's only write to the repo, and one the branch
            // protection ruleset permits (unlike a direct push to main).
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `v${version}`,
              body,
              draft: false,
              prerelease: false,
            });

      - name: Write workflow summary
        if: always() && steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          ALIAS_NAME: ${{ steps.release.outputs.aliasName }}
        run: |
          {
            echo "## 🚀 Release ${VERSION}"
            echo ""
            if [ "$PUBLISHED" = "true" ]; then
              echo "Published \`${ALIAS_NAME}@${VERSION}\` to \`latest\` and tagged \`v${VERSION}\`."
            else
              echo "⚠️ Dry run — nothing was published. See \`docs/publishing.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
