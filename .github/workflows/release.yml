name: Release

# Stable `latest` releases are owner-driven and MANUAL — never a push
# (spec .ai/specs/2026-07-18-npm-preview-publish.md, #482). Pushes to `develop`
# and same-repo PRs publish previews via ci.yml's `publish-snapshot`; only this
# workflow moves the `latest` dist-tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (`existing` publishes the version already in packages/cezar/package.json)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - existing

# Default-read at the workflow level; the publish job elevates what it needs.
# Verify stays read-only so a suite run never holds the release OIDC token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Vitest's github-actions reporter appends `## Vitest Test Report` to
  # $GITHUB_STEP_SUMMARY. Keeping Verify in the same job as Publish meant a
  # registry blip after a green suite failed the whole job and, on re-run,
  # left a second / false-failing report next to the passing one (#62).
  # Split like ci.yml: the suite owns one green job; publish is a dependent.
  verify:
    name: Verify before release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Releases from `main` (the stable trunk) or a `release/*` maintenance branch —
    # the latter is how a patch line (e.g. `release/0.9.x`) ships fixes without the
    # newer features already merged to `main`. Dispatch from the BRANCH, never a tag:
    # workflow_dispatch reads this file from the ref it runs on, and a tag's copy is
    # frozen, so a tag would still evaluate the old gate.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run server and cockpit unit suites
        run: npm test

      - name: Build application
        run: npm run build

  release:
    name: Release ${{ inputs.bump }} to npm (latest)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    # Gate the publish behind a required-reviewer approval. If the environment
    # isn't configured yet, GitHub creates it on first use without reviewers
    # (non-blocking); add reviewers at Settings → Environments → production.
    environment: production
    permissions:
      contents: write # create the release tag + GitHub Release via the API
      id-token: write # npm trusted publishing (OIDC) + provenance
      pull-requests: write # open the version-bump PR for patch/minor/major releases

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Publish release
        id: release
        # No npm credential in this job. npm authenticates via OIDC trusted
        # publishing (package settings → Trusted Publisher → release.yml /
        # production). Snapshots and nightlies keep the token — one publisher
        # per package, and dist-tag cleanup is not an OIDC command. See
        # docs/publishing.md.
        run: node scripts/release.mjs "${{ inputs.bump }}"

      # Keep protected branches PR-only. Retries verify and reuse prior work;
      # a failed bump PR must not prevent the published version's Release.
      - name: Open version-bump PR (patch/minor/major only)
        id: bump_pr
        if: steps.release.outputs.published == 'true' && inputs.bump != 'existing'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BASE_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            await require('./.github/scripts/release-finalization.cjs').bumpPr({ github, context, core });

      - name: Create GitHub Release
        id: github_release
        if: ${{ !cancelled() && steps.release.outputs.published == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED_NAMES: ${{ steps.release.outputs.publishedNames }}
          ALIAS_NAME: ${{ steps.release.outputs.aliasName }}
        with:
          script: |
            await require('./.github/scripts/release-finalization.cjs').githubRelease({ github, context, core });

      - name: Write workflow summary
        if: always() && steps.release.outputs.version != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHED: ${{ steps.release.outputs.published }}
          ALIAS_NAME: ${{ steps.release.outputs.aliasName }}
          BUMP: ${{ inputs.bump }}
          PR_STATUS: ${{ steps.bump_pr.outputs.status }}
          PR_URL: ${{ steps.bump_pr.outputs.url }}
          PR_REASON: ${{ steps.bump_pr.outputs.reason }}
          RELEASE_STATUS: ${{ steps.github_release.outputs.status }}
          RELEASE_URL: ${{ steps.github_release.outputs.url }}
          RELEASE_REASON: ${{ steps.github_release.outputs.reason }}
          TAG_VERIFIED: ${{ steps.github_release.outputs.tag_verified }}
        with:
          script: |
            require('./.github/scripts/release-finalization.cjs').summary();
