name: CI performance benchmark
on:
  push:
    branches: ['bench/156-*']
permissions:
  contents: read
  actions: read
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check benchmark collector
        run: python -m unittest discover -s .github/benchmarks/156 -p 'test_*.py'
      - id: matrix
        run: echo "matrix=$(cat .github/benchmarks/156/campaign.json)" >> "$GITHUB_OUTPUT"
  measure:
    if: ${{ !startsWith(github.ref_name, 'bench/156-snapshot') && !startsWith(github.ref_name, 'bench/156-paired') && !startsWith(github.ref_name, 'bench/156-release') }}
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out fixed application baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ startsWith(github.ref_name, 'bench/156-rebalance') && '76429dcfbd0449ad5e09c116d7abb64bc2730b2c' || 'b1fe75911378dfe7816a7a83312c2acbdcf848f4' }}
          path: application
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Apply isolated experiment
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          case "$VARIANT" in
            current-shards-1|current-shards-2) ;;
            split-shards-1|split-shards-2)
              git -C application apply "$GITHUB_WORKSPACE/harness/.github/benchmarks/shard-balance/worker-wait-split.patch"
              cp harness/.github/benchmarks/shard-balance/split-durations.json application/.github/test-durations.json
              ;;
            refreshed-shards-1|refreshed-shards-2) cp harness/.github/benchmarks/shard-balance/refreshed-durations.json application/.github/test-durations.json ;;
            baseline|workers-4|workers-6|workers-8|build-reuse|shards-1|shards-2|shards-gate) ;;
            combined-shards-1|combined-shards-2|combined-shards-gate) git -C application apply "$GITHUB_WORKSPACE/harness/.github/benchmarks/156/combined.patch" ;;
            fixtures|splitting|setup|combined) git -C application apply "$GITHUB_WORKSPACE/harness/.github/benchmarks/156/$VARIANT.patch" ;;
            *) exit 1 ;;
          esac
      - name: Measure verification
        env:
          REPETITION: ${{ matrix.repetition }}
          VARIANT: ${{ matrix.variant }}
        run: |
          extra=()
          case "$VARIANT" in
            combined-shards-*) extra+=(--max-workers 4) ;;
            current-shards-*|refreshed-shards-*|split-shards-*) extra+=(--max-workers 4 --shard "${VARIANT##*-}") ;;
          esac
          python harness/.github/benchmarks/156/measure.py --root application --out results --variant "$VARIANT" "${extra[@]}"
      - name: Preserve raw results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-${{ matrix.variant }}-${{ matrix.repetition }}
          path: |
            results/*.json
            results/*.log
            results/*.time
          if-no-files-found: warn
      - name: Archive verified dependencies and build for reuse experiment
        if: success() && matrix.variant == 'baseline' && startsWith(github.ref_name, 'bench/156-workers')
        run: tar -czf verified.tgz -C application node_modules packages/cezar/dist packages/cezar/web/dist
      - name: Upload verified archive
        if: success() && matrix.variant == 'baseline' && startsWith(github.ref_name, 'bench/156-workers')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-${{ matrix.repetition }}
          path: verified.tgz
          compression-level: 0
  release-verify:
    name: measure (release-${{ matrix.provider }}, ${{ matrix.repetition }})
    needs: matrix
    if: ${{ startsWith(github.ref_name, 'bench/156-release') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: github
            runner: ubuntu-latest
            repetition: 1
          - provider: blacksmith
            runner: blacksmith-4vcpu-ubuntu-2404
            repetition: 1
          - provider: github
            runner: ubuntu-latest
            repetition: 2
          - provider: blacksmith
            runner: blacksmith-4vcpu-ubuntu-2404
            repetition: 2
          - provider: github
            runner: ubuntu-latest
            repetition: 3
          - provider: blacksmith
            runner: blacksmith-4vcpu-ubuntu-2404
            repetition: 3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out fixed application baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 252b749d464a8f630f7446a6ff29e6f8fa076b10
          path: application
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Measure release verification
        env:
          REPETITION: ${{ matrix.repetition }}
          VARIANT: release-${{ matrix.provider }}
        run: >-
          python harness/.github/benchmarks/156/measure.py
          --root application --out results --variant "$VARIANT" --phase release-verify
      - name: Preserve raw results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-release-${{ matrix.provider }}-${{ matrix.repetition }}
          path: |
            results/*.json
            results/*.log
            results/*.time
          if-no-files-found: warn
  paired:
    needs: matrix
    if: ${{ startsWith(github.ref_name, 'bench/156-paired') }}
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - name: Check out fixed baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b1fe75911378dfe7816a7a83312c2acbdcf848f4
          path: application-baseline
      - name: Check out fixed combined candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b1fe75911378dfe7816a7a83312c2acbdcf848f4
          path: application-combined
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Apply combined candidate
        run: git -C application-combined apply "$GITHUB_WORKSPACE/harness/.github/benchmarks/156/combined.patch"
      - name: Measure paired verification
        env:
          REPETITION: ${{ matrix.repetition }}
        run: |
          set +e
          run_baseline() {
            REPETITION="$REPETITION" python harness/.github/benchmarks/156/measure.py \
              --root application-baseline --out results/baseline --variant baseline
            baseline_status=$?
          }
          run_combined() {
            REPETITION="$REPETITION" python harness/.github/benchmarks/156/measure.py \
              --root application-combined --out results/combined --variant combined --max-workers 4
            combined_status=$?
          }
          baseline_status=0
          combined_status=0
          if (( REPETITION % 2 == 1 )); then
            run_baseline
            run_combined
          else
            run_combined
            run_baseline
          fi
          if (( baseline_status != 0 || combined_status != 0 )); then
            exit 1
          fi
      - name: Preserve baseline half
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-baseline-${{ matrix.repetition }}
          path: |
            results/baseline/*.json
            results/baseline/*.log
            results/baseline/*.time
          if-no-files-found: warn
      - name: Preserve combined half
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-combined-${{ matrix.repetition }}
          path: |
            results/combined/*.json
            results/combined/*.log
            results/combined/*.time
          if-no-files-found: warn
  snapshot:
    needs: measure
    if: ${{ always() && !cancelled() && (startsWith(github.ref_name, 'bench/156-workers') || startsWith(github.ref_name, 'bench/156-snapshot')) }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant: [snapshot-fresh, snapshot-reuse]
        repetition: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b1fe75911378dfe7816a7a83312c2acbdcf848f4
          path: application
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Download verified archive
        if: matrix.variant == 'snapshot-reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-${{ matrix.repetition }}
          github-token: ${{ github.token }}
          run-id: ${{ startsWith(github.ref_name, 'bench/156-snapshot') && '34272576293' || github.run_id }}
      - name: Extract verified archive
        if: matrix.variant == 'snapshot-reuse'
        run: tar -xzf verified.tgz -C application
      - name: Measure snapshot preparation and dry-run publication
        env:
          REPETITION: ${{ matrix.repetition }}
          VARIANT: ${{ matrix.variant }}
          CEZ_RELEASE_CHANNEL: nightly
          NIGHTLY_DATE: '20260908'
        run: python harness/.github/benchmarks/156/measure.py --root application --out results --variant "$VARIANT" --phase snapshot
      - name: Preserve raw snapshot results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-${{ matrix.variant }}-${{ matrix.repetition }}
          path: |
            results/*.json
            results/*.log
            results/*.time
