name: Desktop check

# Compiles and tests the desktop shell (packages/desktop) on every change to it. The shell sits
# OUTSIDE the pnpm workspaces, so the main CI job never sees it, and `desktop-release.yml` only
# runs on a `desktop-v*` tag — without this job the first thing to compile a change to
# `src-tauri/` would be the release itself, on every runner at once.
#
# Compiles, tests and builds review installers on macOS, Linux and Windows. No signing
# credentials are used; public signed installers are built only by desktop-release.

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'packages/desktop/**'
      - 'packages/cezar/src/home/identity.ts'
      - 'packages/cezar/src/home/switch.ts'
      - 'packages/cezar/scripts/product-identity.mjs'
      - '.github/workflows/desktop-check.yml'
      - '.github/workflows/desktop-release.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'packages/desktop/**'
      - 'packages/cezar/src/home/identity.ts'
      - 'packages/cezar/src/home/switch.ts'
      - 'packages/cezar/scripts/product-identity.mjs'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Desktop shell on ${{ matrix.name }} (${{ matrix.rebrand }})
    strategy:
      fail-fast: false
      matrix:
        rebrand: ['off', 'on']
        os: [macos-latest, ubuntu-22.04, windows-latest]
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04
          # Windows is where the shell differs most (no login shell, npm as a batch file,
          # junctions instead of symlinks) and where nobody on the team can run it by hand:
          # this leg is the evidence that it starts node, runs npm and links a version.
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      # The managed cockpit's floor (packages/cezar engines), which the shell also enforces.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned by SHA, so the action cannot read the toolchain from its own ref name.
          toolchain: stable

      - name: Cache cargo
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/desktop/src-tauri

      # The same list as desktop-release.yml's Linux leg.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Select the native identity
        working-directory: packages/desktop
        shell: bash
        env:
          DESKTOP_DRY_RUN: 'true'
        run: |
          node scripts/release-config.mjs --rebrand ${{ matrix.rebrand }}
          echo "TAURI_CONFIG=$(cat release-config.json)" >> "$GITHUB_ENV"

      - name: cargo check
        working-directory: packages/desktop/src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: packages/desktop/src-tauri
        run: cargo test --locked --lib

      # The tests that use the REAL node and npm: find Node, start a sidecar and hear its
      # health, install a package into a prefix with a space in it.
      - name: cargo test against node and npm
        working-directory: packages/desktop/src-tauri
        run: cargo test --locked --lib -- --ignored --test-threads=1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test installers
        working-directory: packages/desktop
        env:
          DESKTOP_DRY_RUN: 'true'
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/release-config.test.mjs scripts/build-metadata.test.mjs
          node scripts/release-config.mjs --rebrand ${{ matrix.rebrand }}
          npm run build -- --config release-config.json

      - name: Verify the compiled app identity
        working-directory: packages/desktop
        run: node scripts/assert-build-identity.mjs ${{ matrix.rebrand }}

      - name: Native authenticated profile transfer (macOS)
        if: runner.os == 'macOS' && matrix.rebrand == 'on'
        working-directory: packages/desktop
        # The fixture owns its two overlays and target tree.
        env:
          TAURI_CONFIG: '{}'
        run: node scripts/macos-bridge-smoke.mjs

      - name: Upload test installers (not public signed releases)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-test-${{ matrix.name }}-${{ matrix.rebrand }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Build old-ID bridge review installers
        if: matrix.rebrand == 'on'
        working-directory: packages/desktop
        shell: bash
        env:
          DESKTOP_DRY_RUN: 'true'
          TAURI_CONFIG: '{}'
        run: |
          bundle=src-tauri/target/release/bundle
          case "$RUNNER_OS" in
            macOS) platform=darwin; pattern="$bundle/macos/*.app" ;;
            Windows) platform=win32; pattern="$bundle/nsis/*-setup.exe" ;;
            Linux) platform=linux; pattern="$bundle/appimage/*.AppImage" ;;
          esac
          files=()
          while IFS= read -r file; do files+=("$file"); done < <(compgen -G "$pattern" | sort)
          if [ ${#files[@]} -ne 1 ]; then echo "::error::expected one new-ID payload"; exit 1; fi
          if [ "$platform" = "darwin" ]; then
            tar -czf bridge-new-app.tar.gz -C "$(dirname "${files[0]}")" "$(basename "${files[0]}")"
            files=(bridge-new-app.tar.gz)
          fi
          node scripts/prepare-bridge.mjs --platform "$platform" --payload "${files[0]}"
          rm -rf "$bundle"
          node scripts/release-config.mjs --bridge
          npm run build -- --config release-config.json

      - name: Upload old-ID bridge review installers
        if: matrix.rebrand == 'on'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-bridge-${{ matrix.name }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
