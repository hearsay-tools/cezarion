name: E2E spec map

# Builds the map from each cockpit source file to the browser specs that run it
# (hearsay-tools/cezarion#1816); `npm run test:e2e:affected` downloads the newest
# map from main. Not a required check and not in the merge queue: a red or missing
# run leaves the selector on its previous map, or on every spec.
# A pull request runs it only when it changes the capture itself. PR code
# receives no secrets and no persisted checkout credential.
on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/api-client/**'
      - 'packages/contract/**'
      - 'packages/cezar/src/**'
      - 'packages/cezar/scripts/**'
      - '.ai/scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-spec-map.yml'
  pull_request:
    paths:
      - 'packages/web/e2e/spec-map/**'
      - '.github/workflows/e2e-spec-map.yml'
  workflow_dispatch:

permissions: {}

# One push run at a time; a newer push waits and replaces any older waiting one.
concurrency:
  group: e2e-spec-map-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture:
    name: Capture spec evidence ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # Runner images can cache different LTS patch versions.
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The same bootstrap `npm run test:e2e` runs: install, the VITE_CEZ_E2E=1 build, the
      # server and the browser provider. A capture without a browser is no evidence.
      - name: Boot the test environment
        run: |
          sh .ai/scripts/test-env-up.sh
          node -e 'const d = JSON.parse(require("fs").readFileSync(".ai/qa/test-env.json", "utf8")); if (!d.browser?.installed) { console.error(d.browser?.notes || "agent-browser is unavailable"); process.exit(1) }'

      # A failed spec is still evidence: the map lists it as incomplete, and the selector
      # always runs it. The merge job refuses a map with too little evidence.
      - name: Run the browser suite with V8 function logs
        env:
          E2E_SPEC_MAP_LOG_DIR: ${{ runner.temp }}/spec-map/logs
        run: |
          set +e
          npm exec -- vitest run --config packages/web/e2e/spec-map/vitest.config.ts --shard="$SHARD/2" \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/spec-map/results.json"
          echo "The browser suite exited $?."

      - name: Build the cockpit again with source maps
        run: |
          NODE_ENV=production VITE_CEZ_E2E=1 npm run build -w @open-mercato/cezar-web -- \
            --outDir "$RUNNER_TEMP/spec-map/sourcemaps" --emptyOutDir --sourcemap hidden

      # `partial` first checks that the served bundle and the source-map build hold the same
      # JavaScript byte for byte, and fails when they do not.
      - name: Turn the logs into evidence
        run: |
          node packages/web/e2e/spec-map/build-map.ts partial \
            --logs "$RUNNER_TEMP/spec-map/logs" \
            --served .ai/qa/build/cezar/web/dist \
            --sourcemaps "$RUNNER_TEMP/spec-map/sourcemaps" \
            --results "$RUNNER_TEMP/spec-map/results.json" \
            --out "$RUNNER_TEMP/spec-map/partial/shard-$SHARD.json"

      - name: Upload the evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-spec-map-partial-${{ matrix.shard }}
          path: ${{ runner.temp }}/spec-map/partial/
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Build the spec map
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.11.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-spec-map-partial-*
          path: ${{ runner.temp }}/spec-map/partials

      # markdown.tsx renders the publication links artifact-project-links checks
      # (hearsay-tools/cezarion#1076): a map without that pair is not published.
      - name: Merge the evidence
        env:
          COMMIT: ${{ github.sha }}
        run: |
          node packages/web/e2e/spec-map/build-map.ts merge \
            --partials "$RUNNER_TEMP/spec-map/partials" \
            --commit "$COMMIT" \
            --out "$RUNNER_TEMP/spec-map/out/e2e-spec-map.json" \
            --expect packages/web/src/routes/task-thread/markdown.tsx=packages/web/e2e/artifact-project-links.e2e.ts

      - name: Upload the spec map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-spec-map
          path: ${{ runner.temp }}/spec-map/out/e2e-spec-map.json
          if-no-files-found: error
          retention-days: 30
