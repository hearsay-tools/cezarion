name: Vitest changed-selection pilot

# Temporary, advisory campaign. No PR, main, schedule or workflow_run trigger.
on:
  push:
    branches: [bench/vitest-changed-ae1a5042]
    paths:
      - .github/benchmarks/vitest-changed/**
      - .github/workflows/vitest-changed-pilot.yml

permissions:
  contents: read

concurrency:
  group: vitest-changed-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  campaign:
    name: Prepare advisory campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(node .github/benchmarks/vitest-changed/campaign.mjs)" >> "$GITHUB_OUTPUT"

  paired:
    name: Pilot ${{ matrix.id }} shard ${{ matrix.shard }}/4
    needs: campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.campaign.outputs.matrix) }}
    steps:
      - name: Check out frozen harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - name: Check out frozen application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.head }}
          path: application
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '12.11.2'
          package_json_file: application/package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: application/pnpm-lock.yaml
      - name: Install frozen dependencies
        working-directory: application
        run: pnpm install --frozen-lockfile
      - name: Build server dependencies
        working-directory: application
        run: npm run build:server
      - name: Measure both modes, retaining failures
        env:
          PILOT_CASE: ${{ matrix.id }}
          PILOT_SHARD: ${{ matrix.shard }}
          PILOT_FIRST: ${{ matrix.first }}
        run: >-
          node harness/.github/benchmarks/vitest-changed/measure.mjs
          --root application --output results
          --case "$PILOT_CASE" --shard "$PILOT_SHARD" --first "$PILOT_FIRST"
      - name: Preserve advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: changed-pilot-${{ matrix.id }}-${{ matrix.shard }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
