  results. The launch-read-outside-resolver rule family does not infer launch-source types through nested
  structural member paths with two or more property accesses before the launch field or copy operation (class
  fix: hearsay-tools/cezarion#2744). See packages/cezar/src/workflows/launch-read-resolver.types.testkit.ts
  for compiled handle and lifecycle-store alias controls (owner decision: option A)."
