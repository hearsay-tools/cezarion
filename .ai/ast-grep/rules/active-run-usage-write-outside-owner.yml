id: active-run-usage-write-outside-owner
language: typescript
severity: warning
message: Change ActiveRun usage only through usage-accounting.ts. Usage groups
  and their live views expose no writable storage (hearsay-tools/cezarion#2520).
files:
  - packages/cezar/src/**/*.ts
utils:
  group-type:
    kind: type_annotation
    any:
      - regex: \b(UsageGroup|UsageInvocation|UsageMapView|UsageSetView)\b
      - all:
          - has:
              stopBy: end
              kind: type_identifier
              pattern: $IMPORTED_GROUP_TYPE
          - inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                kind: import_specifier
                has:
                  field: name
                  regex: ^(UsageGroup|UsageInvocation|UsageMapView|UsageSetView)$
                all:
                  - has:
                      field: alias
                      pattern: $IMPORTED_GROUP_TYPE
  container-type:
    kind: type_annotation
    any:
      - regex: \b(ActiveRun)\b
      - all:
          - has:
              stopBy: end
              kind: type_identifier
              pattern: $IMPORTED_CONTAINER_TYPE
          - inside:
              kind: program
              stopBy: end
              has:
                stopBy: end
                kind: import_specifier
                has:
                  field: name
                  regex: ^(ActiveRun)$
                all:
                  - has:
                      field: alias
                      pattern: $IMPORTED_CONTAINER_TYPE
  typed-group-reference:
    kind: identifier
    pattern: $TYPED_GROUP_REF
    inside:
      stopBy:
        any: &a1
          - kind: function_declaration
          - kind: function_expression
          - kind: arrow_function
          - kind: method_definition
          - kind: program
      has:
        stopBy: end
        any:
          - all:
              - kind: required_parameter
              - has:
                  field: pattern
                  pattern: $TYPED_GROUP_REF
              - has:
                  field: type
                  matches: group-type
          - all:
              - kind: optional_parameter
              - has:
                  field: pattern
                  pattern: $TYPED_GROUP_REF
              - has:
                  field: type
                  matches: group-type
          - all:
              - kind: variable_declarator
              - has:
                  field: name
                  pattern: $TYPED_GROUP_REF
              - has:
                  field: type
                  matches: group-type
      any: *a1
  typed-container-reference:
    kind: identifier
    pattern: $TYPED_CONTAINER_REF
    inside:
      stopBy:
        any: &a2
          - kind: function_declaration
          - kind: function_expression
          - kind: arrow_function
          - kind: method_definition
          - kind: program
      has:
        stopBy: end
        any:
          - all:
              - kind: required_parameter
              - has:
                  field: pattern
                  pattern: $TYPED_CONTAINER_REF
              - has:
                  field: type
                  matches: container-type
          - all:
              - kind: optional_parameter
              - has:
                  field: pattern
                  pattern: $TYPED_CONTAINER_REF
              - has:
                  field: type
                  matches: container-type
          - all:
              - kind: variable_declarator
              - has:
                  field: name
                  pattern: $TYPED_CONTAINER_REF
              - has:
                  field: type
                  matches: container-type
      any: *a2
  factory-reference:
    kind: identifier
    pattern: $FACTORY_REF
    inside:
      stopBy:
        any:
          - kind: statement_block
          - kind: program
      has:
        stopBy: end
        kind: variable_declarator
        has:
          field: name
          pattern: $FACTORY_REF
        all:
          - has:
              field: value
              pattern: createActiveRun($$$)
      any:
        - kind: statement_block
        - kind: program
  active-lookup:
    any:
      - pattern: $MANAGER.active.get($$$)
      - pattern: $MANAGER.active.get($$$)!
      - pattern: createActiveRun($$$)
  container-base-reference:
    any:
      - matches: typed-container-reference
      - matches: factory-reference
      - matches: active-lookup
  container-bound-reference:
    kind: identifier
    pattern: $CONTAINER_BOUND_REF
    inside:
      stopBy:
        any:
          - kind: statement_block
          - kind: program
      has:
        stopBy: end
        kind: variable_declarator
        has:
          field: name
          pattern: $CONTAINER_BOUND_REF
        all:
          - has:
              field: value
              matches: container-base-reference
      any:
        - kind: statement_block
        - kind: program
  container-reference:
    any:
      - matches: container-base-reference
      - matches: container-bound-reference
  usage-receiver:
    any:
      - kind: identifier
        regex: ^(state|active)$
      - matches: container-reference
  getter-reference:
    any:
      - all:
          - kind: member_expression
          - has:
              field: property
              regex: ^(reportedClaudeCost|usageInvocation|startedTurns|recordedTurns)$
      - all:
          - kind: subscript_expression
          - has:
              field: index
              regex: ^["'](reportedClaudeCost|usageInvocation|startedTurns|recordedTurns)["']$
      - all:
          - kind: member_expression
          - has:
              field: property
              regex: ^usage$
          - has:
              field: object
              matches: usage-receiver
      - all:
          - kind: subscript_expression
          - has:
              field: index
              regex: ^["']usage["']$
          - has:
              field: object
              matches: usage-receiver
  group-base-reference:
    any:
      - matches: typed-group-reference
      - matches: getter-reference
      - all:
          - any:
              - kind: member_expression
              - kind: subscript_expression
              - kind: parenthesized_expression
              - kind: non_null_expression
          - not:
              has:
                stopBy: end
                kind: private_property_identifier
          - has:
              stopBy: end
              any:
                - matches: getter-reference
                - matches: typed-group-reference
  group-bound-reference:
    kind: identifier
    pattern: $GROUP_BOUND_REF
    inside:
      stopBy:
        any:
          - kind: statement_block
          - kind: program
      has:
        stopBy: end
        kind: variable_declarator
        has:
          field: name
          pattern: $GROUP_BOUND_REF
        all:
          - has:
              field: value
              matches: group-base-reference
      any:
        - kind: statement_block
        - kind: program
  destructured-reference:
    kind: identifier
    pattern: $DESTRUCTURED_REF
    inside:
      stopBy:
        any:
          - kind: statement_block
          - kind: program
      has:
        stopBy: end
        kind: variable_declarator
        has:
          field: name
          kind: object_pattern
          has:
            any:
              - all:
                  - kind: pair_pattern
                  - has:
                      field: key
                      regex: ^(usage|reportedClaudeCost|usageInvocation|startedTurns|recordedTurns)$
                  - has:
                      field: value
                      pattern: $DESTRUCTURED_REF
              - all:
                  - kind: shorthand_property_identifier_pattern
                  - pattern: $DESTRUCTURED_REF
                  - regex: ^(usage|reportedClaudeCost|usageInvocation|startedTurns|recordedTurns)$
        all:
          - has:
              field: value
              any:
                - matches: group-base-reference
                - matches: container-reference
      any:
        - kind: statement_block
        - kind: program
  group-reference:
    any:
      - matches: group-base-reference
      - matches: group-bound-reference
      - matches: destructured-reference
      - all:
          - any:
              - kind: member_expression
              - kind: subscript_expression
              - kind: parenthesized_expression
              - kind: non_null_expression
          - not:
              has:
                stopBy: end
                kind: private_property_identifier
          - has:
              stopBy: end
              any:
                - matches: group-bound-reference
                - matches: destructured-reference
  protected-reference:
    any:
      - matches: group-reference
      - matches: container-reference
  protected-member:
    all:
      - any:
          - kind: member_expression
            has:
              field: property
              regex: ^(usage|reportedClaudeCost|usageInvocation|observed|epoch|stepId|startedTurns|recordedTurns|size)$
          - kind: subscript_expression
            has:
              field: index
              regex: ^["'](usage|reportedClaudeCost|usageInvocation|observed|epoch|stepId|startedTurns|recordedTurns|size)["']$
      - not:
          has:
            field: property
            kind: private_property_identifier
      - not:
          has:
            stopBy: end
            kind: private_property_identifier
      - any:
          - matches: getter-reference
          - all:
              - any:
                  - kind: member_expression
                  - kind: subscript_expression
              - has:
                  field: object
                  matches: group-reference
rule:
  any:
    - all:
        - any:
            - kind: assignment_expression
            - kind: augmented_assignment_expression
        - has:
            field: left
            matches: protected-member
    - all:
        - kind: update_expression
        - has:
            field: argument
            matches: protected-member
    - all:
        - kind: unary_expression
        - regex: ^delete\b
        - has:
            field: argument
            matches: protected-member
    - all:
        - kind: call_expression
        - has:
            field: function
            any:
              - all:
                  - kind: member_expression
                  - has:
                      field: property
                      regex: ^(set|add|delete|clear)$
                  - has:
                      field: object
                      matches: group-reference
              - all:
                  - kind: subscript_expression
                  - has:
                      field: index
                      regex: ^["'](set|add|delete|clear)["']$
                  - has:
                      field: object
                      matches: group-reference
    - any:
        - all:
            - kind: as_expression
            - has:
                nthChild: 1
                matches: group-reference
        - all:
            - kind: type_assertion
            - has:
                stopBy: end
                matches: group-reference
        - all:
            - kind: as_expression
            - has:
                nthChild: 1
                kind: parenthesized_expression
                has:
                  kind: object
                  has:
                    kind: spread_element
                    has:
                      matches: group-reference
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: ^(Object\.(assign|defineProperty|defineProperties|setPrototypeOf)|Reflect\.(defineProperty|set|setPrototypeOf|deleteProperty))$
        - has:
            field: arguments
            has:
              nthChild: 1
              matches: protected-reference
        - not:
            all:
              - pattern: Object.defineProperty($CONTAINER, 'usage', $DESCRIPTOR)
              - inside:
                  kind: function_declaration
                  stopBy: end
                  has:
                    field: name
                    regex: ^createActiveRun$
    - all:
        - kind: public_field_definition
        - not:
            has:
              field: name
              kind: private_property_identifier
        - inside:
            kind: class_body
            inside:
              kind: class_declaration
              has:
                field: name
                regex: ^(UsageGroup|UsageInvocation|UsageMapView|UsageSetView)$
