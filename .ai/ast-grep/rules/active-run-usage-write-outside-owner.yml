rule:
  any:
    - all:
        - { any: [ { kind: assignment_expression }, { kind: augmented_assignment_expression } ] }
        - { has: { field: left, matches: protected-member } }
    - { all: [ { kind: update_expression }, { has: { field: argument, matches: protected-member } } ] }
    - all: [ { kind: unary_expression }, { regex: ^delete\b }, { has: { field: argument, matches: protected-member } } ]
    - all:
        - { kind: call_expression }
        - has:
            field: function
            any:
              - all:
                  - { kind: member_expression }
                  - has:
                      field: property
                      regex: ^(set|add|delete|clear|push|pop|shift|unshift|splice|sort|reverse|fill|copyWithin)$
                  - { has: { field: object, matches: group-reference } }
              - all:
                  - { kind: subscript_expression }
