          - { has: { stopBy: end, any: [ { matches: group-bound-reference }, { matches: destructured-reference } ] } }
  protected-reference: { any: [ { matches: group-reference }, { matches: container-reference } ] }
  indexed-group-member: { all: [ { kind: subscript_expression }, { has: { field: object, matches: group-reference } } ] }
  protected-member: { any: [ { matches: indexed-group-member }, { matches: named-group-member } ] }
