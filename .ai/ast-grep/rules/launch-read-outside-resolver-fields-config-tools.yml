                    inside:
                      kind: class_body
      - all:
          - any:
              - all:
                  - any:
                      - kind: statement_block
                      - kind: formal_parameters
                  - inside:
                      kind: method_definition
                      inside:
                        kind: class_body
                        inside: { pattern: $CLASS_SCOPE, stopBy: end }
              - inside:
                  field: value
                  kind: public_field_definition
                  inside:
                    kind: class_body
                    inside: { pattern: $CLASS_SCOPE, stopBy: end }
              - all:
                  - kind: class_static_block
                  - inside:
                      kind: class_body
                      inside: { pattern: $CLASS_SCOPE, stopBy: end }
  normalize-step-root-type:
    any:
      - all:
          - { kind: type_identifier, pattern: $ROOT_STEP_TYPE }
          - regex: ^(WorkflowStepDef|WorkerStepIdentity)$
