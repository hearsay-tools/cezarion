                          matches: lr-nested-scope
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - has:
                          any:
                            - all:
                                - any:
                                    - kind: type_alias_declaration
                                    - kind: interface_declaration
                                    - kind: class_declaration
                                - has: { field: name, kind: type_identifier, pattern: $ROOT_CONFIG_TYPE }
                            - all:
                                - kind: import_specifier
                                - any:
                                    - has: { field: alias, pattern: $ROOT_CONFIG_TYPE }
                                    - has: { field: name, kind: type_identifier, pattern: $ROOT_CONFIG_TYPE }
                          stopBy:
                            matches: lr-nested-scope
