          - not:
              inside:
                has:
                  field: type_parameters
                  has:
                    kind: type_parameter
                    has: { field: name, pattern: $ROOT_CONFIG_TYPE }
                stopBy: end
      - all:
          - { kind: type_identifier, pattern: $ROOT_CONFIG_TYPE }
          - all:
              - inside:
                  all:
                    - matches: lr-lexical-scope
                    - pattern: $ROOT_CONFIG_SCOPE
                    - has:
                        all:
                          - kind: import_specifier
                          - has: { field: alias, pattern: $ROOT_CONFIG_TYPE }
                          - has: { field: name, regex: ^(CezConfig|LaunchConfig)$ }
