  normalize-binding-pattern:
    any:
      - all:
          - any:
              - kind: identifier
              - kind: shorthand_property_identifier_pattern
          - pattern: $SOURCE
      - all:
          - any:
              - kind: object_pattern
              - kind: array_pattern
              - kind: rest_pattern
          - has:
              matches: normalize-binding-pattern
      - all:
          - kind: pair_pattern
          - has: { field: value, matches: normalize-binding-pattern }
      - all:
          - any:
              - kind: assignment_pattern
              - kind: object_assignment_pattern
          - has: { field: left, matches: normalize-binding-pattern }
