# Semantic utils generated from ../launch-read-normalization/; edit that source.
language: typescript
severity: warning
message: "Production-source read rule; test and testkit readers observe ownership and error behavior outside
  production selection. Use narrow phase operations in launch-read-resolver.ts at the original read point. The
  launch-read-outside-resolver rule family does not follow arbitrary aliases of context.store.getRun()
  results. The launch-read-outside-resolver rule family does not infer launch-source types through nested
  structural member paths with two or more property accesses before the launch field or copy operation (class
  fix: hearsay-tools/cezarion#2744). See packages/cezar/src/workflows/launch-read-resolver.types.testkit.ts
  for compiled handle and lifecycle-store alias controls (owner decision: option A)."
files:
  - packages/cezar/src/workflows/run.ts
  - packages/cezar/src/workflows/run/**/*.ts
ignores:
  - packages/cezar/src/workflows/run/launch-read-resolver.ts
  - packages/cezar/src/**/*.test.ts
  - packages/cezar/src/**/*.testkit.ts
id: launch-read-outside-resolver-fields-config-tools
utils:
  normalize-config-receiver:
    any:
      - matches: normalize-config-assertion
      - matches: normalize-config-reference
      - all:
          - matches: lr-expression-wrapper
          - has:
              matches: normalize-config-receiver
      - matches: normalize-config-member-receiver
  normalize-step-receiver:
    any:
      - matches: normalize-step-assertion
      - matches: normalize-step-reference
      - all:
          - matches: lr-expression-wrapper
          - has:
              matches: normalize-step-receiver
      - matches: normalize-step-member-receiver
  normalize-config-assertion:
    all:
      - matches: lr-assertion-wrapper
      - has:
          matches: normalize-config-type
  normalize-config-reference:
    all:
      - { kind: identifier, pattern: $SOURCE }
      - any:
          - all:
              - regex: ^(config|configHandle)$
              - not:
                  inside:
                    stopBy: end
                    all:
                      - matches: lr-lexical-scope
                      - matches: normalize-scope-declares-value
          - all:
              - inside:
                  all:
                    - matches: lr-lexical-scope
                    - pattern: $VALUE_CONFIG_SCOPE
                    - any:
                        - has:
                            any:
                              - all:
                                  - matches: normalize-value-declaration
                                  - has: { field: type, matches: normalize-config-type }
                              - all:
                                  - kind: variable_declarator
                                  - has: { field: name, kind: identifier, pattern: $SOURCE }
                                  - has: { field: value, matches: normalize-config-asserted-expression }
                            stopBy:
                              matches: lr-nested-scope
                        - all:
                            - matches: lr-function-scope
                            - has:
                                all:
                                  - matches: normalize-hoisted-var-declaration
                                  - any:
                                      - all:
                                          - matches: normalize-value-declaration
                                          - has: { field: type, matches: normalize-config-type }
                                      - all:
                                          - kind: variable_declarator
                                          - has: { field: name, kind: identifier, pattern: $SOURCE }
                                          - has: { field: value, matches: normalize-config-asserted-expression }
                                stopBy:
                                  matches: lr-function-boundary
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - matches: normalize-scope-declares-value
                      - inside: { pattern: $VALUE_CONFIG_SCOPE, stopBy: end }
                    stopBy: end
  normalize-config-member-receiver:
    all:
      - any:
          - kind: member_expression
          - kind: subscript_expression
      - any:
          - has: { field: property, pattern: $MEMBER }
          - has:
              field: index
              kind: string
              has: { kind: string_fragment, pattern: $MEMBER }
      - has: { field: object, matches: normalize-config-property-holder }
  normalize-step-assertion:
    all:
      - matches: lr-assertion-wrapper
      - has:
          matches: normalize-step-type
  normalize-step-reference:
    all:
      - { kind: identifier, pattern: $SOURCE }
      - any:
          - all:
              - regex: ^(step|toolsStep|stepIdentity)$
              - not:
                  inside:
                    stopBy: end
                    all:
                      - matches: lr-lexical-scope
                      - matches: normalize-scope-declares-value
          - all:
              - inside:
                  all:
                    - matches: lr-lexical-scope
                    - pattern: $VALUE_STEP_SCOPE
                    - any:
                        - has:
                            any:
                              - all:
                                  - matches: normalize-value-declaration
                                  - has: { field: type, matches: normalize-step-type }
                              - all:
                                  - kind: variable_declarator
                                  - has: { field: name, kind: identifier, pattern: $SOURCE }
                                  - has: { field: value, matches: normalize-step-asserted-expression }
                            stopBy:
                              matches: lr-nested-scope
                        - all:
                            - matches: lr-function-scope
                            - has:
                                all:
                                  - matches: normalize-hoisted-var-declaration
                                  - any:
                                      - all:
                                          - matches: normalize-value-declaration
                                          - has: { field: type, matches: normalize-step-type }
                                      - all:
                                          - kind: variable_declarator
                                          - has: { field: name, kind: identifier, pattern: $SOURCE }
                                          - has: { field: value, matches: normalize-step-asserted-expression }
                                stopBy:
                                  matches: lr-function-boundary
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - matches: normalize-scope-declares-value
                      - inside: { pattern: $VALUE_STEP_SCOPE, stopBy: end }
                    stopBy: end
  normalize-step-member-receiver:
    all:
      - any:
          - kind: member_expression
          - kind: subscript_expression
      - any:
          - has: { field: property, pattern: $MEMBER }
          - has:
              field: index
              kind: string
              has: { kind: string_fragment, pattern: $MEMBER }
      - has: { field: object, matches: normalize-step-property-holder }
  normalize-config-type:
    any:
      - matches: normalize-config-root-type
      - all:
          - { kind: type_identifier, pattern: $REF_CONFIG_TYPE }
          - all:
              - inside:
                  all:
                    - matches: lr-lexical-scope
                    - pattern: $REF_CONFIG_SCOPE
                    - has:
                        all:
                          - kind: type_alias_declaration
                          - has: { field: name, kind: type_identifier, pattern: $REF_CONFIG_TYPE }
                          - has: { field: value, matches: normalize-config-root-type }
                        stopBy:
                          matches: lr-nested-scope
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - has:
                          any:
                            - all:
                                - any:
                                    - kind: type_alias_declaration
                                    - kind: interface_declaration
                                    - kind: class_declaration
                                - has: { field: name, kind: type_identifier, pattern: $REF_CONFIG_TYPE }
                            - all:
                                - kind: import_specifier
                                - any:
                                    - has: { field: alias, pattern: $REF_CONFIG_TYPE }
                                    - has: { field: name, kind: type_identifier, pattern: $REF_CONFIG_TYPE }
                          stopBy:
                            matches: lr-nested-scope
                      - inside: { pattern: $REF_CONFIG_SCOPE, stopBy: end }
                    stopBy: end
          - not:
              inside:
                all:
                  - has:
                      field: type_parameters
                      has:
                        kind: type_parameter
                        has: { field: name, pattern: $REF_CONFIG_TYPE }
                  - inside: { pattern: $REF_CONFIG_SCOPE, stopBy: end }
                stopBy: end
      - all:
          - matches: lr-type-wrapper
          - has:
              matches: normalize-config-type
      - all:
          - matches: lr-view-type-wrapper
          - has:
              kind: type_arguments
              has:
                matches: normalize-config-type
  normalize-scope-declares-value:
    any:
      - has:
          matches: normalize-lexical-value-declaration
          stopBy:
            matches: lr-nested-scope
      - all:
          - matches: lr-function-scope
          - has:
              matches: normalize-hoisted-var-declaration
              stopBy:
                matches: lr-function-boundary
  normalize-value-declaration:
    any:
      - all:
          - any:
              - kind: required_parameter
              - kind: optional_parameter
          - has: { field: pattern, matches: normalize-binding-pattern }
      - all:
          - kind: variable_declarator
          - has: { field: name, matches: normalize-binding-pattern }
      - all:
          - any:
              - kind: function_declaration
              - kind: generator_function_declaration
              - kind: class_declaration
              - kind: enum_declaration
              - kind: internal_module
          - has: { field: name, pattern: $SOURCE }
      - all:
          - any:
              - kind: identifier
              - kind: type_identifier
          - pattern: $SOURCE
          - inside:
              any:
                - all:
                    - kind: function_declaration
                    - has: { field: name, pattern: $SOURCE }
                - all:
                    - kind: generator_function_declaration
                    - has: { field: name, pattern: $SOURCE }
                - all:
                    - kind: class_declaration
                    - has: { field: name, pattern: $SOURCE }
                - all:
                    - kind: enum_declaration
                    - has: { field: name, pattern: $SOURCE }
                - all:
                    - kind: internal_module
                    - has: { field: name, pattern: $SOURCE }
                - all:
                    - kind: function_expression
                    - has: { field: name, pattern: $SOURCE }
                - all:
                    - kind: generator_function
                    - has: { field: name, pattern: $SOURCE }
                - all:
                    - kind: class
                    - has: { field: name, pattern: $SOURCE }
      - all:
          - matches: normalize-binding-pattern
          - inside:
              all:
                - kind: catch_clause
                - has: { field: parameter, matches: normalize-binding-pattern }
      - all:
          - matches: normalize-binding-pattern
          - inside:
              all:
                - kind: for_in_statement
                - has: { field: kind, regex: ^(const|let|var)$ }
                - has: { field: left, matches: normalize-binding-pattern }
      - all:
          - kind: import_clause
          - has: { kind: identifier, pattern: $SOURCE }
      - all:
          - kind: namespace_import
          - has: { kind: identifier, pattern: $SOURCE }
      - all:
          - kind: import_specifier
          - any:
              - has: { field: alias, pattern: $SOURCE }
              - all:
                  - not:
                      has: { field: alias, kind: identifier }
                  - has: { field: name, pattern: $SOURCE }
  normalize-config-asserted-expression:
    any:
      - matches: normalize-config-assertion
      - all:
          - matches: lr-expression-wrapper
          - has:
              matches: normalize-config-asserted-expression
  normalize-hoisted-var-declaration:
    any:
      - all:
          - kind: variable_declarator
          - has: { field: name, matches: normalize-binding-pattern }
          - inside:
              kind: variable_declaration
      - all:
          - kind: for_in_statement
          - has: { field: kind, regex: ^var$ }
          - has: { field: left, matches: normalize-binding-pattern }
  normalize-config-property-holder:
    any:
      - all:
          - { kind: identifier, pattern: $SOURCE }
          - all:
              - inside:
                  all:
                    - matches: lr-lexical-scope
                    - pattern: $HOLDER_VALUE_SCOPE
                    - any:
                        - has:
                            all:
                              - matches: normalize-value-declaration
                              - has: { field: type, matches: normalize-config-property-type }
                            stopBy:
                              matches: lr-nested-scope
                        - all:
                            - matches: lr-function-scope
                            - has:
                                all:
                                  - matches: normalize-hoisted-var-declaration
                                  - all:
                                      - matches: normalize-value-declaration
                                      - has: { field: type, matches: normalize-config-property-type }
                                stopBy:
                                  matches: lr-function-boundary
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - matches: normalize-scope-declares-value
                      - inside: { pattern: $HOLDER_VALUE_SCOPE, stopBy: end }
                    stopBy: end
      - all:
          - kind: this
          - inside:
              all:
                - kind: class_body
                - pattern: $CLASS_SCOPE
                - has:
                    any:
                      - all:
                          - any:
                              - kind: property_signature
                              - kind: public_field_definition
                          - has: { field: name, pattern: $MEMBER }
                          - has: { field: type, matches: normalize-config-type }
                      - all:
                          - kind: method_definition
                          - has: { field: name, regex: ^constructor$ }
                          - has:
                              field: parameters
                              kind: formal_parameters
                              has:
                                all:
                                  - any:
                                      - kind: required_parameter
                                      - kind: optional_parameter
                                  - has: { field: pattern, pattern: $MEMBER }
                                  - has: { field: type, matches: normalize-config-type }
                                  - any:
                                      - has:
                                          kind: accessibility_modifier
                                      - regex: ^readonly\s
                    stopBy:
                      matches: lr-nested-scope
              stopBy: end
          - not:
              inside:
                all:
                  - matches: normalize-this-binding-boundary
                  - inside: { pattern: $CLASS_SCOPE, stopBy: end }
                stopBy: end
      - all:
          - matches: lr-expression-wrapper
          - has:
              matches: normalize-config-property-holder
      - all:
          - matches: lr-assertion-wrapper
          - has:
              matches: normalize-config-property-type
  normalize-step-type:
    any:
      - matches: normalize-step-root-type
      - all:
          - { kind: type_identifier, pattern: $REF_STEP_TYPE }
          - all:
              - inside:
                  all:
                    - matches: lr-lexical-scope
                    - pattern: $REF_STEP_SCOPE
                    - has:
                        all:
                          - kind: type_alias_declaration
                          - has: { field: name, kind: type_identifier, pattern: $REF_STEP_TYPE }
                          - has: { field: value, matches: normalize-step-root-type }
                        stopBy:
                          matches: lr-nested-scope
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - has:
                          any:
                            - all:
                                - any:
                                    - kind: type_alias_declaration
                                    - kind: interface_declaration
                                    - kind: class_declaration
                                - has: { field: name, kind: type_identifier, pattern: $REF_STEP_TYPE }
                            - all:
                                - kind: import_specifier
                                - any:
                                    - has: { field: alias, pattern: $REF_STEP_TYPE }
                                    - has: { field: name, kind: type_identifier, pattern: $REF_STEP_TYPE }
                          stopBy:
                            matches: lr-nested-scope
                      - inside: { pattern: $REF_STEP_SCOPE, stopBy: end }
                    stopBy: end
          - not:
              inside:
                all:
                  - has:
                      field: type_parameters
                      has:
                        kind: type_parameter
                        has: { field: name, pattern: $REF_STEP_TYPE }
                  - inside: { pattern: $REF_STEP_SCOPE, stopBy: end }
                stopBy: end
      - all:
          - matches: lr-type-wrapper
          - has:
              matches: normalize-step-type
      - all:
          - matches: lr-view-type-wrapper
          - has:
              kind: type_arguments
              has:
                matches: normalize-step-type
  normalize-step-asserted-expression:
    any:
      - matches: normalize-step-assertion
      - all:
          - matches: lr-expression-wrapper
          - has:
              matches: normalize-step-asserted-expression
  normalize-step-property-holder:
    any:
      - all:
          - { kind: identifier, pattern: $SOURCE }
          - all:
              - inside:
                  all:
                    - matches: lr-lexical-scope
                    - pattern: $HOLDER_VALUE_SCOPE
                    - any:
                        - has:
                            all:
                              - matches: normalize-value-declaration
                              - has: { field: type, matches: normalize-step-property-type }
                            stopBy:
                              matches: lr-nested-scope
                        - all:
                            - matches: lr-function-scope
                            - has:
                                all:
                                  - matches: normalize-hoisted-var-declaration
                                  - all:
                                      - matches: normalize-value-declaration
                                      - has: { field: type, matches: normalize-step-property-type }
                                stopBy:
                                  matches: lr-function-boundary
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - matches: normalize-scope-declares-value
                      - inside: { pattern: $HOLDER_VALUE_SCOPE, stopBy: end }
                    stopBy: end
      - all:
          - kind: this
          - inside:
              all:
                - kind: class_body
                - pattern: $CLASS_SCOPE
                - has:
                    any:
                      - all:
                          - any:
                              - kind: property_signature
                              - kind: public_field_definition
                          - has: { field: name, pattern: $MEMBER }
                          - has: { field: type, matches: normalize-step-type }
                      - all:
                          - kind: method_definition
                          - has: { field: name, regex: ^constructor$ }
                          - has:
                              field: parameters
                              kind: formal_parameters
                              has:
                                all:
                                  - any:
                                      - kind: required_parameter
                                      - kind: optional_parameter
                                  - has: { field: pattern, pattern: $MEMBER }
                                  - has: { field: type, matches: normalize-step-type }
                                  - any:
                                      - has:
                                          kind: accessibility_modifier
                                      - regex: ^readonly\s
                    stopBy:
                      matches: lr-nested-scope
              stopBy: end
          - not:
              inside:
                all:
                  - matches: normalize-this-binding-boundary
                  - inside: { pattern: $CLASS_SCOPE, stopBy: end }
                stopBy: end
      - all:
          - matches: lr-expression-wrapper
          - has:
              matches: normalize-step-property-holder
      - all:
          - matches: lr-assertion-wrapper
          - has:
              matches: normalize-step-property-type
  normalize-config-root-type:
    any:
      - all:
          - { kind: type_identifier, pattern: $ROOT_CONFIG_TYPE }
          - regex: ^(CezConfig|LaunchConfig)$
          - not:
              inside:
                matches: lr-lexical-scope
                stopBy: end
                has:
                  all:
                    - any:
                        - kind: type_alias_declaration
                        - kind: interface_declaration
                        - kind: class_declaration
