            field: object
            any:
              - matches: normalize-config-receiver
    - all:
        - kind: subscript_expression
        - any:
            - has: { field: index, regex: "^['\"](baseBranch|worktreeSetup|defaultRunner|systemPrompt)['\"]$" }
