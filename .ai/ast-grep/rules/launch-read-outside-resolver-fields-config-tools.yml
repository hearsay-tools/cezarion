                              - has: { field: body, matches: normalize-config-property-root-type }
                        stopBy:
                          matches: lr-nested-scope
                  stopBy: end
              - not:
                  inside:
                    all:
                      - matches: lr-lexical-scope
                      - has:
                          all:
                            - any:
