                        - kind: interface_declaration
                        - kind: class_declaration
                    - has: { field: name, kind: type_identifier, pattern: $ROOT_STEP_TYPE }
                  stopBy:
                    matches: lr-nested-scope
          - not:
              inside:
                has:
                  field: type_parameters
                  has:
                    kind: type_parameter
                    has: { field: name, pattern: $ROOT_STEP_TYPE }
                stopBy: end
