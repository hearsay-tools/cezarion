id: run-internals
language: typescript
severity: error
message: >-
  runInternals and its testkit are retired: use public methods, fixture-owned dependencies and
  durable records (hearsay-tools/cezarion#2522). Making RunManager's private members ES #private,
  so that no other private access compiles or reads state, is tracked in hearsay-tools/cezarion#2700.
note: >-
  The rule reserves two retired names in TypeScript source. The name runInternals is refused in every
  leaf name node of the TypeScript grammar whose whole text is that name (value, property,
  shorthand, type, private and label names) and in every string fragment equal to it, such as a
  bracket or spy key, so every call, member, bracket, optional-chain,
  import, destructuring and type form is refused. The path text run-internals.testkit is refused in every
  string and template-literal fragment, so every static, dynamic and require import that spells it
  is refused, wherever the literal appears. A path assembled at run time from fragments that do not
  spell it is out of scope.
rule:
  any:
    - all:
        - any:
            - kind: identifier
            - kind: property_identifier
            - kind: shorthand_property_identifier
            - kind: shorthand_property_identifier_pattern
            - kind: type_identifier
            - kind: private_property_identifier
            - kind: statement_identifier
            - kind: string_fragment
        - regex: '^#?runInternals$'
    - all:
        - any:
            - kind: string_fragment
            - kind: string
            - kind: template_string
        - regex: 'run-internals\.testkit'
        - not:
            has:
              any:
                - kind: string_fragment
                - kind: template_substitution
              regex: 'run-internals\.testkit'
