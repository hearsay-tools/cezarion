id: run-internals
language: typescript
severity: error
message: >-
  Use public methods, fixture-owned dependencies and durable records instead of runInternals
  (hearsay-tools/cezarion#2522). Making RunManager's private members ES #private, so that
  no other private access compiles or reads state, is tracked in hearsay-tools/cezarion#2700.
utils:
  internals-testkit:
    kind: string
    regex: '(^|/)run-internals\.testkit(\.ts)?["\x27]$'
rule:
  any:
    - pattern: runInternals($$$)
    - pattern: (runInternals)($$$)
    - pattern: runInternals?.($$$)
    - pattern: $OBJ.runInternals($$$)
    - pattern: $OBJ?.runInternals($$$)
    - all:
        - kind: import_statement
        - has:
            field: source
            matches: internals-testkit
    - all:
        - pattern: import($SRC)
        - has:
            stopBy: end
            matches: internals-testkit
