id: run-internals
language: typescript
severity: error
message: >-
  runInternals and its testkit are retired: use public methods, fixture-owned dependencies and
  durable records (hearsay-tools/cezarion#2522). Making RunManager's private members ES #private,
  so that no other private access compiles or reads state, is tracked in hearsay-tools/cezarion#2700.
note: >-
  The rule refuses the retired name runInternals in every identifier position (calls in any
  wrapping, members, optional chains, imports, destructuring, shorthand properties) and any
  static import, dynamic import() or require() whose specifier (a string or template literal, in any wrapping)
  names run-internals.testkit. A specifier computed at run time is not a literal and is out of scope.
utils:
  internals-testkit:
    any:
      - kind: string
      - kind: template_string
    regex: '(^["\x27\x60]|/)run-internals\.testkit(\.ts)?["\x27\x60]$'
rule:
  any:
    - all:
        - any:
            - kind: identifier
            - kind: property_identifier
            - kind: shorthand_property_identifier
            - kind: shorthand_property_identifier_pattern
        - regex: '^runInternals$'
    - all:
        - kind: import_statement
        - has:
            field: source
            matches: internals-testkit
    - all:
        - kind: call_expression
        - has:
            field: function
            any:
              - kind: import
              - all:
                  - kind: identifier
                  - regex: '^require$'
        - has:
            field: arguments
            has:
              stopBy: end
              matches: internals-testkit
