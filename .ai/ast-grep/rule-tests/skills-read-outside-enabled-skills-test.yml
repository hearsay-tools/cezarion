id: skills-read-outside-enabled-skills
valid:
  # A write, and a read inside the one owner.
  - 'state.skills = []'
  - 'this.active.get(runId).skills = skills'
  - 'class A { private enabledSkills(state: ActiveRun) { return filter(state.skills ?? []) } }'
  - 'this.active.get(runId)!.skills = skills'
  # Not an ActiveRun: `launch.skills` and a bare local are other objects' fields, and another map's
  # lookup is not the live map's.
  - 'const skills = await this.discoverSkills()'
  - 'launch.skills.files'
  - 'const { skills } = launch'
  - 'const x = this.pending.get(runId)?.skills'
  - 'const x = this.active.get(runId)?.session'
invalid:
  # A direct lookup in the live map.
  - 'const x = this.active.get(runId)?.skills'
  - 'const x = this.active.get(runId)!.skills ?? []'
  - 'const x = this.active.get(runId).skills'
  - "const x = this.active.get(runId)?.['skills']"
  - 'const { skills } = this.active.get(runId)'
  - 'const x = state.skills'
  - 'const x = state?.skills ?? []'
  - 'state.skills = state.skills ?? []'
  - 'const x = active.skills'
  - 'const x = execution.state.skills'
  - "const x = state['skills']"
  - 'const { skills } = state'
  - 'class A { other(state: ActiveRun) { return state.skills } }'
