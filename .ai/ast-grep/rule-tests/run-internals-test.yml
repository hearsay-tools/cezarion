  - 'otherInternals(manager);'
  - 'import { helper } from "./other.testkit.ts"; helper(manager);'
  - 'const kit = await import("./other.testkit.ts"); kit.helper(manager);'
  - 'const label = "run-internals.testkit.ts";'
