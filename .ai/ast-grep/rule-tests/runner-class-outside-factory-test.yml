id: runner-class-outside-factory
valid:
  - "import { createRunner } from './core/runner-factory.ts'"
  - "import type { AgentSession } from '../../core/claude-cli-runner.ts'"
  - "export type { AgentSession } from '../core/claude-cli-runner.ts'"
  - "import { RUNNER_IDS, type RunnerFactory } from '../core/agent-runner.ts'"
  - "const kit = await import('../core/agent-runner.ts')"
  - "import { ScheduleRunner } from './schedule-runner.ts'"
  - "const runner = new ScheduleRunner(handle)"
  - "const runner = createRunner(backend)"
  - "const runner: ClaudeCliRunner = make()"
  - "type Session = import('../core/pi-runner.ts').PiSession"
  - "function close(session: import('../core/omp-runner.ts').OmpSession): void {}"
  - "// new PiRunner()"
invalid:
  - "const runner = new ClaudeCliRunner()"
  - "const runner = new CursorRunner({ sessionTransport })"
  - "const runner = new runners.PiRunner()"
  - "return backend === 'omp' ? new OmpRunner() : fallback"
  - "import { CodexAppServerRunner } from '../core/codex-app-server-runner.ts'"
  - "import { OpencodeServerRunner as Runner } from '../../core/opencode-server-runner.js'"
  - "import * as cursor from './core/cursor-print-runner.ts'"
  - "import { type AgentSession } from '../core/claude-cli-runner.ts'"
  - "import '../core/omp-runner.ts'"
  - "export { PiRunner } from '../core/pi-runner.ts'"
  - "export * from '../core/cursor-runner.ts'"
  - "const mod = await import('../core/pi-runner.ts')"
  - "const mod = require('../core/omp-runner.js')"
  - "const load = async () => { const { PiRunner } = await import('../core/pi-runner.ts'); return PiRunner }"
  - "const runner = made as import('../core/pi-runner.ts').PiRunner"
