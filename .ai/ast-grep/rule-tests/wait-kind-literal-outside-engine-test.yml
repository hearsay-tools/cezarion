  - "'timer' === wait?.kind"
  - "kind !== 'pr'"
  - "'timer' !== kind"
  - "wait.kind !== 'pr'"
  - "'timer' !== wait.kind"
  - "wait?.kind !== 'pr'"
  - "'timer' !== wait?.kind"
  - "kind == 'pr'"
